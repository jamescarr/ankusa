[package]
name = "ankusa-nats-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The published crate. No default features: the claim-check gateway is plain
# HTTP inside the compose network, so the client needs no TLS stack.
ankusa = { version = "0.3.0", default-features = false }
async-nats = "0.50.0"
base64 = "0.23.1"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
