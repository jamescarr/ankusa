# One config for every Ankusa container in the fleet example. Per-node values
# (roles, the segment key prefix, credentials) come from the environment, so
# `ankusa-a`, `ankusa-b` and `claim-check` run the same file.
#
#   - ankusa-a / ankusa-b : roles edge, dispatch, storage (the default), each
#                           with its own RocksDB store and its own
#                           `storage.key_prefix`, sharing one S3 bucket
#   - claim-check         : ANKUSA_ROLES=claim_check, the only reader of the
#                           shared bucket the consumer talks to
#
# Route definitions and API-managed sources live in Redis, so every edge node
# enforces the same ones. See ../README.md.

node:
  data_dir: /var/lib/ankusa

log:
  banner: false

admin:
  enabled: true
  port: 4002
  ip: 0.0.0.0
  # Demo: nothing publishes this port. Real deployments set auth.mode.
  auth: {mode: none, allow_insecure: true}

wal:
  type: disk

# Segments and claims share one bucket. Segment keys carry the node's prefix
# (`node-a/`, `node-b/`), claim keys never do, so the gateway finds the claims
# of both nodes.
storage:
  type: s3
  key_prefix: "${ANKUSA_STORAGE_KEY_PREFIX:-}"
  s3:
    bucket: "${S3_BUCKET}"
    region: us-east-1
    endpoint: "${S3_ENDPOINT}"
    access_key_id: "${S3_ACCESS_KEY_ID}"
    secret_access_key: "${S3_SECRET_ACCESS_KEY}"

claim_check:
  port: 4001
  ip: 0.0.0.0
  # Demo: the compose network is the boundary. Real deployments set auth.mode.
  auth: {mode: none, allow_insecure: true}

# Deny-by-default routing, shared by every edge node through Redis. The Redis
# store seeds a namespace once, on its first boot.
routes:
  enabled: true
  store:
    type: redis
    url: "${REDIS_URL}"
    namespace: ankusa:routes:fleet
  seed:
    - id: demo
      path: /webhooks/demo
      methods: [POST]

source_store:
  type: redis
  url: "${REDIS_URL}"
  namespace: ankusa:sources:fleet

# Provider event keys collapse fleet-wide: the node that receives an event claims
# its key in Redis before committing, so the same event retried on the other node
# is answered with the first hook's id instead of becoming a second hook. A Redis
# that is down or slow is answered from each node's own dedupe index.
dedupe:
  scope: fleet

fleet:
  store:
    url: "${REDIS_URL}"
    namespace: ankusa:fleet:fleet

sources:
  demo:
    verify: {type: none}
    on_verify_failure: accept_flag
    # The loadgen bodies carry a unique `id`; a provider retry repeats it, and
    # `dedupe.scope: fleet` collapses the retry on the other node into the first
    # hook (run.sh's `duplicate_hooks` is 0).
    dedupe: {json: id}
    sinks:
      - type: rabbitmq
        url: "${RABBITMQ_URL}"
        exchange: ankusa.events
        exchange_type: topic
        routing_key: ankusa.demo
        # Low so the fat hook the run sends takes the claim path.
        inline_max_bytes: 8192
