# The load balancer in front of the two edge nodes: plain round robin, the way
# a cloud load balancer would spread providers across the fleet.
#
# Each `server` carries `resolve`, so nginx re-resolves the name through
# Docker's DNS: a node that was killed and started again comes back on a new
# address and is picked up without a reload. A refused connection is tried on
# the other node (`proxy_next_upstream`), which is what a provider-facing LB
# does while a node is down.

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=2s ipv6=off;

  upstream ankusa {
    zone ankusa 64k;
    server ankusa-a:4000 resolve max_fails=1 fail_timeout=2s;
    server ankusa-b:4000 resolve max_fails=1 fail_timeout=2s;
  }

  server {
    listen 4000;

    location / {
      proxy_pass http://ankusa;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Only a connection that never reached a node is replayed on the other
      # one. A request a node received and then dropped is not: nginx cannot
      # know whether the hook was stored, and the provider's own retry owns
      # that case (the run sends one to the other node on purpose).
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 1s;

      client_max_body_size 16m;
    }
  }
}
