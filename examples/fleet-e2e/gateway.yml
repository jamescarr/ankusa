# The claim-check gateway's own config (`jamescarr/ankusa-gateway`, built from
# `packages/ankusa_gateway_server`). It is not a core node: `admin`, `wal`,
# `intake`, `routes`, `source_store`, `sources` and the rest of `ankusa.yml` are
# refused by the gateway image, and there is no `node.roles` to set. It reads the
# claims both edge nodes checked in, so the bucket has to be the same one.
#
# Claims are never key-prefixed, so the `storage.key_prefix` of `ankusa.yml` (a
# segment concern) has no counterpart here: the gateway reads `claims/` directly.
#
# See ../README.md.

config_version: 2

node:
  data_dir: /var/lib/ankusa

log:
  banner: false

# [env S3_*] The bucket the nodes check claims in to. `claim_check.store` is
# unset on both sides, so it defaults to this store.
storage:
  type: s3
  s3:
    bucket: "${S3_BUCKET}"
    region: us-east-1
    endpoint: "${S3_ENDPOINT}"
    access_key_id: "${S3_ACCESS_KEY_ID}"
    secret_access_key: "${S3_SECRET_ACCESS_KEY}"

# `ankusa.yml` sets no `claim_check.ref_signing_keys`, so the nodes mint unsigned
# v1 refs and the gateway serves them. A fleet that signs its refs (v2) lists the
# same keys under `claim_check.ref_signing_keys` in both files.

gateway:
  port: 4001
  ip: 0.0.0.0
  # Demo: the compose network is the boundary. Real deployments list
  # authenticators under auth.authenticators.
  auth: {allow_insecure: true}
