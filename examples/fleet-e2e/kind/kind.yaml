# The kind cluster `examples/fleet-e2e/kind.sh` runs the fleet on. One node; its
# NodePorts are published on loopback so the host-side load generator reaches the
# ingest Service (30080 -> 18180, the compose run uses 18080) and the consumer's
# Postgres (30433 -> 15434) without a port-forward that would die with a pod.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30080, hostPort: 18180, listenAddress: "127.0.0.1"}
      - {containerPort: 30433, hostPort: 15434, listenAddress: "127.0.0.1"}
