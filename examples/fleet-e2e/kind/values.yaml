# The chart's values for the fleet drill on kind (`examples/fleet-e2e/kind.sh`): the
# fleet of docker-compose.yml (`ankusa.yml`: shared Redis route, source and fleet
# stores, one bucket for segments and claims, a RabbitMQ sink, fleet-wide dedupe) as
# two StatefulSet pods and a claim-check gateway, without the intake log and the
# backup (the compose run's `--wal dual --kill-node` drills those).
image: {repository: ankusa-fleet-e2e, tag: kind, pullPolicy: IfNotPresent}
wal: {type: disk}
replicas: 2
# A kind node hands pods a limit of 10^9 open files, which the BEAM sizes its tables from.
nofile: 65536
perPodKeyPrefix: true
minReadySeconds: 0
persistence: {size: 1Gi}
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 768Mi}
service: {type: NodePort, nodePort: 30080}
claimCheck:
  enabled: true
  replicas: 1
  # The NetworkPolicy lets only the consumer's namespace reach 4001.
  allowInsecure: true
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
networkPolicy:
  operatorNamespaces: [ankusa-fleet-infra]
extraEnv:
  - {name: REDIS_URL, value: "redis://redis.ankusa-fleet-infra.svc:6379"}
  - {name: RABBITMQ_URL, value: "amqp://guest:guest@rabbitmq.ankusa-fleet-infra.svc:5672"}
  - {name: S3_ENDPOINT, value: "http://minio.ankusa-fleet-infra.svc:9000"}
  - {name: S3_ACCESS_KEY_ID, value: minioadmin}
  - {name: S3_SECRET_ACCESS_KEY, value: minioadmin}
config:
  storage:
    type: s3
    s3:
      bucket: ankusa-fleet
      region: us-east-1
      endpoint: "${S3_ENDPOINT}"
      access_key_id: "${S3_ACCESS_KEY_ID}"
      secret_access_key: "${S3_SECRET_ACCESS_KEY}"
  routes:
    enabled: true
    store:
      type: redis
      url: "${REDIS_URL}"
      namespace: ankusa:routes:fleet
    seed:
      - {id: demo, path: /webhooks/demo, methods: [POST]}
  source_store:
    type: redis
    url: "${REDIS_URL}"
    namespace: ankusa:sources:fleet
  dedupe: {scope: fleet}
  fleet:
    store:
      url: "${REDIS_URL}"
      namespace: ankusa:fleet:fleet
  sources:
    demo:
      verify: {type: none}
      on_verify_failure: accept_flag
      dedupe: {json: id}
      sinks:
        - type: rabbitmq
          url: "${RABBITMQ_URL}"
          exchange: ankusa.events
          exchange_type: topic
          routing_key: ankusa.demo
          # Low so the fat hooks the run sends take the claim path.
          inline_max_bytes: 8192
