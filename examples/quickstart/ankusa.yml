# The quickstart config: one open `demo` source producing to a Kafka topic, with
# large bodies checked in to the claim-check gateway on this same node.
# Every key, at its default: https://github.com/jamescarr/ankusa/blob/main/packages/ankusa_server/config-examples/reference.yml

node:
  roles: [edge, dispatch, storage, claim_check]
  data_dir: /var/lib/ankusa

admin:
  enabled: true
  port: 4002
  # the host's published port reaches it
  ip: 0.0.0.0
  # Demo: the host's published port is bound to 127.0.0.1 in docker-compose.yml.
  # Real deployments set auth.mode to token, jwt or mtls (docs/configuration.md).
  auth: {mode: none, allow_insecure: true}

claim_check:
  port: 4001
  # the worker calls http://ankusa:4001
  ip: 0.0.0.0
  # Demo: the compose network is the boundary. Real deployments set auth.mode.
  auth: {mode: none, allow_insecure: true}

# Short on purpose, so the dead-letter drill takes seconds, not minutes:
# 6 attempts over roughly 8-15s. The default retries for 24 hours (`max_elapsed_ms`), backing off to 5 min.
dispatch:
  # Off for the same reason: by default 5 failures in a row open the sink's
  # circuit breaker, which parks its hooks for 30 s (doubling, up to 5 min)
  # without spending attempts, so the drill would take minutes.
  breaker_failures: 0
  retry:
    base_ms: 1000
    max_ms: 4000
    max_attempts: 6

sources:
  demo:
    # Accepts anything, so it works before you have provider credentials.
    verify: {type: none}
    on_verify_failure: accept_flag
    sinks:
      - type: kafka
        brokers: [redpanda:9092]
        # Created by redpanda-bootstrap in docker-compose.yml: the sink never creates a topic.
        topic: ankusa.events
        # Low on purpose, so a ~20 KB hook takes the claim-check path.
        inline_max_bytes: 8192
