name: ankusa-rabbitmq-example

# Full deployed topology: N ingest servers (here, one) checking fat payloads
# in to S3 through the Claim Check gateway and publishing small messages to
# a RabbitMQ exchange, with a TypeScript consumer that owns its own
# queue/binding, redeems claim tickets over HTTP (no S3 credentials of its
# own), and prints what it receives.
#
#   docker compose up --build
#   curl -XPOST localhost:4000/webhooks/demo -H 'content-type: application/json' -d '{"id":"evt_1"}'
#   docker compose logs -f worker
#   docker compose down -v

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      AWS_DEFAULT_REGION: us-east-1

  s3-bootstrap:
    image: amazon/aws-cli:2.17.62
    depends_on: [floci]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://floci:4566
      ANKUSA_S3_BUCKET: ankusa-example
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws s3 ls >/dev/null 2>&1; do echo "waiting for floci..."; sleep 1; done
        aws s3 mb "s3://$$ANKUSA_S3_BUCKET" || true
        echo "s3 bucket $$ANKUSA_S3_BUCKET ready"

  # N ingest servers. `docker compose up --scale ingest=3` runs three of
  # them; they share nothing but the exchange and the bucket — no code
  # change, this is the same "durable state, not RPC" boundary the framework
  # uses everywhere else. (Ports would collide at 3+ without a load balancer
  # in front; that's a deployment concern, not a framework one.)
  ingest:
    build:
      context: ../..
      dockerfile: examples/rabbitmq-consumer/ingest_app/Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      s3-bootstrap:
        condition: service_completed_successfully
    environment:
      PORT: "4000"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: ankusa.events
      S3_BUCKET: ankusa-example
      S3_REGION: us-east-1
      S3_ENDPOINT: http://floci:4566
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      INLINE_MAX_BYTES: "8192"

  # The standalone `:claim_check`-role gateway — same image, `ANKUSA_ROLES`
  # is the only thing that changes. Same S3 bucket/credentials as `ingest`
  # (both are Ankusa nodes that hold them), but this is the only surface the
  # worker talks to: the worker below carries no S3 credentials at all.
  claim-check:
    build:
      context: ../..
      dockerfile: examples/rabbitmq-consumer/ingest_app/Dockerfile
    ports:
      - "4001:4001"
    depends_on:
      s3-bootstrap:
        condition: service_completed_successfully
    environment:
      ANKUSA_ROLES: claim_check
      CLAIM_CHECK_PORT: "4001"
      CLAIM_CHECK_TOKEN: dev-claim-check-token
      S3_BUCKET: ankusa-example
      S3_REGION: us-east-1
      S3_ENDPOINT: http://floci:4566
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test

  # "Client code we won't implement" — except we do implement a minimal,
  # real one so the example actually runs end to end. Declares its own
  # queue and binding; the ingest framework never knows this exists. Holds
  # no S3 credentials — fat payloads are redeemed through `claim-check`'s
  # HTTP API instead.
  worker:
    build:
      context: ./worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      claim-check:
        condition: service_started
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: ankusa.events
      ROUTING_PATTERN: "ankusa.#"
      QUEUE_NAME: ankusa-example-worker
      CLAIM_CHECK_URL: http://claim-check:4001
      CLAIM_CHECK_TOKEN: dev-claim-check-token
