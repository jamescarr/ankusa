name: ankusa-kafka-sqs-example

# Ingest produces to a Kafka topic (Redpanda); a Redpanda Connect bridge
# forwards it into an SQS FIFO queue (floci); a TypeScript worker consumes
# the queue and redeems fat payloads through the claim-check gateway, with
# no S3 credentials of its own.
#
#   docker compose up --build -d --wait
#   curl -XPOST localhost:4000/hooks/demo -H 'content-type: application/json' -d '{"id":"evt_1"}'
#   docker compose logs -f worker
#   docker compose down -v

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The topic belongs to ops, never to the sink: partition count is an
  # ordering and capacity decision (see Ankusa.Sink.Kafka). Idempotent, since
  # compose re-runs it whenever a dependent service (re)starts.
  redpanda-bootstrap:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - rpk topic create ankusa.events -X brokers=redpanda:9092 -p 6 -r 1
        || rpk topic describe ankusa.events -X brokers=redpanda:9092 >/dev/null

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.2
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"   # topic, messages, consumer group lag: http://localhost:8080
    environment:
      KAFKA_BROKERS: redpanda:9092

  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      AWS_DEFAULT_REGION: us-east-1

  # S3 bucket for claims and segments; SQS FIFO queue plus its DLQ.
  aws-bootstrap:
    image: amazon/aws-cli:2.17.62
    depends_on: [floci]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://floci:4566
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until aws s3 ls >/dev/null 2>&1; do echo "waiting for floci..."; sleep 1; done
        aws s3 mb s3://ankusa-example || true

        aws sqs create-queue --queue-name ankusa-worker-dlq.fifo --attributes FifoQueue=true >/dev/null
        dlq_arn=$$(aws sqs get-queue-attributes \
          --queue-url http://floci:4566/000000000000/ankusa-worker-dlq.fifo \
          --attribute-names QueueArn --query Attributes.QueueArn --output text)

        cat > /tmp/attrs.json <<EOF
        {
          "FifoQueue": "true",
          "ContentBasedDeduplication": "false",
          "VisibilityTimeout": "30",
          "RedrivePolicy": "{\"deadLetterTargetArn\":\"$$dlq_arn\",\"maxReceiveCount\":\"5\"}"
        }
        EOF
        aws sqs create-queue --queue-name ankusa-worker.fifo --attributes file:///tmp/attrs.json
        echo "bucket and queues ready"

  ingest:
    build:
      context: ../..
      dockerfile: examples/kafka-sqs-consumer/ingest_app/Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      redpanda-bootstrap:
        condition: service_completed_successfully
      aws-bootstrap:
        condition: service_completed_successfully
    environment:
      PORT: "4000"
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: ankusa.events
      S3_BUCKET: ankusa-example
      S3_REGION: us-east-1
      S3_ENDPOINT: http://floci:4566
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      INLINE_MAX_BYTES: "8192"

  # Same image, `:claim_check` role only: the one surface the worker calls.
  claim-check:
    build:
      context: ../..
      dockerfile: examples/kafka-sqs-consumer/ingest_app/Dockerfile
    ports:
      - "4001:4001"
    depends_on:
      aws-bootstrap:
        condition: service_completed_successfully
    environment:
      ANKUSA_ROLES: claim_check
      CLAIM_CHECK_PORT: "4001"
      CLAIM_CHECK_TOKEN: dev-claim-check-token
      S3_BUCKET: ankusa-example
      S3_REGION: us-east-1
      S3_ENDPOINT: http://floci:4566
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test

  bridge:
    image: docker.redpanda.com/redpandadata/connect:4.110.0
    depends_on:
      redpanda-bootstrap:
        condition: service_completed_successfully
      aws-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./bridge/bridge.yaml:/connect.yaml:ro
    command: ["run", "/connect.yaml"]

  # SQS credentials only (fake, floci). No S3 credentials: fat payloads are
  # redeemed through `claim-check`.
  worker:
    build:
      context: ./worker
    depends_on:
      aws-bootstrap:
        condition: service_completed_successfully
      claim-check:
        condition: service_started
    environment:
      SQS_QUEUE_URL: http://floci:4566/000000000000/ankusa-worker.fifo
      SQS_DLQ_URL: http://floci:4566/000000000000/ankusa-worker-dlq.fifo
      SQS_ENDPOINT: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      CLAIM_CHECK_URL: http://claim-check:4001
      CLAIM_CHECK_TOKEN: dev-claim-check-token
