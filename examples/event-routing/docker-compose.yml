name: ankusa-event-routing-example

# One source, routed by what the hook says it is: Ankusa reads the event type
# from the JSON body, names the Kafka topic by it (a template), and sends only
# invoice.paid to an HTTP receiver (a filter). The worker consumes both topics.
#
#   docker compose up --build -d --wait
#   ./run.sh
#   docker compose down -v

x-demo-secret: &demo-secret whsec_ZXZlbnQtcm91dGluZy1kZW1vLXNlY3JldC0zMmIhIQ==

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.5
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The topics belong to ops, never to the sink: a template can only name a topic
  # that already exists. Idempotent, since compose re-runs it whenever a
  # dependent service (re)starts.
  redpanda-bootstrap:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.5
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in events.invoice.paid events.other; do
          rpk topic create $$t -X brokers=redpanda:9092 -p 1 -r 1 \
            || rpk topic describe $$t -X brokers=redpanda:9092 >/dev/null
        done

  # The published image predates these keys until the next release, so this
  # builds the server from the checkout (the context is the repo root).
  ankusa:
    image: ${ANKUSA_IMAGE:-jamescarr/ankusa:dev}
    build:
      context: ../..
      dockerfile: packages/ankusa_server/Dockerfile
    ports:
      - "${INGEST_PORT:-4000}:4000"                  # ingest: the only port providers need
      - "127.0.0.1:${ADMIN_PORT:-4002}:4002"         # admin API: health, metrics, dead letters, GET /asyncapi.json
    environment:
      SINK_WHSEC: *demo-secret
    volumes:
      - ./ankusa.yml:/etc/ankusa/ankusa.yml:ro
      - ankusa-data:/var/lib/ankusa
    depends_on:
      redpanda-bootstrap:
        condition: service_completed_successfully
      receiver:
        condition: service_started

  # Reads both topics from the beginning and prints every message.
  worker:
    build:
      context: ../..                                      # repo root: file:-links packages/sdk-typescript
      dockerfile: examples/event-routing/worker/Dockerfile
    init: true
    environment:
      KAFKA_BROKERS: redpanda:9092
      # kafkajs 2.x arms a negative timer on Node 24 and Node prints a warning
      # for it on start; the client behaves normally.
      NODE_OPTIONS: --disable-warning=TimeoutNegativeWarning
    depends_on:
      redpanda-bootstrap:
        condition: service_completed_successfully

  # Verifies every delivery's signature with the sink's secret, and prints it.
  receiver:
    build:
      context: ../..
      dockerfile: examples/event-routing/receiver/Dockerfile
    init: true
    environment:
      PORT: "3000"
      SINK_WHSEC: *demo-secret

volumes:
  ankusa-data:
