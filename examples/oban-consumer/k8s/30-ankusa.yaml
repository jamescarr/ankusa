apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ankusa
  namespace: ankusa-e2e
  labels:
    app: ankusa
spec:
  serviceName: ankusa
  # Three self-contained nodes: every pod runs all three roles and owns its
  # WAL on its own PVC, so losing a pod loses no accepted envelope. The
  # Service round-robins webhooks across them; dispatch is at-least-once, and
  # the consumer is idempotent on the envelope id.
  replicas: 3
  # Parallel: bring all three up at once instead of serially — the PVCs are
  # independent, so there's nothing to order.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: ankusa
  template:
    metadata:
      labels:
        app: ankusa
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ankusa
          image: ankusa-oban-ingest:e2e
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              # Same k8s Service endpoint-removal race as the consumer
              # Deployment: give kube-proxy time to stop routing new
              # connections here before the listener actually closes.
              exec:
                command: ["sleep", "5"]
          env:
            - name: ANKUSA_ROLES
              value: "edge,dispatch,storage"
            - name: PORT
              value: "4000"
            - name: DATA_DIR
              value: "/data"
            - name: CONSUMER_URL
              value: "http://consumer/deliveries"
          ports:
            - containerPort: 4000
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ankusa
  namespace: ankusa-e2e
spec:
  type: NodePort
  selector:
    app: ankusa
  ports:
    - port: 80
      targetPort: 4000
      nodePort: 30080
