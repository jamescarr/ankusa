apiVersion: apps/v1
kind: Deployment
metadata:
  name: ankusa-edge
  namespace: ankusa-e2e
  labels:
    app: ankusa-edge
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ankusa-edge
  template:
    metadata:
      labels:
        app: ankusa-edge
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ankusa-edge
          image: ankusa-oban-ingest:e2e
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              # Same k8s Service endpoint-removal race as the consumer
              # Deployment: give kube-proxy time to stop routing new
              # connections here before the listener actually closes.
              exec:
                command: ["sleep", "5"]
          envFrom:
            # WAL=ra|postgres, WAL_RA_MEMBERS. run.sh writes this ConfigMap
            # before applying this file; `optional` keeps the manifest usable
            # on its own.
            - configMapRef:
                name: ankusa-wal
                optional: true
          env:
            - name: ANKUSA_ROLES
              value: "edge"
            - name: PORT
              value: "4000"
            - name: DATA_DIR
              value: "/data"
            - name: WAL_DB_HOST
              value: "postgres"
            - name: WAL_DB_PORT
              value: "5432"
            - name: WAL_DB_USER
              value: "ankusa"
            - name: WAL_DB_PASSWORD
              value: "ankusa"
            - name: WAL_DB_NAME
              value: "ankusa"
            - name: CONSUMER_URL
              value: "http://consumer/deliveries"
            # Erlang distribution, for the Ra WAL. An edge's node name only has
            # to be unique and reachable for the reply — the WAL nodes are the
            # ones others dial by name — so the pod IP is enough.
            - name: RELEASE_DISTRIBUTION
              value: "name"
            - name: RELEASE_NODE
              value: "ankusa@$(POD_IP)"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RELEASE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: ankusa-cookie
                  key: cookie
                  optional: true
          ports:
            - containerPort: 4000
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ankusa-edge
  namespace: ankusa-e2e
spec:
  type: NodePort
  selector:
    app: ankusa-edge
  ports:
    - port: 80
      targetPort: 4000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: ankusa-worker
  namespace: ankusa-e2e
spec:
  # Headless, so ankusa-worker-N.ankusa-worker resolves — the worker's
  # distribution name (and, with the Ra WAL, its membership identity).
  clusterIP: None
  selector:
    app: ankusa-worker
  ports:
    - port: 4370
      targetPort: 4370
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ankusa-worker
  namespace: ankusa-e2e
spec:
  serviceName: ankusa-worker
  # Two replicas: dispatch and storage each hold a lease on the cursor they own
  # (`:dispatch`, `:storage`), so all but one replica is a hot standby rather
  # than a second writer. With the Postgres WAL the lease contract is enforced
  # there too; with Ra it is replicated state.
  replicas: 2
  selector:
    matchLabels:
      app: ankusa-worker
  template:
    metadata:
      labels:
        app: ankusa-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ankusa-worker
          image: ankusa-oban-ingest:e2e
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ankusa-wal
                optional: true
          env:
            - name: ANKUSA_ROLES
              value: "dispatch,storage"
            - name: DATA_DIR
              value: "/data"
            - name: WAL_DB_HOST
              value: "postgres"
            - name: WAL_DB_PORT
              value: "5432"
            - name: WAL_DB_USER
              value: "ankusa"
            - name: WAL_DB_PASSWORD
              value: "ankusa"
            - name: WAL_DB_NAME
              value: "ankusa"
            - name: CONSUMER_URL
              value: "http://consumer/deliveries"
            - name: RELEASE_DISTRIBUTION
              value: "name"
            - name: RELEASE_NODE
              value: "ankusa@$(POD_NAME).ankusa-worker"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RELEASE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: ankusa-cookie
                  key: cookie
                  optional: true
          ports:
            - name: dist
              containerPort: 4370
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
