apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ankusa-e2e
data:
  create-consumer.sql: |
    CREATE DATABASE consumer;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ankusa-e2e
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "max_connections=300"]
          env:
            - name: POSTGRES_USER
              value: "ankusa"
            - name: POSTGRES_PASSWORD
              value: "ankusa"
            - name: POSTGRES_DB
              value: "ankusa"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ankusa", "-d", "ankusa"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ankusa-e2e
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-external
  namespace: ankusa-e2e
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432
