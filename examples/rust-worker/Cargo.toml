[package]
name = "ankusa-rust-worker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The published crate. No default features: this worker only parses headers and
# makes no outbound HTTPS calls, so it skips rustls (and its C build deps).
ankusa = { version = "0.3.0", default-features = false }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync"] }
