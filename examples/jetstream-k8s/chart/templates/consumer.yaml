apiVersion: v1
kind: ServiceAccount
metadata:
  name: consumer
  labels:
    {{- include "demo.labels" "consumer" | nindent 4 }}
---
# `replicas` is left out on purpose: KEDA's HPA owns it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  labels:
    {{- include "demo.labels" "consumer" | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: consumer
  template:
    metadata:
      labels:
        {{- include "demo.labels" "consumer" | nindent 8 }}
    spec:
      serviceAccountName: consumer
      enableServiceLinks: false
      # nats.js drains on SIGTERM: stop pulling, finish the in-flight hook, ack.
      terminationGracePeriodSeconds: 40
      containers:
        - name: consumer
          image: {{ include "demo.image" .Values.images.consumer }}
          imagePullPolicy: {{ .Values.images.consumer.pullPolicy }}
          env:
            - {name: NATS_URL, value: {{ printf "nats://%s:%d" .Values.nats.host (int .Values.nats.port) | quote }}}
            - {name: CLAIM_CHECK_URL, value: "http://claim-check:4001"}
            - {name: WORK_MS, value: {{ .Values.consumer.workMs | quote }}}
            - {name: STREAM_REPLICAS, value: "3"}
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          ports:
            - {name: health, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.consumer.resources | nindent 12 }}
