# The panel needs the Kubernetes API to list pods and HPAs, kill pods, and
# create/delete the chaos AuthorizationPolicies and patch the VirtualService's
# fault. A Role in this namespace, nothing cluster-wide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-panel
  labels:
    {{- include "demo.labels" "control-panel" | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-panel
  labels:
    {{- include "demo.labels" "control-panel" | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [networking.istio.io]
    resources: [virtualservices]
    verbs: [get, patch]
  - apiGroups: [security.istio.io]
    resources: [authorizationpolicies]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-panel
  labels:
    {{- include "demo.labels" "control-panel" | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-panel
subjects:
  - kind: ServiceAccount
    name: control-panel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-panel
  labels:
    {{- include "demo.labels" "control-panel" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-panel
  template:
    metadata:
      labels:
        {{- include "demo.labels" "control-panel" | nindent 8 }}
    spec:
      serviceAccountName: control-panel
      enableServiceLinks: false
      containers:
        - name: control-panel
          image: {{ include "demo.image" .Values.images.controlPanel }}
          command: ["/bin/sh", "-c", "ulimit -n {{ .Values.nofile }} && exec /app/bin/server"]
          imagePullPolicy: {{ .Values.images.controlPanel.pullPolicy }}
          env:
            - {name: PHX_SERVER, value: "true"}
            - {name: PORT, value: "4100"}
            - {name: PHX_HOST, value: localhost}
            - {name: SECRET_KEY_BASE, value: {{ .Values.controlPanel.secretKeyBase | quote }}}
            - {name: GATEWAY_URL, value: {{ .Values.controlPanel.gatewayUrl | quote }}}
            - {name: CLAIM_THRESHOLD_BYTES, value: {{ .Values.ankusa.inlineMaxBytes | int | quote }}}
            - {name: CLAIM_BYTES_PER_SEC, value: {{ .Values.controlPanel.claimBytesPerSec | int | quote }}}
            - {name: NATS_HOST, value: {{ .Values.nats.host | quote }}}
            - {name: NATS_PORT, value: {{ .Values.nats.port | quote }}}
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          ports:
            - {name: http, containerPort: 4100}
          readinessProbe:
            httpGet: {path: /health, port: 4100}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 4100}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controlPanel.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: control-panel
  labels:
    {{- include "demo.labels" "control-panel" | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: control-panel
  ports:
    - {name: http, port: 4100, targetPort: http}
