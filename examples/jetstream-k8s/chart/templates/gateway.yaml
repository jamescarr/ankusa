# Plain HTTP on the ingress gateway's port 80. run.sh publishes that port on
# localhost:8080 through the kind node's NodePort mapping.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: demo-gateway
  labels:
    {{- include "demo.labels" "gateway" | nindent 4 }}
spec:
  selector:
    {{- toYaml .Values.gateway.selector | nindent 4 }}
  servers:
    - port: {number: 80, name: http, protocol: HTTP}
      hosts: ["*"]
