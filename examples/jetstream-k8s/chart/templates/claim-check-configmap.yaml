# The claim-check gateway's own config (`gateway.yml`, the gateway image's
# default path): it runs no core role. Consumers redeem `claim` refs here, so
# they hold no object-store credentials. Claims default to the `storage` store,
# and the edge pods check them in to the same bucket.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claim-check-config
  labels:
    {{- include "demo.labels" "claim-check" | nindent 4 }}
data:
  gateway.yml: |
    config_version: 2
    node:
      data_dir: /var/lib/ankusa
    log:
      banner: false
    # The gateway serves its own metrics on 4004 (the port Prometheus scrapes).
    metrics:
      enabled: true
      ip: 0.0.0.0
    claim_check:
      store:
        {{- include "demo.claimStore" . | nindent 8 }}
    gateway:
      port: 4001
      ip: 0.0.0.0
      auth:
        allow_insecure: true
