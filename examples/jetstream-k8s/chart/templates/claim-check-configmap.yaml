# The claim-check gateway: a node with only the claim_check role, reading the
# same bucket the edge pods write to. Consumers redeem `claim` refs here, so
# they hold no object-store credentials.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claim-check-config
  labels:
    {{- include "demo.labels" "claim-check" | nindent 4 }}
data:
  ankusa.yml: |
    config_version: 2
    node:
      roles: [claim_check]
    log:
      banner: false
    admin:
      enabled: true
      ip: 0.0.0.0
      # Demo: the cluster network is the boundary (the mesh's policies decide
      # who reaches these ports). Real deployments set auth.mode instead.
      auth:
        mode: none
        allow_insecure: true
    claim_check:
      store:
        {{- include "demo.claimStore" . | nindent 8 }}
    gateway:
      port: 4001
      ip: 0.0.0.0
      auth:
        allow_insecure: true
