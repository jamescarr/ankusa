name: hook_postgres

# Local Postgres for developing/testing Hook.WAL.Postgres. Not the emulator
# story (there's no emulator here — it's real Postgres) — just an isolated
# dev instance on a non-default port so it won't collide with one you may
# already be running.
#
#   docker compose up -d --wait
#   mix test
#   docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hook
      POSTGRES_PASSWORD: hook
      POSTGRES_DB: hook_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hook -d hook_dev"]
      interval: 2s
      timeout: 2s
      retries: 30
