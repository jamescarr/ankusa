# Every key in the schema, at its default, with the alternatives next to it.
# This file loads as-is: copy it, delete what you don't use, and replace the
# ${VAR}s with your own.
#
# Env vars referenced here (all supplied by config-examples' test fixture, and
# by you in production):
#
#   S3_BUCKET  S3_REGION  S3_ENDPOINT
#   AWS_ACCESS_KEY_ID         AWS_SECRET_ACCESS_KEY  GCS_BUCKET
#   STRIPE_WHSEC  SINK_URL  SINK_WHSEC  RABBITMQ_URL
#   RABBITMQ_EXCHANGE         KAFKA_BROKERS  KAFKA_TOPIC  KAFKA_USERNAME
#   KAFKA_SASL_PASSWORD       NATS_SERVERS  NATS_SUBJECT  NATS_USERNAME
#   NATS_PASSWORD             STANDARD_WEBHOOKS_SECRET   GITHUB_WEBHOOK_SECRET
#
# Anything you can also set with an ANKUSA_* env var is marked [env]; env wins
# over this file, which is how a container gets reconfigured without a rebuild.

node:
  # [env ANKUSA_ROLES] which OTP roles run here. One all-roles process is fine
  # to start with; split for scale (edge in front, dispatch+storage behind).
  roles: [edge, dispatch, storage]
  # [env ANKUSA_DATA_DIR] the RocksDB store (hooks, delivery rows and DLQ, quarantine pen, API-managed sources, rate-limit overrides) and local segments land here.
  data_dir: /var/lib/ankusa

log:
  # [env ANKUSA_LOG_LEVEL] debug | info | warning | error
  level: info

http:
  # [env ANKUSA_HTTP_PORT, else PORT] the ingest listener.
  port: 4000
  max_body_bytes: 8000000
  # path        -> POST /webhooks/:source_id
  # tenant_path -> POST /webhooks/:tenant_id/:source_id (tenant from the URL)
  routing: path
  # Segments before the source id. "/" means no prefix.
  prefix: /webhooks

admin:
  # The operator API (health, /metrics, /v1/config, DLQ, quarantine). The image
  # defaults this on because it is the only way to operate a container without
  # an Elixir shell; core's default for embedded users is false.
  enabled: true
  # [env ANKUSA_ADMIN_PORT] unauthenticated — do not publish it.
  port: 4002
  # [env ANKUSA_ADMIN_IP] the address it binds. Loopback by default, so inside
  # a container `-p 4002:4002` does not reach it; set 0.0.0.0 to publish it.
  ip: 127.0.0.1
  # How often the /metrics gauges (store, queue and quarantine depth, disk
  # free, dispatch in-flight, open breakers) are sampled. Health is GET
  # /health (the process answers) and GET /ready (the store takes a synced
  # write; 503 + Retry-After otherwise) on this port and on the ingest port.
  gauge_interval_ms: 15000

routes:
  # [env ANKUSA_ROUTES_ENABLED] Off captures every POST, as Ankusa always has.
  # On is deny-by-default: a request is captured only if its method and
  # normalized path match an enabled route *and* its client IP passes the IP
  # rules. Everything else is rejected before the store is touched.
  enabled: false
  # A hard cap on definitions. Creating one past it is a 409; nothing is ever
  # evicted — an evicted route would start rejecting real webhooks.
  max_routes: 10000
  # 1 in this many rejections is logged at :debug. 0 disables the sampling.
  log_sample: 100
  # 403, or 404 for uniformity with a path that simply does not exist.
  ip_denied_status: 403
  # CIDRs whose peers may set X-Forwarded-For. Empty means the header is never
  # read: it is client-controlled, and trusting it from an untrusted peer is
  # the same as letting the sender choose its own IP.
  trusted_proxies: []

  store:
    # ets   -> definitions in this node's memory (plus `seed` below). Each node
    #          has its own: two edges with `type: ets` share nothing.
    # redis -> definitions in Redis, shared by every edge node (ankusa_redis);
    #          a `url` with no `type` means redis
    type: ets
    # The three keys below are only valid with `type: redis`. With `type: ets`
    # (or no `type` at all, which means ets) setting any of them is a config
    # error naming the key, not a silent drop: a fleet that set only a url
    # would otherwise keep every definition to itself while its operator
    # believed it shared them.
    # [env ANKUSA_ROUTES_STORE_URL]
    # url: redis://cache:6379
    # Share definitions across nodes by giving them the same namespace;
    # defaults to ankusa:routes:<instance>.
    # namespace: ankusa:routes
    # The safety net for a missed pub/sub broadcast: how often a node re-reads
    # the version. This is the worst-case staleness after a disconnect.
    # tick_ms: 30000

  cache:
    # The per-request decision cache. A mutation bumps the version, which
    # retires every entry at once; these bound memory, not freshness.
    max_size: 50000
    # Must stay under gc_interval_ms: the local adapter's garbage collector
    # drops a whole generation, so a longer TTL can be evicted early.
    ttl_ms: 30000
    # Rejections are what a scanner produces, and there are far more of them.
    negative_ttl_ms: 5000
    gc_interval_ms: 60000

  ip_rules:
    # Ordered; the first matching rule wins, and `default` decides the rest.
    default: allow
    rules: []
    # - {action: deny, cidr: "10.0.0.0/8"}
    # - {action: allow, cidr: "203.0.113.0/24"}

  admin:
    # Its own listener, unauthenticated by design (same stance as `admin:`
    # above): front it with your own proxy or network policy before exposing
    # it.
    port: 4003
    # The address it binds; 0.0.0.0 exposes it on every interface.
    ip: 127.0.0.1

  # Routes an operator cannot wait for the API to create: a standalone node
  # (no Redis) loses API-created routes on restart, but not these. Applied on
  # every boot with the default ETS store; the Redis store seeds once per
  # namespace. Only when routes are enabled.
  seed: []
  # - id: stripe
  #   path: /webhooks/stripe
  #   methods: [POST]
  #   ip_rules: [{action: allow, cidr: "203.0.113.0/24"}]
  #   metadata: {owner: payments}

rate_limits:
  # Per-tenant ingest limits, enforced by each edge node in its own memory: a
  # fleet of N edges admits up to N x the limit, and the numbers below are per
  # node, not for the fleet.
  #
  # A hook is charged after verification and before the durable write, so a
  # flood of forged requests never spends a tenant's budget — only hooks whose
  # signature passed (or whose source accepts failures) do.
  #
  # A hook over the limit gets 429 with a Retry-After header, and nothing is
  # stored: no hook, no dispatch, no claim.
  #
  # Limits can also be adjusted per tenant at runtime, without a restart:
  # `PUT /v1/tenants/{tenant}/rate-limit` on the admin port, persisted in the
  # node's store (node-local, like `source_store.type: persistent`). A runtime
  # value beats the ones below.
  #
  # `rate` is hooks per second (fractions are allowed: 0.5 is one every two
  # seconds) and `burst` is the most admitted back to back. Both are required,
  # neither is inferred. No `default` and no tenant entry means unlimited; to
  # exempt one tenant from a default, give it a high limit of its own.
  default: null
  # default: {rate: 50, burst: 100}
  tenants: {}
  #   acme: {rate: 500, burst: 1000}

quarantine:
  # The holding pen for hooks that fail verification on a source with
  # on_verify_failure: quarantine. Each edge node keeps its own, in its store.
  #
  # One token bucket per source: `burst` hooks back to back, refilled `rate`
  # per second. Over it, the hook gets 429 quarantine_rate_limited with a
  # Retry-After header, and nothing is stored.
  burst: 100
  rate: 20
  # A cap on the bytes the whole pen holds (default 1 GiB). A hook that would
  # cross it gets 503 quarantine_full with Retry-After: 60. A full pen refuses
  # new hooks; it never evicts one it already answered 202 for. Release
  # (POST /v1/replays {"kind": "quarantine"}) or purge (DELETE /v1/quarantine)
  # on the admin port to make room.
  max_bytes: 1073741824

batcher:
  # The queue writer serializes commits itself, so partitions beyond a couple only
  # add contention.
  partitions: 2
  max_batch: 256
  # 0 = commit as soon as a batch is ready; the store commit runs in a task, so
  # raising this trades a little ack latency for larger batches.
  max_delay_ms: 0
  # Full queue = shed load with 503 rather than grow without bound. Counts
  # buffered *and* in-flight records.
  max_queue: 10000
  # The same bound in bytes of body (default 256 MiB): a burst of large hooks
  # sheds load before it can exhaust memory, whatever the record count.
  max_queue_bytes: 268435456

dispatch:
  batch: 128
  # Max sink deliveries in flight at once. Keep Req's Finch pool (default 50)
  # at least this large when using the http sink.
  concurrency: 32
  # Claimed-but-unfinished deliveries, and the max sum of their stored hook
  # sizes in bytes: bounds what a stalled destination can hold.
  max_inflight: 4096
  max_inflight_bytes: 134217728
  # A delivery attempt that has not returned after this is killed and counts
  # as a failed attempt (the sink may still complete it; consumers dedupe on
  # the idempotency key). Keep it above every sink's own timeout.
  attempt_timeout_ms: 30000
  # Per-sink isolation. Each sink of each source has its own queue; at most
  # sink_concurrency attempts of one sink run at once (null = only the global
  # `concurrency`), so a slow destination cannot take every slot.
  sink_concurrency: null
  # A sink that fails breaker_failures times in a row (0 = never) is skipped
  # for breaker_open_ms, doubling on each consecutive open up to
  # breaker_max_open_ms; its rows wait (attempts unchanged) and one probe
  # closes it. Breaker state is in memory: a restart closes every breaker.
  breaker_failures: 5
  breaker_open_ms: 30000
  breaker_max_open_ms: 300000
  retry:
    base_ms: 100
    max_ms: 300000
    max_attempts: 84
    # Full jitter: delay is multiplied by a random factor in [0.5, 1.0].
    jitter: true

wal:
  # [env ANKUSA_WAL_TYPE] disk — the local RocksDB store; every hook is on disk before the ack, so it survives process crash and power loss on this host, not the loss of the host.
  #                        none — no local queue: ingest publishes to the source's sinks in the request and acks on
  #                               their confirm. The node keeps no hook state, drops the `dispatch` and `storage` roles, and every
  #                               source must have a durable sink (a broker ack, a publisher confirm, an upstream 2xx).
  type: disk
  # wal.type: none only: the deadline every sink must confirm under; keep it below the provider's timeout.
  publish_timeout_ms: 8000

storage:
  # [env ANKUSA_STORAGE_TYPE] local | s3 | gcs
  type: local
  # Segment rollover: whichever comes first.
  roll_bytes: 16777216
  roll_ms: 30000
  # [env ANKUSA_STORAGE_KEY_PREFIX] prepended to every segment key ("" or one
  # or more `name/` parts), so several nodes can share one bucket: give each
  # its own, e.g. "node-a/". Claims are never prefixed (see claim_check.store).
  key_prefix: ""
  # Used only when type: s3. Credentials come from, in order: these keys, the
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN env vars,
  # web identity (IRSA: AWS_WEB_IDENTITY_TOKEN_FILE + AWS_ROLE_ARN), then the
  # EC2 instance profile (IMDSv2).
  s3:
    bucket: "${S3_BUCKET}"
    region: "${S3_REGION}"
    endpoint: "${S3_ENDPOINT}"
    access_key_id: "${AWS_ACCESS_KEY_ID}"
    secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
    # Temporary credentials only, beside the two keys above.
    # session_token: "${AWS_SESSION_TOKEN}"
  # Used only when type: gcs.
  gcs:
    bucket: "${GCS_BUCKET}"
    endpoint: https://storage.googleapis.com
    # metadata — take tokens from the GCE/GKE instance metadata server.
    # token    — use the static token below.
    # none     — send no credentials (an emulator).
    auth: metadata
    # token: "${GCS_TOKEN}"   # required iff auth: token

claim_check:
  # [env ANKUSA_CLAIM_CHECK_PORT] the gateway listener (:claim_check role).
  port: 4001
  # [env ANKUSA_CLAIM_CHECK_IP] the address the gateway binds. Loopback by
  # default; set 0.0.0.0 to reach it from outside the container.
  ip: 127.0.0.1
  # Target size of one pack object; a body larger than this still gets a pack
  # of its own. Core defaults this to 16 MiB.
  pack_max_bytes: 16777216
  # LocalFS retention only. nil disables the sweeper; use a bucket lifecycle
  # rule for S3/GCS.
  retention_days: null
  # Where claims live: unset = the storage bucket above. Same shape as
  # `storage` (type local | s3 | gcs, its s3:/gcs: block, plus `root` for a
  # local store). Set it identically on every claim-writing node and on the
  # gateway; give the gateway's credential read *and* list (s3:ListBucket), or
  # a missing claim reads as 403 instead of 404.
  # store:
  #   type: s3
  #   s3: {bucket: "${CLAIMS_BUCKET}", region: "${S3_REGION}"}
  # The gateway performs no authentication. Keep 4001 internal and put your
  # proxy, mesh, or network policy in front of it, the same as 4002.

backup:
  # [env ANKUSA_BACKUP_ENABLED] continuous backup of this node's store to an
  # object store, and restore at boot: a node that starts with an empty data_dir
  # restores the latest backup before it opens the store, and refuses to start
  # if the backup location cannot be read (never starts empty). Off by default.
  # With `storage.type: local` and no `store` below, the backup lives on the
  # same disk as the store and does not survive losing the host; point
  # `backup.store` (or `storage`) at a bucket.
  enabled: false
  # How often a checkpoint is uploaded: a lost host loses at most the hooks
  # acked since the last backup. Files already uploaded are not uploaded again.
  interval_ms: 60000
  # Backups kept; older ones, and the files only they used, are deleted after
  # each successful upload.
  keep: 3
  # Where backups live: unset = the storage bucket above. Same shape as
  # `claim_check.store` (type local | s3 | gcs, its s3:/gcs: block, plus `root`
  # for a local store). Keys are always under storage.key_prefix: backups are
  # per node, so give each node sharing a bucket its own prefix (a node whose
  # prefix holds another store's backups refuses to back up, and logs why).
  # Keep <key_prefix>backup/ out of any bucket expiration rule: `keep` is the
  # retention, and an expired shared file breaks every backup that lists it.
  # store:
  #   type: s3
  #   s3: {bucket: "${BACKUP_BUCKET}", region: "${S3_REGION}"}

lifecycle:
  # Where a lifecycle event goes when a source or route is created, updated, or
  # deleted (through the admin API or the route-management API): a CloudEvents
  # 1.0 message, io.ankusa.source.created and friends, published from memory
  # with the dispatch retry policy; not persisted. The same sink types as a source's
  # `sinks`, at least one. Omit the whole section to turn lifecycle events off.
  # `ankusa:lifecycle` is a reserved source id. The AsyncAPI document on
  # GET /asyncapi.json describes this channel too. See docs/asyncapi.md.
  sinks:
    - type: kafka
      brokers: ["${KAFKA_BROKERS}"]
      topic: ankusa.lifecycle

# static     -> sources from `sources:` below only; the admin API cannot write.
# persistent -> plus API-managed, tenant-scoped sources kept in this node's
#               store (node-local: another node's admin API does not see them).
# redis      -> plus API-managed sources kept in Redis and shared by every node
#               with the same namespace (ankusa_redis); a `url` with no `type`
#               means redis.
source_store:
  type: static
  # The three keys below are only valid with `type: redis`.
  # [env ANKUSA_SOURCE_STORE_URL]
  # url: redis://cache:6379
  # Share sources across nodes by giving them the same namespace; defaults to
  # ankusa:sources:<instance>.
  # namespace: ankusa:sources
  # How often a node re-reads the version in case it missed a broadcast: the
  # worst-case staleness after a disconnect.
  # tick_ms: 30000

sources:
  # One source per provider endpoint. The id is the catch-URL segment:
  # POST /webhooks/stripe here.
  stripe:
    # Scopes storage. With routing: tenant_path the URL wins.
    tenant: default
    # reject | quarantine | accept_flag (what happens when verification fails)
    on_verify_failure: reject
    # none | stripe | github | standard_webhooks | shopify | slack | hmac.
    # Every type except none requires secret; stripe, standard_webhooks, and
    # slack also take tolerance_seconds (default 300). hmac takes the
    # descriptor keys shown on the `custom` source below.
    verify:
      type: stripe
      secret: "${STRIPE_WHSEC}"
      # To rotate, list both secrets, newest first: every one is tried, so
      # hooks signed with either verify while the provider switches over.
      # Every entry must be non-empty: an unset ${OLD:-} is a load error.
      # secret: ["${STRIPE_WHSEC_NEW}", "${STRIPE_WHSEC}"]
      tolerance_seconds: 300
    # dedupe: stripe   # a preset (github | standard_webhooks | svix | shopify | stripe), or {header: X-Event-Id} / {json: data.id}, plus optional ttl_seconds (259200)
    # forward_headers: [stripe-signature]   # absent = every header except auth/framing/hop-by-hop and x-ankusa-*
    # At least one. Every sink is tried on every delivered hook.
    sinks:
      - {type: log}
      - type: http
        url: "${SINK_URL}"
        # post | put | patch
        method: post
        timeout_ms: 5000
        headers:
          x-ankusa-env: prod
        # Sign every delivery (Standard Webhooks: webhook-id, -timestamp,
        # -signature); a whsec_ secret, or a list while rotating. Every SDK
        # verifies it (see docs/integrations.md).
        secret: "${SINK_WHSEC}"
        # Only the status is used; at most this much of the response is read.
        max_response_bytes: 65536
      - type: rabbitmq
        url: "${RABBITMQ_URL}"
        exchange: "${RABBITMQ_EXCHANGE}"
        # topic | direct | fanout | headers
        exchange_type: topic
        routing_key: "ankusa.stripe"
        inline_max_bytes: 8192
        # Publishes awaiting a broker confirm on this connection; past it a
        # publish fails fast as busy (retried) instead of queueing.
        max_inflight: 256
      - type: kafka
        # A list of host:port, or one comma-separated string — so
        # `brokers: "${KAFKA_BROKERS}"` takes "host:port,host:port" from env.
        brokers: ["${KAFKA_BROKERS}"]
        topic: "${KAFKA_TOPIC}"
        # Static string only (a fun is an embedding API, not a config surface).
        key: stripe
        inline_max_bytes: 8192
        # The largest value + key produced; a bigger record is dead-lettered at
        # once instead of being retried against the broker's message.max.bytes.
        max_record_bytes: 1000000
        # Omit both to talk to a plaintext broker.
        ssl: false
        sasl:
          # plain | scram_sha_256 | scram_sha_512
          mechanism: plain
          username: "${KAFKA_USERNAME}"
          password: "${KAFKA_SASL_PASSWORD}"
      - type: nats
        # A list of host:port, or one comma-separated string — so
        # `servers: "${NATS_SERVERS}"` takes "host:port,host:port" from env.
        # More than one is failover (one at a time, picked at random), not fan-out.
        servers: ["${NATS_SERVERS}"]
        # A subject, not a stream: the sink never creates one, so a stream that
        # covers this subject has to exist.
        subject: "${NATS_SUBJECT}"
        inline_max_bytes: 8192
        # How long to wait for JetStream's publish ack.
        publish_timeout_ms: 5000
        tls: false
        # Exactly one scheme: username/password, token, or nkey_seed (+ jwt).
        # Omit the block for a server that needs no credentials.
        auth:
          username: "${NATS_USERNAME}"
          password: "${NATS_PASSWORD}"
      - type: redis
        # Password and database go in the URL: redis://:password@host:6379/0
        # (or rediss:// for TLS).
        url: "${REDIS_SINK_URL}"
        # Pub/sub: PUBLISH fan-out to live subscribers. Redis keeps no copy, so
        # a publish that reaches no subscriber is an error (retried, then
        # dead-lettered), and this sink never counts as durable for
        # wal.type: none.
        # Static string only (a fun is an embedding API, not a config surface).
        channel: "ankusa.stripe"
        inline_max_bytes: 8192
        # How long to wait for Redis to answer the PUBLISH.
        publish_timeout_ms: 5000
      - type: sqs
        # The queue must exist: the sink never creates one, so a missing queue
        # is an error (retried, then dead-lettered). A URL ending .fifo is a
        # FIFO queue: MessageDeduplicationId is the hook id (SQS dedupes for
        # 5 minutes), MessageGroupId the message_group_id below.
        queue_url: "${SQS_QUEUE_URL}"
        region: us-east-1
        # Default: the queue URL's origin. Set it for a VPC endpoint or an
        # emulator (http://localhost:4566).
        # endpoint: https://sqs.us-east-1.amazonaws.com
        # Static string only. Default "<tenant>/<source>" on a FIFO queue; on a
        # standard queue it is sent only when set (fair queues).
        # message_group_id: stripe
        inline_max_bytes: 8192
        # The largest body + message attributes sent; a bigger message is
        # dead-lettered at once. SQS's limit, 1 MiB; lower it to the queue's
        # MaximumMessageSize.
        max_message_bytes: 1048576
        timeout_ms: 5000
        # Omit all three to use AWS_* env vars, IRSA, or the EC2 instance role.
        # access_key_id: "${AWS_ACCESS_KEY_ID}"
        # secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
        # session_token: "${AWS_SESSION_TOKEN}"
      - type: google_pubsub
        # The topic must exist: the sink never creates a topic or a
        # subscription, so a missing topic is an error (retried, then
        # dead-lettered). A topic with no subscription accepts the publish and
        # drops the message.
        project: my-project
        topic: ankusa-hooks
        # Default: https://pubsub.googleapis.com. Set it for a regional
        # endpoint or the floci-gcp emulator (http://localhost:4588).
        # endpoint: https://pubsub.googleapis.com
        # Static string only. Orders messages only on a subscription with
        # message ordering enabled; default: no ordering key.
        # ordering_key: stripe
        inline_max_bytes: 8192
        # The largest data + attributes + ordering key sent; a bigger message
        # is dead-lettered at once. Pub/Sub's limit, 10 MB.
        max_message_bytes: 10000000
        timeout_ms: 5000
        # metadata (default): the GCE/GKE metadata server. token: the bearer
        # token below. none: no credential, for an emulator.
        auth: token
        token: "${GCP_TOKEN}"

  # A second source, showing the other verifier and the quarantine policy.
  standard:
    verify: {type: standard_webhooks, secret: "${STANDARD_WEBHOOKS_SECRET}"}
    on_verify_failure: quarantine
    sinks: [{type: log}]

  github:
    verify: {type: github, secret: "${GITHUB_WEBHOOK_SECRET}"}
    on_verify_failure: accept_flag
    sinks: [{type: log}]

  # Verify nothing at all. Useful behind a trusted network, or as the demo the
  # image ships with.
  open:
    verify: {type: none}
    on_verify_failure: accept_flag
    sinks: [{type: log}]

  # Any other body-HMAC provider, described inline instead of named. `signed`
  # is quoted — unquoted `{body}` would parse as a YAML flow map.
  # custom:
  #   verify:
  #     type: hmac
  #     secret: "${CUSTOM_WEBHOOK_SECRET}"
  #     signature_header: "X-Custom-Signature"
  #     signed: "{body}"
  #     hash: sha256            # sha256 | sha512 | sha1
  #     encoding: hex           # hex | base64
  #     sig_prefix: "sha256="
  #     timestamp_header: "X-Custom-Timestamp"
  #     tolerance_seconds: 300
  #     parse: whole            # whole | csv_pairs (with sig_key: v1) | space_versions (with version: "v1,")
  #     secret_decode: raw      # raw | whsec_base64
  #   sinks: [{type: log}]
