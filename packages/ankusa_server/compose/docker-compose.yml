# Single node: the whole framework in one container.
#
#   docker compose -f packages/ankusa_server/compose/docker-compose.yml up -d
#
# The image is the published one; to run a local build, either tag it
# (`docker tag jamescarr/ankusa:dev jamescarr/ankusa:edge`) or set ANKUSA_IMAGE.
services:
  ankusa:
    image: ${ANKUSA_IMAGE:-jamescarr/ankusa:edge}
    ports:
      # Ingest. Safe to publish: providers authenticate with their own
      # signatures (that is what a verifier is for).
      - "4000:4000"
      # Admin API and /metrics — authenticated with the bearer token below
      # (`Authorization: Bearer $ANKUSA_ADMIN_TOKEN`). Bound to loopback so it
      # is reachable from this host (curl, a Prometheus on the same box) and
      # from nowhere else. To let people in remotely, give them their own
      # credentials (`admin.auth` with `mode: jwt` or `mtls`, see
      # docs/configuration.md) or front it with a proxy;
      # compose/docker-compose.proxy.yml shows nginx basic auth doing that.
      - "127.0.0.1:4002:4002"
    environment:
      # The published loopback port reaches the container's interface, not its
      # loopback, so the admin API has to listen on every interface in here.
      ANKUSA_ADMIN_IP: "0.0.0.0"
      # One bearer token holding every admin scope. Generate it once:
      #   export ANKUSA_ADMIN_TOKEN=$(openssl rand -hex 32)
      # Only its SHA-256 is kept in the node's config.
      ANKUSA_ADMIN_TOKEN: "${ANKUSA_ADMIN_TOKEN:?export ANKUSA_ADMIN_TOKEN first (openssl rand -hex 32)}"
      # Secrets are injected, never baked: mount ${VAR}s in the config file and
      # pass the values here.
      #   STRIPE_WHSEC: ${STRIPE_WHSEC}
    volumes:
      # The data volume: the RocksDB store (hooks, DLQ, quarantine pen), local segments. Losing it
      # loses un-dispatched hooks, so back it.
      - ankusa-data:/var/lib/ankusa
      # Your config. The image's baked-in demo config is used until you mount
      # one.
      # - ../config-examples/single-node.yml:/etc/ankusa/ankusa.yml:ro
    restart: unless-stopped

volumes:
  ankusa-data:
