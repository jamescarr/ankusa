name: ankusa_nats

# Local NATS server with JetStream for developing/testing Ankusa.Sink.NATS.
# Tests create and delete their own streams. The sink never creates one.
#
#   docker compose up -d --wait
#   mix test
#   docker compose down -v
#
# Bytes live in the container's /data, so `down -v` is what clears a stream
# whose test died before its cleanup ran.

services:
  nats:
    image: nats:2-alpine
    command:
      - -js
      - -m
      - "8222"
      - --store_dir
      - /data
    ports:
      - "4223:4222"   # client port
      - "8223:8222"   # monitoring, http://localhost:8223
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Toxiproxy between the sink and the broker: `test/ankusa/sink/nats_faults_test.exs`
  # (DEL-7) points the sink at :4224 instead of at the broker, and adds latency,
  # drops and cut connections through the API on :8477. No other suite uses it.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "8477:8474"    # toxiproxy API
      - "4224:4224"  # proxy to nats:4222 (client port)
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 2s
      timeout: 5s
      retries: 30
