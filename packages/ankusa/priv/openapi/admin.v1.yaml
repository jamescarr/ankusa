openapi: 3.2.0
info:
  title: Ankusa Admin API
  version: 1.0.0
  summary: Health, metrics, redacted config, DLQ, quarantine — over HTTP.
  description: |
    HTTP surface of the operator API, served by any node with
    `admin.enabled: true` (default port 4002). This document is the
    cross-language contract. The Elixir code conforms to it, not the reverse.

    **Authentication is off by default.** With `auth.enabled: false` this API
    performs no authentication or authorization, and deployers secure the port
    at their own boundary (network policy, a reverse proxy, SSO, a service
    mesh) — the way Elasticsearch was operated before it shipped security.
    `GET /v1/config` is redacted anyway, because a proxy may let many people
    read it.

    With `auth.enabled: true`, every operation except `GET /health` and
    `GET /ready` needs `Authorization: Bearer <token>`: a JWT from the
    configured OIDC identity provider (`bearerAuth`). The token's subject or
    groups are mapped to a role by `auth.bindings`, each role global or scoped
    to tenants:

    | Role | May |
    | --- | --- |
    | `viewer` | every read (`/metrics` included), the route dry run |
    | `operator` | `viewer`, plus replays and purging the quarantine pen |
    | `admin` | `operator`, plus sources, route definitions, the global IP rules, per-tenant rate limits and the audit log |

    A tenant-scoped grant covers that tenant's sources and audit trail only;
    everything platform-wide needs a grant over all tenants. A request is refused
    with `401` (no or invalid token), `403` (the roles do not cover it, or the
    token's user is not provisioned or is deactivated) or `503` (the identity
    provider's keys cannot be reached): see the `Unauthenticated`, `Forbidden`
    and `AuthUnavailable` responses, which every operation can answer.

    With `audit.enabled: true`, every mutation and every denial is written to a
    durable audit log before the response is sent (the `audit` tag); a mutation
    whose record cannot be written is refused with `503 audit_unavailable`
    (`AuditUnavailable`) and does not happen.

    The `scim` tag is a SCIM 2.0 endpoint (`/scim/v2`) an identity provider
    provisions users and groups through, authenticated by its own static token
    (`scimToken`).

    Responses are node-local by design: the DLQ is the dispatch node's disk and
    the quarantine pen is the edge node's. A route that needs a role
    this node does not run answers `409 role_not_enabled` so an operator can
    tell "wrong node" from "nothing there". Scrape every node's admin port to
    see the fleet.

    ## Two listeners

    Everything here is served by `Ankusa.Admin.Router` on `admin.port` (default
    4002) **except** the `routes` tag, which is `Ankusa.Routes.Router` on its own
    listener (`routes.admin.port`, default 4003): managing routes is an operator
    action, and it should share neither the ingest port nor the operator API's
    port. Both listeners share the authentication described above.

    The `routes` endpoints edit the table the *edge* enforces, so they exist only
    on a node with `routes.enabled: true` and the `:edge` role.

    The `routes` examples in this document are a sequence, not a set: they create
    one route (`stripe`), check the listener's health, list, read, and dry-run it,
    replace the global IP rules, then replace, patch, and delete the route.
    `priv/openapi` is the source of truth — `test/ankusa/routes/router_openapi_test.exs`
    builds each request from these examples and asserts the response against the
    documented schema and example, so the code is tested against this document,
    not the other way round.
servers:
  - url: http://localhost:4002
    description: Local development listener (default `admin.port`).
  - url: http://localhost:4003
    description: |
      Route-management listener (default `routes.admin.port`). Only the `routes`
      tag is served here, plus `GET /health`.
security:
  - {}
  - bearerAuth: []
tags:
  - name: operations
    description: Health, metrics, and the effective configuration.
  - name: dlq
    description: Inspect and replay dead-lettered hooks. `:dispatch` role only.
  - name: quarantine
    description: |
      The quarantine pen: list and purge held hooks. `:edge` role only;
      node-local. Release them with a `quarantine` replay job (`replays` tag).
  - name: rate_limits
    description: |
      Per-tenant ingest rate limits: config values plus this node's runtime
      overrides (persisted in the node's store). `:edge` role
      only; node-local.
  - name: routes
    description: |
      Route definitions and the global IP rules, on the `routes.admin.port`
      listener. Requires `routes.enabled: true` and the `:edge` role. A route is
      a **capture gate**, not an identity: it decides whether a request is
      captured, while `Ankusa.RouteResolver` and the source store still decide
      which source and tenant it belongs to.
  - name: audit
    description: |
      The durable audit log of every mutation and denial. Requires
      `audit.enabled: true` and the `admin` role. Node-local.
  - name: scim
    description: |
      SCIM 2.0 provisioning of users and groups (`/scim/v2`), authenticated with
      `scim.token`. Requires `scim.enabled: true` (`404` otherwise). What it
      provisions is what `auth.bindings` and `auth.user_match` read.
paths:
  /health:
    servers:
      - url: http://localhost:4002
        description: Operator API listener (default `admin.port`).
      - url: http://localhost:4003
        description: |
          Route-management listener (default `routes.admin.port`), only with
          routes enabled.
    get:
      security: []
      operationId: getHealth
      tags: [operations]
      summary: Liveness probe
      description: |
        Both listeners answer this path, with a different body: the operator API
        reports the instance and the roles this node runs, the route-management
        API reports the size of the route table it is enforcing.
      responses:
        '200':
          description: |
            The listener is up. On `admin.port` the body is
            `{status, instance, roles}`; on `routes.admin.port` it is
            `{status, routes}`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Health'
                  - $ref: '#/components/schemas/RoutesHealth'
              examples:
                operatorPort:
                  summary: On `admin.port`
                  value: {status: ok, instance: default, roles: [edge, dispatch, storage]}
                routesPort:
                  summary: On `routes.admin.port`
                  value: {status: ok, routes: 1}
  /ready:
    servers:
      - url: http://localhost:4002
        description: Operator API listener (default `admin.port`).
    get:
      security: []
      operationId: getReady
      tags: [operations]
      summary: Readiness probe
      description: |
        `200` while this node can ack a hook: on a node that runs the local
        store, a synced write to it succeeds (the answer is cached for 1 s).
        `503` with `Retry-After: 1` while it cannot — a full disk, a store
        that is closed or reopening — and `200` again on its own once it can.
        A node without a store is always ready (`store: none`). `/health`
        stays a liveness probe.
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example: {status: ready, instance: default, store: ok}
        '503':
          description: Not ready.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Always `1`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example: {status: unavailable, instance: default, store: write_failed}
  /metrics:
    get:
      operationId: getMetrics
      tags: [operations]
      summary: Prometheus metrics
      description: |
        The node's `Ankusa.Metrics` scrape: ingest, verification, store commit,
        load shedding, quarantine, dispatch, compaction, and claim-check
        series. Only the events this node emits appear — an edge node has no
        dispatch series, a storage node has no ingest series.
      responses:
        '200':
          description: Prometheus text exposition format, version 0.0.4.
          content:
            text/plain:
              schema:
                type: string
              example: |
                ankusa_ingest_requests_total{instance="default",outcome="committed",source_id="demo"} 1
  /v1/config:
    get:
      operationId: getConfig
      tags: [operations]
      summary: The effective, redacted configuration
      description: |
        The whole `Ankusa.Config` as the node resolved it: defaults, then the
        YAML file, then env overrides. Secrets are redacted by key name
        (`secret`, `password`, `secret_access_key`, `token`, `sasl`, `nkey_seed`)
        and by shape (a URI password becomes `user:[REDACTED]`), so this
        is safe to hand to anyone who can reach the port.
      responses:
        '200':
          description: |
            A JSON object mirroring the config's nesting. `{module, opts}`
            becomes `{"module": "...", "opts": {...}}`; keyword lists become
            objects; atoms become strings.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /asyncapi.json:
    get:
      operationId: getAsyncApi
      tags: [operations]
      summary: AsyncAPI 3.0 document of this instance's messaging channels
      description: |
        Every Kafka topic, RabbitMQ routing key, NATS subject, and Redis channel
        this instance publishes delivered hooks to, built from the sources and
        sinks configured right now, plus the lifecycle events channel when
        `lifecycle.sinks` is set. Each message is an `Ankusa.Sink.Message` v1
        envelope (`SinkMessageV1` in `components.schemas`). Sinks without a
        channel (`log`, `http`) are left out. Carries no credentials.

        The body is JSON, which AsyncAPI tooling reads as YAML 1.2.
      responses:
        '200':
          description: The AsyncAPI document.
          content:
            application/asyncapi+json:
              schema:
                type: object
                required: [asyncapi, info]
                properties:
                  asyncapi:
                    const: '3.0.0'
                  info:
                    type: object
                additionalProperties: true
  /v1/wal:
    servers:
      - url: http://localhost:4002
        description: Operator API listener (default `admin.port`).
    get:
      operationId: getWal
      tags: [operations]
      summary: This node's queue statistics
      description: |
        `Ankusa.Queue.stats/1` from this node's own store, `{}` when the store
        is unreachable. Node-local, like the DLQ and the quarantine list: ask
        every node. A node running `wal.type: none` has no queue to report.
      responses:
        '200':
          description: This node's queue statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wal'
        '409':
          $ref: '#/components/responses/WalDisabled'
  /v1/dlq:
    get:
      operationId: listDeadLetters
      tags: [dlq]
      summary: List dead-lettered hooks
      description: |
        Newest first, metadata only — bodies are never returned. Results are
        this node's dead delivery rows; with several dispatch nodes, ask each one.
      parameters:
        - name: source_id
          in: query
          required: false
          description: Exact source id to filter on.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Inclusive lower bound on when the hook was dead-lettered, in unix milliseconds.
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          description: Maximum entries returned. Values outside 0..1000 are clamped to that range.
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Matching entries, newest first. `total` counts all matches, before `limit`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqPage'
        '400':
          $ref: '#/components/responses/InvalidFilter'
        '409':
          $ref: '#/components/responses/RoleNotEnabled'
        '503':
          $ref: '#/components/responses/NodeStoreUnavailable'
  /v1/replays:
    post:
      operationId: createReplay
      tags: [replays]
      summary: Create a replay job
      description: |
        Creates a durable, paced replay job. `kind: dlq` re-sends dead delivery
        rows; `kind: archive` re-sends archived hooks over a `received_at`
        window; `kind: quarantine` re-verifies hooks held in this node's
        quarantine pen against each source's current verifier (the timestamp
        window judged at the hook's receive time) and commits the ones that now
        pass as new hooks, with the hook's original `id`. Held hooks that still
        fail stay in the pen. Rows are dripped in at `rate` items per second,
        only while the dispatch pipeline's oldest-due lag is at most
        `max_lag_ms` and its in-flight window is not full, so a replay only
        uses capacity live traffic leaves free. A `dlq` or `quarantine` job
        touches only entries dead-lettered or quarantined at or before its own
        creation time. Every replayed delivery keeps the hook's original `id`
        and `dedupe_key` and carries the job id as `replay_id`.
        Posting the same spec again while a `running` or `paused` job with the
        same kind and filter exists returns that job (200), so a proxy retry
        is idempotent.
      requestBody:
        required: true
        description: |
          `kind` is required. Unknown keys are refused with `invalid_filter`.
          `since`/`until` are inclusive bounds (unix ms) on the dead-letter time
          for `dlq` and on `received_at` for `quarantine`; `from`/`to` are
          inclusive `received_at` bounds (unix ms) for `archive`, and `to` must
          be old enough that the compactor has archived the whole window.
          `sinks` indexes into the source's current sinks; omitted means every
          current sink.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaySpec'
      responses:
        '202':
          description: The new job, running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Replay'
        '200':
          description: An existing running or paused job with the same kind and filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Replay'
        '400':
          $ref: '#/components/responses/InvalidFilter'
        '409':
          description: |
            `role_not_enabled` (an `archive` or `quarantine` job on a node
            without a queue writer — both roles, `edge` and `dispatch`, must
            run) or `too_many_replays` (16 jobs already running or paused).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/NodeStoreUnavailable'
    get:
      operationId: listReplays
      tags: [replays]
      summary: List replay jobs
      description: Every replay job, newest first.
      responses:
        '200':
          description: All jobs, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayList'
        '409':
          $ref: '#/components/responses/RoleNotEnabled'
        '503':
          $ref: '#/components/responses/NodeStoreUnavailable'
  /v1/replays/{id}:
    get:
      operationId: getReplay
      tags: [replays]
      summary: One replay job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Replay'
        '404':
          $ref: '#/components/responses/ReplayNotFound'
        '409':
          $ref: '#/components/responses/RoleNotEnabled'
        '503':
          $ref: '#/components/responses/NodeStoreUnavailable'
    patch:
      operationId: updateReplay
      tags: [replays]
      summary: Pause, resume, cancel, or re-rate a replay job
      description: |
        `state` is `running`, `paused` or `cancelled`; resuming clears `error`
        and resets the auto-pause window. `rate` and `max_lag_ms` take effect
        at once. A `done`, `cancelled` or `failed` job refuses patches with
        `replay_finished`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayPatch'
      responses:
        '200':
          description: The updated job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Replay'
        '400':
          $ref: '#/components/responses/InvalidFilter'
        '404':
          $ref: '#/components/responses/ReplayNotFound'
        '409':
          description: '`role_not_enabled`, or `replay_finished` for a finished job.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/NodeStoreUnavailable'
  /v1/quarantine:
    get:
      operationId: listQuarantined
      tags: [quarantine]
      summary: Recent quarantined hooks
      description: |
        The newest quarantined entries from this node's store, newest first.
        Metadata only — bodies are never returned; the whole request stays in
        the store until a `quarantine` replay job releases it or a purge
        deletes it.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum entries returned. Values outside 0..1000 are clamped to that range.
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Recent quarantined entries, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantinePage'
        '400':
          $ref: '#/components/responses/InvalidFilter'
        '409':
          $ref: '#/components/responses/RoleNotEnabled'
        '503':
          $ref: '#/components/responses/NodeStoreUnavailable'
    delete:
      operationId: purgeQuarantined
      tags: [quarantine]
      summary: Delete quarantined hooks
      description: |
        Deletes up to `limit` entries matching every given filter, oldest
        first, in one synced batch, and frees their bytes against
        `quarantine.max_bytes`. No filter deletes the oldest `limit` entries.
        Deleted hooks are gone for good — to keep the ones that now verify, run
        a `quarantine` replay job first.
      parameters:
        - name: source_id
          in: query
          required: false
          description: Exact source id.
          schema:
            type: string
        - name: id
          in: query
          required: false
          description: Exact envelope id.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Inclusive lower bound on `received_at`, unix milliseconds.
          schema:
            type: integer
            minimum: 0
        - name: until
          in: query
          required: false
          description: Inclusive upper bound on `received_at`, unix milliseconds. Must not be less than `since`.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Maximum entries deleted. Values outside 1..10000 are clamped to that range.
          schema:
            type: integer
            default: 1000
      responses:
        '200':
          description: What was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantinePurge'
        '400':
          $ref: '#/components/responses/InvalidFilter'
        '409':
          $ref: '#/components/responses/RoleNotEnabled'
        '503':
          $ref: '#/components/responses/NodeStoreUnavailable'
  /v1/rate-limits:
    get:
      operationId: listRateLimits
      tags: [rate_limits]
      summary: Every limit this node enforces
      description: |
        The configured default and the configured tenants, unioned with this
        node's runtime overrides (an override wins). Sorted by tenant id.
        `default` is `null` when the config sets none, which with no tenant
        entry means unlimited.
      responses:
        '200':
          description: The default, if any, and every tenant with a limit — configured or overridden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimits'
        '409':
          $ref: '#/components/responses/RoleNotEnabled'
  /v1/tenants/{tenant}/rate-limit:
    parameters:
      - name: tenant
        in: path
        required: true
        description: The tenant id, as it appears in the catch URL.
        schema:
          type: string
    get:
      operationId: getTenantRateLimit
      tags: [rate_limits]
      summary: The limit that applies to one tenant
      description: |
        The override when this node has one, else `rate_limits.tenants`, else
        `rate_limits.default` — with `source` saying which. `source: none` means
        unlimited; `rate` and `burst` are `null` then.
      responses:
        '200':
          description: The effective limit and where it came from.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantRateLimit'
        '400':
          $ref: '#/components/responses/InvalidTenant'
        '409':
          $ref: '#/components/responses/RoleNotEnabled'
    put:
      operationId: putTenantRateLimit
      tags: [rate_limits]
      summary: Set a tenant's override
      description: |
        Stored in this node's memory and persisted to its store, so it
        survives a restart of this node. Takes effect at once: the tenant's
        bucket is reset, so a raised limit is not held back by the old limit's
        accumulated debt. A `{rate, burst}` pair is required whole — neither key
        is inferred.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimit'
      responses:
        '200':
          description: The stored override.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantRateLimit'
        '400':
          $ref: '#/components/responses/InvalidRateLimit'
        '409':
          $ref: '#/components/responses/RoleNotEnabled'
        '503':
          $ref: '#/components/responses/NodeStoreUnavailable'
    delete:
      operationId: deleteTenantRateLimit
      tags: [rate_limits]
      summary: Remove a tenant's override
      description: |
        The config's limit applies again (`source: config` or `default`), and
        the bucket is reset. Immediate, like the source store's own deletes —
        and, like them, this node's alone.
      responses:
        '204':
          description: Deleted. No body.
        '400':
          $ref: '#/components/responses/InvalidTenant'
        '404':
          $ref: '#/components/responses/RateLimitNotFound'
        '409':
          $ref: '#/components/responses/RoleNotEnabled'
        '503':
          $ref: '#/components/responses/NodeStoreUnavailable'
  /admin/routes/test:
    servers:
      - url: http://localhost:4003
        description: Route-management listener (default `routes.admin.port`).
    post:
      operationId: testRoute
      tags: [routes]
      summary: Dry run — what would happen to this request?
      description: |
        Runs the same decision the guard runs, and reports it: the global IP
        rules first, then route matching, then the matched route's own rules.
        Nothing is captured, no counter moves, and the decision cache is
        neither read nor written — a dry run cannot make a path look hot, and
        it never answers from an entry another request wrote. This is the
        endpoint that turns "why was my webhook rejected" into one call, and it
        is worth using before changing any route.

        `ip_rule` is the rule that *decided* an IP question, with the list it
        came from (`scope`); it is `null` whenever no rule decided — a list's
        `default` (nothing matched), or a reason that is not an IP decision at
        all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DryRunRequest'
            example: {method: POST, path: /webhooks/stripe, ip: 203.0.113.7}
      responses:
        '200':
          description: 'The decision, and what produced it: `decision: deny` with the `reason` that denied it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
              examples:
                matched:
                  summary: 'An enabled route matched — here, after its own rule allowed the address'
                  value:
                    decision: allow
                    reason: matched
                    route_id: stripe
                    ip_rule: {action: allow, cidr: '203.0.113.0/24', scope: route}
                matchedWithoutRouteRules:
                  summary: The same decision with no rule behind it (a route whose `ip_rules` are empty)
                  value: {decision: allow, reason: matched, route_id: stripe, ip_rule: null}
                noRoute:
                  summary: No route matches the path
                  value: {decision: deny, reason: no_route, route_id: null, ip_rule: null}
                methodMismatch:
                  summary: The path matches, but the method does not
                  value: {decision: deny, reason: method, route_id: null, ip_rule: null}
                ipDeniedByRoute:
                  summary: The matched route's own deny rule matched this address
                  value:
                    decision: deny
                    reason: ip_denied
                    route_id: stripe
                    ip_rule: {action: deny, cidr: '203.0.113.0/24', scope: route}
                ipDeniedByPinnedRoute:
                  summary: |
                    The route declares an allow-only list and this address matches
                    none of it, so no rule decided and `ip_rule` is `null` — the
                    route simply is not available to that sender.
                  value: {decision: deny, reason: ip_denied, route_id: stripe, ip_rule: null}
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /admin/routes:
    servers:
      - url: http://localhost:4003
        description: Route-management listener (default `routes.admin.port`).
    get:
      operationId: listRoutes
      tags: [routes]
      summary: List route definitions
      description: |
        Ordered by id, which is a total order over the slug alphabet and so also
        a pagination cursor. `next_cursor` is `null` on the last page.
      parameters:
        - name: enabled
          in: query
          required: false
          description: Filter by `enabled`. Anything other than `true`/`false` is `400 invalid_query`.
          schema:
            type: string
            enum: ['true', 'false']
          example: 'true'
        - name: limit
          in: query
          required: false
          description: Maximum routes per page. Clamped to 1..200.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 200
          example: 100
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page; returns ids greater than it.
          schema:
            type: string
          example: checkout
      responses:
        '200':
          description: One page of route definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePage'
              examples:
                oneRoute:
                  summary: After creating `stripe`
                  value:
                    routes:
                      - id: stripe
                        path: /webhooks/stripe
                        methods: [POST]
                        enabled: true
                        ip_rules: [{action: allow, cidr: '203.0.113.0/24'}]
                        metadata: {owner: payments}
                        inserted_at: '2026-09-28T14:16:26Z'
                        updated_at: '2026-09-28T14:16:26Z'
                    next_cursor: null
        '400':
          $ref: '#/components/responses/InvalidQuery'
    post:
      operationId: createRoute
      tags: [routes]
      summary: Create a route definition
      description: |
        `id` is optional: without one, a lowercase ULID is generated. A taken id
        is a `409 duplicate_route`, and an **enabled** route may not capture the
        same normalized path and any of the same methods as another enabled
        route (two disabled routes are free to collide — they capture nothing).
        Past `routes.max_routes` the answer is `409 too_many_routes`; nothing is
        ever evicted, because an evicted route would start rejecting real
        webhooks.

        The id `test` is **not** reserved: only the `POST /admin/routes/test`
        *dry run* shadows this path, and it shadows it for `POST` alone. `POST
        /admin/routes` with `{"id": "test"}` creates that route like any other
        id, and `GET`/`PUT`/`PATCH`/`DELETE /admin/routes/test` then address it
        normally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteInput'
            example:
              id: stripe
              path: /webhooks/stripe
              methods: [POST]
              ip_rules: [{action: allow, cidr: '203.0.113.0/24'}]
              metadata: {owner: payments}
      responses:
        '201':
          description: The stored route, timestamps included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
              examples:
                created:
                  value:
                    id: stripe
                    path: /webhooks/stripe
                    methods: [POST]
                    enabled: true
                    ip_rules: [{action: allow, cidr: '203.0.113.0/24'}]
                    metadata: {owner: payments}
                    inserted_at: '2026-09-28T14:16:26Z'
                    updated_at: '2026-09-28T14:16:26Z'
        '400':
          $ref: '#/components/responses/InvalidRoute'
        '409':
          $ref: '#/components/responses/DuplicateRoute'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /admin/routes/{id}:
    servers:
      - url: http://localhost:4003
        description: Route-management listener (default `routes.admin.port`).
    parameters:
      - name: id
        in: path
        required: true
        description: The route's id (a lowercase slug).
        schema:
          type: string
        example: stripe
    get:
      operationId: getRoute
      tags: [routes]
      summary: Fetch one route definition
      responses:
        '200':
          description: The route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
              examples:
                stripe:
                  value:
                    id: stripe
                    path: /webhooks/stripe
                    methods: [POST]
                    enabled: true
                    ip_rules: [{action: allow, cidr: '203.0.113.0/24'}]
                    metadata: {owner: payments}
                    inserted_at: '2026-09-28T14:16:26Z'
                    updated_at: '2026-09-28T14:16:26Z'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceRoute
      tags: [routes]
      summary: Replace a route definition
      description: |
        A full definition, `PUT`-idempotent: the `id` comes from the path (a body
        `id` is ignored), `inserted_at` is preserved, and `updated_at` moves. A
        `PUT` for an id that does not exist yet *creates* it, so the cap applies
        to that case too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteInput'
            example:
              path: /webhooks/stripe
              methods: [POST]
              enabled: false
              ip_rules: []
              metadata: {owner: payments, staging: true}
      responses:
        '200':
          description: The stored route, with the `inserted_at` it already had.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
              examples:
                replaced:
                  value:
                    id: stripe
                    path: /webhooks/stripe
                    methods: [POST]
                    enabled: false
                    ip_rules: []
                    metadata: {owner: payments, staging: true}
                    inserted_at: '2026-09-28T14:16:26Z'
                    updated_at: '2026-09-28T14:16:31Z'
        '400':
          $ref: '#/components/responses/InvalidRoute'
        '409':
          $ref: '#/components/responses/DuplicateRoute'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
    patch:
      operationId: updateRoute
      tags: [routes]
      summary: Patch a route definition
      description: |
        Only `enabled`, `methods`, `ip_rules`, and `metadata` are patchable.
        `path` and `id` are **immutable** here — moving a route changes which
        requests it captures, which is a `PUT` (a full, reviewable definition),
        not a patch — and answer `400 invalid_route` with
        `message: "immutable; use PUT"`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutePatch'
            example: {enabled: true}
      responses:
        '200':
          description: The patched route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
              examples:
                reenabled:
                  value:
                    id: stripe
                    path: /webhooks/stripe
                    methods: [POST]
                    enabled: true
                    ip_rules: []
                    metadata: {owner: payments, staging: true}
                    inserted_at: '2026-09-28T14:16:26Z'
                    updated_at: '2026-09-28T14:16:33Z'
        '400':
          $ref: '#/components/responses/InvalidRoute'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateRoute'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
    delete:
      operationId: deleteRoute
      tags: [routes]
      summary: Delete a route definition
      description: |
        Immediate: the guard stops capturing the route on the next request, with
        no cache TTL to wait out — the decision cache is keyed by the published
        snapshot's epoch, so a mutation makes every cached decision unreachable.
        Whether a restart brings the route back is the store's question: the
        default ETS store re-seeds from `routes.seed` on **every** boot, so a
        deleted route that is also in the seed returns — remove it from the seed
        as well — while the Redis store seeds once per namespace and keeps the
        deletion.
      responses:
        '204':
          description: Deleted. No body.
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /admin/ip-rules:
    servers:
      - url: http://localhost:4003
        description: Route-management listener (default `routes.admin.port`).
    get:
      operationId: getIpRules
      tags: [routes]
      summary: The global IP rules
      responses:
        '200':
          description: The ordered global rules, and the `default` when none match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpRules'
              examples:
                empty:
                  summary: 'The default: allow everything, no rules'
                  value: {default: allow, rules: []}
                pinned:
                  summary: Deny by default, with one allowed range
                  value:
                    default: deny
                    rules: [{action: allow, cidr: '203.0.113.0/24'}]
    put:
      operationId: putIpRules
      tags: [routes]
      summary: Replace the global IP rules
      description: |
        Ordered, first match wins, and `default` decides the case no rule
        matched. Both `default` and `rules` are required — omitting either is a
        `400`, not a silent default. These are a **floor**: a global `deny`
        always wins, including over a route's own `allow`. CIDRs are parsed at
        write time, so a typo is a `400` here rather than a
        silently-never-matching rule on the hot path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpRules'
            example:
              default: deny
              rules: [{action: allow, cidr: '203.0.113.0/24'}]
      responses:
        '200':
          description: The stored rules, as parsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpRules'
              examples:
                pinned:
                  value:
                    default: deny
                    rules: [{action: allow, cidr: '203.0.113.0/24'}]
        '400':
          $ref: '#/components/responses/InvalidIpRules'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /v1/audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: The audit log
      description: |
        Newest first. Requires `audit.enabled: true` (`409 audit_disabled`
        otherwise) and the `admin` role with a grant over all tenants. Reads are
        node-local, like the DLQ: this node's store holds the entries of the
        requests this node served.

        Every mutation and every denial on the operator API, the
        route-management API and SCIM is recorded; reads are not. A mutation is
        recorded `pending` before its handler runs and rewritten with its
        outcome when it answers, so a `pending` entry that stays `pending` is a
        request whose outcome was lost (the node crashed). Request bodies are
        never recorded.

        A page ends at `limit` entries or after 100 000 examined entries, and
        `next_cursor` is where to resume (`null` when the log was read to its
        start).
      parameters:
        - name: tenant
          in: query
          required: false
          description: Only entries about this tenant.
          schema:
            type: string
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditOutcome'
        - $ref: '#/components/parameters/AuditSince'
        - $ref: '#/components/parameters/AuditUntil'
        - $ref: '#/components/parameters/AuditLimit'
        - $ref: '#/components/parameters/AuditCursor'
      responses:
        '200':
          description: Matching entries, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/InvalidFilter'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/AuditDisabled'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /v1/tenants/{tenant}/audit:
    parameters:
      - name: tenant
        in: path
        required: true
        description: The tenant id.
        schema:
          type: string
    get:
      operationId: listTenantAudit
      tags: [audit]
      summary: One tenant's audit entries
      description: |
        As `GET /v1/audit`, limited to entries about `tenant`. Needs the `admin`
        role for that tenant: a grant scoped to `[tenant]` is enough.
      parameters:
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditOutcome'
        - $ref: '#/components/parameters/AuditSince'
        - $ref: '#/components/parameters/AuditUntil'
        - $ref: '#/components/parameters/AuditLimit'
        - $ref: '#/components/parameters/AuditCursor'
      responses:
        '200':
          description: Matching entries, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/InvalidFilter'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/AuditDisabled'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
