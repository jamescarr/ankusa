        provisioning runs cannot lose each other's members.
      security: [{scimToken: []}]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimPatchOp'
          application/json:
            schema:
              $ref: '#/components/schemas/ScimPatchOp'
      responses:
        '200':
          description: The patched group.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimGroup'
        '400':
          $ref: '#/components/responses/ScimBadRequest'
        '401':
          $ref: '#/components/responses/ScimUnauthenticated'
        '404':
          $ref: '#/components/responses/ScimNotFound'
        '409':
          $ref: '#/components/responses/ScimUniqueness'
        '503':
          $ref: '#/components/responses/ScimUnavailable'
    delete:
      operationId: scimDeleteGroup
      tags: [scim]
      summary: Delete a group
      description: Members stay users; only the membership goes.
      security: [{scimToken: []}]
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/ScimUnauthenticated'
        '404':
          $ref: '#/components/responses/ScimNotFound'
        '503':
          $ref: '#/components/responses/ScimUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A JWT issued by the configured OIDC identity provider
        (`auth.oidc.issuer`), with the configured audience. Required on every
        operation except `GET /health` and `GET /ready` when `auth.enabled` is
        true; ignored when it is false.
    scimToken:
      type: http
      scheme: bearer
      description: |
        The static `scim.token` the identity provider's SCIM client sends. It
        opens `/scim/v2` and nothing else.
  schemas:
    Health:
      type: object
      required: [status, instance, roles]
      properties:
        status:
          const: ok
        instance:
          type: string
        roles:
          type: array
          description: The roles this node runs, sorted.
          items:
            type: string
            enum: [claim_check, dispatch, edge, storage]
    Readiness:
      type: object
      required: [status, instance, store]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        instance:
          type: string
        store:
          type: string
          enum: [ok, none, store_unavailable, write_failed]
          description: |
            `none` on a node without a local store; `store_unavailable` when
            the store is closed or does not answer; `write_failed` when the
            probe write failed.
    Wal:
      type: object
      required: [instance, wal]
      properties:
        instance:
          type: string
        wal:
          type: object
          description: |
            This node's store: `next_seq` (exact), `hooks` and `deliveries`
            (RocksDB key estimates), `disk_bytes`; `{}` when the store is
            unreachable.
    DlqEntry:
      type: object
      description: A dead-lettered hook. The recorded reason is `inspect/1` of a term.
      required:
        - id
        - source_id
        - tenant_id
        - seq
        - received_at
        - dead_lettered_at
        - size
        - content_type
        - reason
      properties:
        id:
          type: string
          description: Envelope id (a UUIDv7).
        source_id:
          type: string
        tenant_id:
          type: [string, 'null']
        seq:
          type: [integer, 'null']
          description: Queue sequence number of the committed hook, `null` if it never committed.
        received_at:
          type: integer
          description: When the edge received the hook, unix milliseconds.
        dead_lettered_at:
          type: integer
          description: When dispatch gave up, unix milliseconds.
        size:
          type: integer
        content_type:
          type: [string, 'null']
        reason:
          type: string
          description: '`inspect/1` of the give-up reason, e.g. `{:sink, Ankusa.Sink.Http, {:status, 503}}`.'
    DlqPage:
      type: object
      required: [total, entries]
      properties:
        total:
          type: integer
          description: Number of matching entries, before `limit`.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DlqEntry'
    QuarantineEntry:
      type: object
      required: [id, source_id, received_at, reason]
      properties:
        id:
          type: string
        source_id:
          type: string
        tenant_id:
          type: [string, 'null']
          description: The hook's tenant (`default` unless the source or a tenant route set one); `null` only for entries held before the pen recorded it.
        received_at:
          type: integer
          description: When the edge received the hook, unix milliseconds.
        reason:
          type: string
          description: '`inspect/1` of the verifier failure, e.g. `:no_match`.'
        size:
          type: [integer, 'null']
          description: Bytes the entry holds against `quarantine.max_bytes`; `null` for entries held before the pen recorded it.
    QuarantinePage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/QuarantineEntry'
    QuarantinePurge:
      type: object
      required: [deleted, bytes]
      properties:
        deleted:
          type: integer
          description: Entries deleted.
        bytes:
          type: integer
          description: The bytes they held against `quarantine.max_bytes`.
    ReplaySpec:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [dlq, archive, quarantine]
          description: |
            `dlq` re-sends dead rows; `archive` re-sends archived hooks over a
            time window; `quarantine` re-verifies hooks held in the quarantine
            pen and commits the ones that now pass.
        source_id:
          type: string
          description: Exact source id to filter on.
        id:
          type: string
          description: Exact envelope id to filter on (`dlq` and `quarantine` only).
        since:
          type: integer
          description: |
            Inclusive lower bound, unix milliseconds: on the dead-letter
            timestamp (`dlq`) or on `received_at` (`quarantine`).
        until:
          type: integer
          description: |
            Inclusive upper bound, unix milliseconds, on the same timestamp as
            `since` (`dlq` and `quarantine` only). Must not be less than `since`.
        from:
          type: integer
          minimum: 0
          description: Inclusive lower bound on `received_at`, unix milliseconds (`archive` only).
        to:
          type: integer
          description: |
            Inclusive upper bound on `received_at`, unix milliseconds
            (`archive` only). Must be greater than `from`, and old enough that
            the compactor has archived the whole window (`storage.roll_ms +
            storage.interval_ms` in the past).
        sinks:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: integer
            minimum: 0
          description: Indexes into the source's current sinks; omitted means every current sink (`archive` only).
        rate:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1000
          description: Items per second — delivery rows for `dlq`, hooks for `archive` and `quarantine`.
        max_lag_ms:
          type: integer
          minimum: 100
          maximum: 600000
          default: 2000
          description: The oldest-due lag at which the job throttles, in milliseconds.
    ReplayPatch:
      type: object
      properties:
        state:
          type: string
          enum: [running, paused, cancelled]
        rate:
          type: integer
          minimum: 1
          maximum: 100000
        max_lag_ms:
          type: integer
          minimum: 100
          maximum: 600000
    Replay:
      type: object
      description: |
        A replay job. Counters are best-effort: `moved`/`scanned`/`skipped` are
        committed with the job's cursor, `delivered`/`dead` come from the
        pipeline's outcome reports and are approximate across a crash.
      required:
        [id, kind, state, filter, rate, max_lag_ms, created_at, updated_at, finished_at,
         moved, scanned, skipped, delivered, dead, error]
      properties:
        id:
          type: string
          description: UUIDv7 job id; also the `replay_id` on every replayed delivery.
        kind:
          type: string
          enum: [dlq, archive, quarantine]
        state:
          type: string
          enum: [running, paused, done, cancelled, failed]
        filter:
          type: object
          description: Exactly the filter keys given at creation.
        rate:
          type: integer
          description: Items per second.
        max_lag_ms:
          type: integer
          description: Throttle threshold, milliseconds.
        created_at:
          type: integer
          description: Unix milliseconds.
        updated_at:
          type: integer
          description: Unix milliseconds.
        finished_at:
          type: [integer, 'null']
          description: Unix milliseconds, `null` until the job finishes.
        moved:
          type: integer
          description: Rows revived (`dlq`), hooks re-enqueued (`archive`), or held hooks committed after passing verification again (`quarantine`).
        scanned:
          type: integer
          description: Keys or records examined.
        skipped:
          type: integer
          description: |
            Archive records with no source, no bound sink, or an undecodable
            frame (`archive`); held hooks that still fail verification, whose
            source is gone, or that were a duplicate of a hook already
            accepted (`quarantine` — the duplicates leave the pen, the rest
            stay in it).
        delivered:
          type: integer
          description: Deliveries this job's rows got through, per pipeline outcome reports.
        dead:
          type: integer
          description: Deliveries this job's rows dead-lettered again, per pipeline outcome reports.
        error:
          type: [string, 'null']
          description: '`null`, or why the job paused itself or failed.'
    ReplayList:
      type: object
      required: [replays]
      properties:
        replays:
          type: array
          items:
            $ref: '#/components/schemas/Replay'
    RateLimit:
      type: object
      description: |
        A rate limit. `rate` is hooks per second and may be fractional (`0.5`
        is one every two seconds); `burst` is the most hooks admitted back to
        back.
      required: [rate, burst]
      additionalProperties: false
      properties:
        rate:
          type: number
          exclusiveMinimum: 0
          example: 50
        burst:
          type: integer
          minimum: 1
          example: 100
    TenantRateLimit:
      type: object
      description: One tenant's limit, and whether it came from config or an override.
      required: [tenant, rate, burst, source]
      properties:
        tenant:
          type: string
        rate:
          type: [number, 'null']
          description: '`null` when `source` is `none`.'
        burst:
          type: [integer, 'null']
          description: '`null` when `source` is `none`.'
        source:
          type: string
          enum: [override, config, default, none]
          description: |
            `override`: this node's runtime override. `config`:
            `rate_limits.tenants`. `default`: `rate_limits.default`. `none`: no
            limit applies, so the tenant is unlimited.
    RateLimits:
      type: object
      required: [default, tenants]
      properties:
        default:
          oneOf:
            - $ref: '#/components/schemas/RateLimit'
            - type: 'null'
          description: |
            The configured `rate_limits.default`, or `null` when the config sets
            none. It is never an override: overrides are per tenant.
        tenants:
          type: array
          description: Sorted by tenant id.
          items:
            $ref: '#/components/schemas/TenantRateLimit'
    RoutesHealth:
      type: object
      description: |
        `GET /health` on the `routes.admin.port` listener: how many route
        definitions this node is enforcing.
      required: [status, routes]
      properties:
        status:
          const: ok
        routes:
          type: integer
          description: The number of route definitions in the table, enabled or not.
          example: 1
    IpRule:
      type: object
      description: One rule. `cidr` is parsed at write time, so an unparseable one is a `400`.
      required: [action, cidr]
      properties:
        action:
          type: string
          enum: [allow, deny]
        cidr:
          type: string
          description: |
            An IPv4 or IPv6 network. A bare address is a full-length prefix
            (`10.1.2.3` is `/32`). Families never cross: `0.0.0.0/0` matches only
            IPv4, `::/0` only IPv6, and an IPv4-mapped client (`::ffff:10.1.2.3`)
            is normalized to IPv4 before matching.
          example: '203.0.113.0/24'
    IpRules:
      type: object
      description: |
        The global IP rules: a floor every route inherits. A route's own
        `ip_rules` replace this list *for that route*, but a global `deny` has
        already won by then.
      required: [default, rules]
      properties:
        default:
          type: string
          description: Applied when no rule in `rules` matched.
          enum: [allow, deny]
        rules:
          type: array
          description: Ordered; the first match wins.
          items:
            $ref: '#/components/schemas/IpRule'
    Route:
      type: object
      description: |
        A route definition: the capture gate. It decides whether a request is
        captured, not which source it belongs to.
      required: [id, path, methods, enabled, ip_rules, metadata, inserted_at, updated_at]
      properties:
        id:
          type: string
          description: |
            A lowercase slug, `^[a-z0-9](?:[a-z0-9_-]{0,62}[a-z0-9])?$`, supplied
            by the client or generated (a lowercase ULID). Immutable after
            creation.
          example: stripe
        path:
          type: string
          description: |
            A pattern, not a regex: `/`-separated segments, each a literal, a
            `:param` (exactly one segment), or a trailing `*` wildcard (one or
            more segments — `/hooks/shopify/*` does not match `/hooks/shopify`).
            Requests are normalized before matching, and a percent-encoded slash
            (`%2F`) or a `.`/`..` segment is a rejection, not a boundary.
          example: /webhooks/stripe
        methods:
          type: array
          description: The methods this route captures. Defaults to `[POST]`.
          items:
            type: string
            pattern: '^[A-Z]+$'
          example: [POST]
        enabled:
          type: boolean
          description: |
            A disabled route captures nothing — and is exempt from the duplicate
            check, so a staged definition may sit next to a live one.
        ip_rules:
          type: array
          description: |
            Empty (the default) means the global list applies. Non-empty
            **replaces** it for this route, and a client matching none of them is
            denied: the point of pinning a provider's ranges is that anything
            else is refused.
          items:
            $ref: '#/components/schemas/IpRule'
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON for the operator — an owner, a sender name.
          example: {owner: payments}
        inserted_at:
          type: string
          format: date-time
          description: Set once, at creation. A `PUT` keeps it; a `PATCH` cannot touch it.
          example: '2026-09-28T14:16:26Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-28T14:16:26Z'
    RouteInput:
      type: object
      description: |
        A route definition as written. Unknown keys are a `400 invalid_route`
        (`"unknown field"`), as are `inserted_at`/`updated_at`: an update cannot
        forge its own history.
      required: [path]
      properties:
        id:
          type: string
          description: Optional on create. On `PUT` the path's `id` wins.
        path:
          type: string
          example: /webhooks/stripe
        methods:
          type: array
          items:
            type: string
            pattern: '^[A-Z]+$'
          default: [POST]
        enabled:
          type: boolean
          default: true
        ip_rules:
          type: array
          items:
            $ref: '#/components/schemas/IpRule'
          default: []
        metadata:
          type: object
          additionalProperties: true
          default: {}
    RoutePatch:
      type: object
      description: |
        Only these four fields are patchable. `path` and `id` answer
        `400 invalid_route` with `message: "immutable; use PUT"`.
      properties:
        enabled:
          type: boolean
        methods:
          type: array
          items:
            type: string
            pattern: '^[A-Z]+$'
        ip_rules:
          type: array
          items:
            $ref: '#/components/schemas/IpRule'
        metadata:
          type: object
          additionalProperties: true
    RoutePage:
      type: object
      required: [routes, next_cursor]
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        next_cursor:
          type: [string, 'null']
          description: |
            The last id of this page when another page exists — pass it back as
            `cursor`. `null` on the last page.
          example: null
    DryRunRequest:
      type: object
      required: [method, path, ip]
      properties:
        method:
          type: string
          example: POST
        path:
          type: string
          description: The request path as the client would send it, normalization included.
          example: /webhooks/stripe
        ip:
          type: string
          description: The client address. `X-Forwarded-For` resolution is the guard's job, not the dry run's.
          example: 203.0.113.7
    DryRunIpRule:
      type: object
      description: The rule that produced an IP decision, and the list it came from.
      required: [action, cidr, scope]
      properties:
        action:
          type: string
          enum: [allow, deny]
        cidr:
          type: string
          example: '203.0.113.0/24'
        scope:
          type: string
          enum: [global, route]
          description: |
            `global` for `routes.ip_rules`, `route` for the matched route's own
            list.
    DryRunResult:
      type: object
      required: [decision, reason, route_id, ip_rule]
      properties:
        decision:
          type: string
          enum: [allow, deny]
        reason:
          type: string
          enum: [matched, no_route, method, ip_denied]
          description: |
            `matched` is the only `allow`. `no_route` and `method` are both a
            `404` to the sender, so a probe cannot learn which paths exist;
            `ip_denied` is a `403` (or a `404` with
            `routes.ip_denied_status: 404`).
        route_id:
          type: [string, 'null']
          description: The matched route, when one matched — including when its own rules then denied the address.
          example: stripe
        ip_rule:
          oneOf:
            - $ref: '#/components/schemas/DryRunIpRule'
            - type: 'null'
          description: |
            The rule that decided the IP question — the global list's or the
            matched route's own — or `null` when no rule decided: a list's
            `default` applied because nothing matched, or the reason is not an
            IP decision (`no_route`, `method`). A route's own `allow` rule
            deciding a `matched` decision is reported here too.
    Error:
      type: object
      description: The error shape every endpoint answers with, on every listener.
      required: [error]
      properties:
        error:
          type: string
          enum:
            - not_found
            - invalid_filter
            - role_not_enabled
            - invalid_route
            - duplicate_route
            - too_many_routes
            - invalid_query
            - invalid_ip_rules
            - invalid_request
            - invalid_body
            - invalid_tenant
            - invalid_rate_limit
            - rate_limit_not_found
            - store_unavailable
            - wal_disabled
            - unauthenticated
            - invalid_token
            - forbidden
            - user_not_provisioned
            - user_inactive
            - auth_unavailable
            - audit_unavailable
            - audit_disabled
            - internal_error
            - bad_request
        field:
          type: string
          description: |
            The offending field: on `invalid_filter` the parameter or `body`; on
            the route errors the route field (`path`, `ip_rules`, …), the
            parameter (`enabled`, `limit`), or the dry-run field.
        message:
          type: string
          description: Human-readable reason, on the `invalid_*` codes that carry one.
        role:
          type: string
          description: Present on `role_not_enabled`; the role this node does not run.
        conflicting_id:
          type: string
          description: Present on `duplicate_route`; the route already holding that path and method.
        max_routes:
          type: integer
          description: Present on `too_many_routes`; the configured cap.
        required_role:
          type: string
          enum: [viewer, operator, admin]
          description: Present on `forbidden`; the lowest role the operation needs.
    AuditActor:
      type: object
      description: Who made the request.
      required: [type, subject, username, user_id, ip]
      properties:
        type:
          type: string
          enum: [anonymous, user, service, scim]
          description: |
            `anonymous` when `auth.enabled` is false or the request carried no
            valid credential; `user` for a provisioned user; `service` for a
            token matching only a subject binding; `scim` for the SCIM client.
        subject:
          type: [string, 'null']
          description: The token's subject claim.
        username:
          type: [string, 'null']
        user_id:
          type: [string, 'null']
          description: The directory user's id, when SCIM is on.
        ip:
          type: [string, 'null']
          description: The peer address. `X-Forwarded-For` is not trusted.
    AuditEntry:
      type: object
      required: [id, at, time, instance, listener, action, outcome, status, method, path, tenant, target, actor, request_id]
      properties:
        id:
          type: string
          description: A UUIDv7; the CloudEvent `id` when the entry is shipped to `audit.sinks`.
        at:
          type: integer
          description: When the request arrived, unix milliseconds.
        time:
          type: string
          format: date-time
        instance:
          type: string
        listener:
          type: string
          enum: [admin, routes]
          description: SCIM requests are on the `admin` listener.
        action:
          type: string
          description: The action name, e.g. `source.create`, `replay.update`, `route.delete`, `scim.user.update`, `audit.list`.
        outcome:
          type: string
          enum: [pending, success, failure, error, denied]
          description: |
            `success` a `2xx`; `failure` the handler refused; `error` the handler
            crashed (the change may or may not have happened); `denied` a
            `401`/`403`; `pending` the outcome was never recorded.
        status:
          type: [integer, 'null']
          description: The response status; `null` while `pending`.
        method:
          type: string
        path:
          type: string
          description: The request path, without its query string.
        tenant:
          type: [string, 'null']
        target:
          type: [string, 'null']
          description: The entity acted on (`<tenant>.<source>`, a route or replay id, a SCIM resource id).
        actor:
          $ref: '#/components/schemas/AuditActor'
        request_id:
          type: [string, 'null']
          description: The request's `X-Request-Id`, when it carried one.
    AuditPage:
      type: object
      required: [entries, next_cursor]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next, older, page. `null` at the end of the log.
    ScimListResponse:
      type: object
      required: [schemas, totalResults, startIndex, itemsPerPage, Resources]
      properties:
        schemas:
          type: array
          items:
            type: string
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            type: object
    ScimMeta:
      type: object
      readOnly: true
      properties:
        resourceType:
          type: string
        created:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        version:
          type: string
          description: A weak ETag, `W/"<n>"`.
        location:
          type: string
    ScimUser:
      type: object
      description: |
        An RFC 7643 User. Only the attributes listed here and the enterprise
        extension are kept.
      required: [userName]
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
          readOnly: true
        externalId:
          type: string
        userName:
          type: string
          maxLength: 256
          description: Unique, case-insensitively. What `auth.user_match` compares a token's claim with.
        name:
          type: object
        displayName:
          type: string
        nickName:
          type: string
        title:
          type: string
        userType:
          type: string
        preferredLanguage:
          type: string
        locale:
          type: string
        timezone:
          type: string
        active:
          type: boolean
          default: true
          description: 'A user with `active: false` is refused (`403 user_inactive`) whatever their token says.'
        emails:
          type: array
          items:
            type: object
        phoneNumbers:
          type: array
          items:
            type: object
        groups:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              value:
                type: string
              display:
                type: string
        meta:
          $ref: '#/components/schemas/ScimMeta'
      additionalProperties: true
    ScimGroup:
      type: object
      required: [displayName]
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
          readOnly: true
        externalId:
          type: string
        displayName:
          type: string
          maxLength: 256
          description: Unique, case-insensitively. What `auth.bindings[].group` names.
        members:
          type: array
          items:
            type: object
            required: [value]
            properties:
              value:
                type: string
                description: A user id.
              display:
                type: string
                readOnly: true
        meta:
          $ref: '#/components/schemas/ScimMeta'
    ScimPatchOp:
      type: object
      required: [schemas, Operations]
      properties:
        schemas:
          type: array
          items:
            const: 'urn:ietf:params:scim:api:messages:2.0:PatchOp'
        Operations:
          type: array
          minItems: 1
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                description: '`add`, `replace` or `remove`, case-insensitive.'
              path:
                type: string
              value: {}
    ScimError:
      type: object
      required: [schemas, status, detail]
      properties:
        schemas:
          type: array
          items:
            const: 'urn:ietf:params:scim:api:messages:2.0:Error'
        status:
          type: string
        scimType:
          type: string
          enum: [invalidFilter, invalidSyntax, invalidPath, invalidValue, noTarget, mutability, uniqueness]
        detail:
          type: string
  responses:
    InvalidFilter:
      description: '`400`. `invalid_filter`: a non-integer `since`, `until` or `limit`, a negative `since`/`until` or an `until` before `since` on a quarantine purge, a non-string `source_id` or `id`, a replay spec with an unknown key or a bad field (`kind`, `since`/`until`, `from`/`to`, `sinks`, `rate`, `max_lag_ms`, `state`), or a replay body that is not a JSON object or is over 64 KiB. `field` names the offending parameter or key.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidTenant:
      description: '`400`. `invalid_tenant`: the tenant is not a valid identity — it must match `[A-Za-z0-9_-]{1,64}`, because it is a URL path segment and a storage partition.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badTenant:
              value: {error: invalid_tenant}
    InvalidRateLimit:
      description: '`400`. `invalid_rate_limit`: the body is not a JSON object, or not a limit — `rate` and `burst` are both required, `rate` is a number greater than 0, `burst` an integer of at least 1, and unknown fields are refused. `message` says which.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            zeroRate:
              value: {error: invalid_rate_limit, message: 'rate must be a number greater than 0, got 0'}
            missingBurst:
              value: {error: invalid_rate_limit, message: 'burst is required'}
            unknownField:
              value: {error: invalid_rate_limit, message: 'unknown field "per"'}
            notJson:
              value: {error: invalid_rate_limit, message: 'body must be a JSON object'}
    RoleNotEnabled:
      description: '`409`. `role_not_enabled`: this node does not run the role the route needs. Ask another node.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ReplayNotFound:
      description: '`404`. `replay_not_found`: this node holds no replay job with that id.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: replay_not_found}
    WalDisabled:
      description: '`409`. `wal_disabled`: this node runs `wal.type: none` and has no log to report.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: wal_disabled}
    InvalidRoute:
      description: '`400`. `invalid_route`: a route definition that would not mean what it says — a path that is not rooted or has an illegal segment, a non-boolean `enabled`, a bad CIDR, unknown fields, or `path`/`id` in a `PATCH`. `field` names it and `message` says why. Also `invalid_body` when the body never parsed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unknownField:
              summary: '`inserted_at` is not a route field'
              value: {error: invalid_route, field: inserted_at, message: 'unknown field'}
            badId:
              value: {error: invalid_route, field: id, message: 'must be a lowercase slug of at most 64 characters'}
            unrootedPath:
              value: {error: invalid_route, field: path, message: 'must start with "/"'}
            badSegment:
              value: {error: invalid_route, field: path, message: 'invalid segment "*"'}
            immutablePath:
              value: {error: invalid_route, field: path, message: 'immutable; use PUT'}
            notJson:
              summary: '`invalid_body` instead, when the body never parsed'
              value: {error: invalid_body}
    InvalidQuery:
      description: '`400`. `invalid_query`: a `limit` that is not an integer, or an `enabled` that is neither `true` nor `false`. `field` names it.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badLimit:
              value: {error: invalid_query, field: limit}
            badEnabled:
              value: {error: invalid_query, field: enabled}
    InvalidRequest:
      description: '`400`. `invalid_request`: the dry run''s `method`, `path`, or `ip` is missing or unusable. `field` names it. Also `invalid_body` when the request body never parsed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badIp:
              value: {error: invalid_request, field: ip, message: 'must be an IPv4 or IPv6 address'}
            unmatchablePath:
              value: {error: invalid_request, field: path, message: 'is not a matchable request path'}
            missingMethod:
              value: {error: invalid_request, field: method, message: 'is required and must be a string'}
            notJson:
              summary: '`invalid_body` instead, when the body never parsed'
              value: {error: invalid_body}
    InvalidIpRules:
      description: '`400`. `invalid_ip_rules`: both `default` and `rules` are required, `default` is `allow` or `deny`, `rules` is a list, and every rule is an object with an `action` of `allow`/`deny` and a `cidr` that parses. A range inside `::ffff:0:0/96` parses but is refused, because client addresses are matched as IPv4 and such a range could never match; write the equivalent IPv4 CIDR. `field` is `default` or `rules`; a bad rule''s `message` names its index (`rule 0: ...`). A body that is not a JSON object is `invalid_body`, not this.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingDefault:
              summary: '`default` is required'
              value: {error: invalid_ip_rules, field: default, message: is required}
            missingRules:
              summary: '`rules` is required'
              value: {error: invalid_ip_rules, field: rules, message: is required}
            rulesNotAList:
              value: {error: invalid_ip_rules, field: rules, message: 'must be a list of rules'}
            unknownRuleField:
              value: {error: invalid_ip_rules, field: rules, message: 'rule 0: unknown field "cidrs"'}
            badAction:
              value: {error: invalid_ip_rules, field: rules, message: 'rule 0: invalid action "maybe"'}
            badCidr:
              value: {error: invalid_ip_rules, field: rules, message: 'rule 0: invalid cidr "10.0.0.0/33"'}
            mappedRange:
              summary: 'a range inside `::ffff:0:0/96`: it parses, but it could never match'
              value: {error: invalid_ip_rules, field: rules, message: 'rule 0: invalid cidr "::ffff:10.0.0.0/104": it is inside ::ffff:0:0/96, and client addresses are matched as IPv4, so it can never match; write the equivalent IPv4 CIDR instead'}
            badDefault:
              value: {error: invalid_ip_rules, field: default, message: 'must be "allow" or "deny", got "maybe"'}
            notJson:
              summary: '`invalid_body` instead, when the body never parsed'
              value: {error: invalid_body}
    DuplicateRoute:
      description: '`409`. `duplicate_route`: an enabled route already captures this path and one of these methods, or a `POST` names an id that is taken. `conflicting_id` is the route holding it. Also `too_many_routes`: the store is at `routes.max_routes`, and nothing is evicted to make room — delete a route instead.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            takenId:
              value: {error: duplicate_route, conflicting_id: stripe}
            samePathAndMethod:
              value: {error: duplicate_route, conflicting_id: checkout}
            atCap:
              summary: '`too_many_routes` instead, when the cap is reached'
              value: {error: too_many_routes, max_routes: 10000}
    NotFound:
      description: '`404`. `not_found`: no such route, or no such path on this listener. A method the path does not serve is also a `404`, deliberately — a probe cannot tell a missing path from a wrong method.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            noSuchRoute:
              value: {error: not_found}
    RateLimitNotFound:
      description: '`404`. `rate_limit_not_found`: this node holds no runtime override for that tenant. The config may still give it a limit — `GET` reports that as `source: config` or `default`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            noOverride:
              value: {error: rate_limit_not_found}
    StoreUnavailable:
      description: '`503`. `store_unavailable`: nothing was written. Either the route store could not be reached (a Redis store with Redis down), or the write kept losing to concurrent writers and exhausted its retries — the table changed under the snapshot it had validated, every time. Both are transient: retry, and reads keep working from this node''s in-memory snapshot either way.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            redisDown:
              value: {error: store_unavailable}
    NodeStoreUnavailable:
      description: '`503`. `store_unavailable`: this node''s store could not be read or written, so nothing changed. Transient: retry.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            storeDown:
              value: {error: store_unavailable}

    Unauthenticated:
      description: |
        `401`. `unauthenticated` (no `Authorization: Bearer` header) or
        `invalid_token` (the identity provider's token did not verify: bad
        signature, wrong issuer or audience, expired). `WWW-Authenticate:
        Bearer`. Only with `auth.enabled: true`.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              value: {error: unauthenticated}
            invalid:
              value: {error: invalid_token}
    Forbidden:
      description: |
        `403`. `forbidden` (the token's roles do not cover this operation;
        `required_role` is the lowest that does), `user_not_provisioned` (the
        token matches no SCIM user) or `user_inactive` (the SCIM user is
        deactivated). Only with `auth.enabled: true`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value: {error: forbidden, required_role: admin}
            notProvisioned:
              value: {error: user_not_provisioned}
            inactive:
              value: {error: user_inactive}
    AuthUnavailable:
      description: |
        `503`. `auth_unavailable`: the identity provider's signing keys have
        never been fetched, or the SCIM directory could not be read. The token is
        not judged; retry (`Retry-After: 1`).
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: auth_unavailable}
    AuditUnavailable:
      description: |
        `503`. `audit_unavailable`: with `audit.enabled: true` a mutation is
        recorded before it runs, and this node's store could not take the record.
        Nothing was changed; retry (`Retry-After: 1`). Any mutation on the
        operator, route-management or SCIM API can answer it.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: audit_unavailable}
    AuditDisabled:
      description: '`409`. `audit_disabled`: `audit.enabled` is false.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: audit_disabled}
    ScimUnauthenticated:
      description: '`401`. The SCIM bearer token is missing or wrong.'
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ScimError'
    ScimNotFound:
      description: '`404`. No such resource.'
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ScimError'
    ScimBadRequest:
      description: '`400`. `invalidFilter`, `invalidSyntax`, `invalidPath`, `invalidValue`, `noTarget` or `mutability`; `detail` says why.'
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ScimError'
    ScimUniqueness:
      description: '`409`. `uniqueness`: `userName` or `displayName` is taken (compared case-insensitively). Also a plain `409` when a concurrent change won every retry.'
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ScimError'
    ScimUnavailable:
      description: '`503`. The directory store could not be reached; retry (`Retry-After: 1`).'
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ScimError'
  parameters:
    AuditAction:
      name: action
      in: query
      required: false
      description: Exact action name, e.g. `source.create`.
      schema:
        type: string
    AuditActor:
      name: actor
      in: query
      required: false
      description: The actor's subject or username.
      schema:
        type: string
    AuditOutcome:
      name: outcome
      in: query
      required: false
      schema:
        type: string
        enum: [pending, success, failure, error, denied]
    AuditSince:
      name: since
      in: query
      required: false
      description: Inclusive lower bound on the entry time, unix milliseconds.
      schema:
        type: integer
    AuditUntil:
      name: until
      in: query
      required: false
      description: Inclusive upper bound on the entry time, unix milliseconds.
      schema:
        type: integer
    AuditLimit:
      name: limit
      in: query
      required: false
      description: Maximum entries returned. Clamped to 1..1000.
      schema:
        type: integer
        default: 100
    AuditCursor:
      name: cursor
      in: query
      required: false
      description: A `next_cursor` from an earlier page.
      schema:
        type: string
    ScimFilter:
      name: filter
      in: query
      required: false
      description: '`<attribute> eq "<value>"`. Nothing else is supported (`400 invalidFilter`).'
      schema:
        type: string
    ScimStartIndex:
      name: startIndex
      in: query
      required: false
      description: 1-based index of the first result.
      schema:
        type: integer
        default: 1
    ScimCount:
      name: count
      in: query
      required: false
      description: Maximum results, clamped to 0..1000.
      schema:
        type: integer
        default: 100
    ScimExcludedAttributes:
      name: excludedAttributes
      in: query
      required: false
      description: '`members` omits a group''s member list.'
      schema:
        type: string
