openapi: 3.2.0
info:
  title: Ankusa Admin API
  version: 1.0.0
  summary: Health, metrics, redacted config, DLQ, quarantine — over HTTP.
  description: |
    HTTP surface of the operator API, served by any node with
    `admin.enabled: true` (default port 4002). This document is the
    cross-language contract. The Elixir code conforms to it, not the reverse.

    This API performs **no** authentication or authorization. Ankusa does not
    manage users, API keys, or tokens; the only request authentication in the
    framework is provider signature verification on ingest. Deployers secure
    this port at their own boundary (network policy, a reverse proxy, SSO, a
    service mesh) — the same way Elasticsearch was operated before it shipped
    security. `GET /v1/config` is redacted anyway, because a proxy may let many
    people read it.

    Responses are node-local by design: the DLQ is the dispatch node's disk and
    the quarantine list is the edge node's memory. A route that needs a role
    this node does not run answers `409 role_not_enabled` so an operator can
    tell "wrong node" from "nothing there". Scrape every node's admin port to
    see the fleet.

    ## Two listeners

    Everything here is served by `Ankusa.Admin.Router` on `admin.port` (default
    4002) **except** the `routes` tag, which is `Ankusa.Routes.Router` on its own
    listener (`routes.admin.port`, default 4003): managing routes is an operator
    action, and it should share neither the ingest port nor the operator API's
    port. Both listeners are unauthenticated by design — see above.

    The `routes` endpoints edit the table the *edge* enforces, so they exist only
    on a node with `routes.enabled: true` and the `:edge` role.

    The `routes` examples in this document are a sequence, not a set: they create
    one route (`stripe`), check the listener's health, list, read, and dry-run it,
    replace the global IP rules, then replace, patch, and delete the route.
    `priv/openapi` is the source of truth — `test/ankusa/routes/router_openapi_test.exs`
    builds each request from these examples and asserts the response against the
    documented schema and example, so the code is tested against this document,
    not the other way round.
servers:
  - url: http://localhost:4002
    description: Local development listener (default `admin.port`).
  - url: http://localhost:4003
    description: |
      Route-management listener (default `routes.admin.port`). Only the `routes`
      tag is served here, plus `GET /health`.
security: []
tags:
  - name: operations
    description: Health, metrics, and the effective configuration.
  - name: dlq
    description: Inspect and replay dead-lettered hooks. `:dispatch` role only.
  - name: quarantine
    description: Recent quarantined hooks. `:edge` role only.
  - name: rate_limits
    description: |
      Per-tenant ingest rate limits: config values plus this node's runtime
      overrides (persisted to `rate_limits.json` on the node). `:edge` role
      only; node-local.
  - name: routes
    description: |
      Route definitions and the global IP rules, on the `routes.admin.port`
      listener. Requires `routes.enabled: true` and the `:edge` role. A route is
      a **capture gate**, not an identity: it decides whether a request is
      captured, while `Ankusa.RouteResolver` and the source store still decide
      which source and tenant it belongs to.
paths:
  /health:
    servers:
      - url: http://localhost:4002
        description: Operator API listener (default `admin.port`).
      - url: http://localhost:4003
        description: |
          Route-management listener (default `routes.admin.port`), only with
          routes enabled.
    get:
      operationId: getHealth
      tags: [operations]
      summary: Liveness probe
      description: |
        Both listeners answer this path, with a different body: the operator API
        reports the instance and the roles this node runs, the route-management
        API reports the size of the route table it is enforcing.
      responses:
        '200':
          description: |
            The listener is up. On `admin.port` the body is
            `{status, instance, roles}`; on `routes.admin.port` it is
            `{status, routes}`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Health'
                  - $ref: '#/components/schemas/RoutesHealth'
              examples:
                operatorPort:
                  summary: On `admin.port`
                  value: {status: ok, instance: default, roles: [edge, dispatch, storage]}
                routesPort:
                  summary: On `routes.admin.port`
                  value: {status: ok, routes: 1}
  /metrics:
    get:
      operationId: getMetrics
      tags: [operations]
      summary: Prometheus metrics
      description: |
        The node's `Ankusa.Metrics` scrape: ingest, verification, WAL commit,
        load shedding, quarantine, dispatch, compaction, and claim-check
        series. Only the events this node emits appear — an edge node has no
        dispatch series, a storage node has no ingest series.
      responses:
        '200':
          description: Prometheus text exposition format, version 0.0.4.
          content:
            text/plain:
              schema:
                type: string
              example: |
                ankusa_ingest_requests_total{instance="default",outcome="committed",source_id="demo"} 1
  /v1/config:
    get:
      operationId: getConfig
      tags: [operations]
      summary: The effective, redacted configuration
      description: |
        The whole `Ankusa.Config` as the node resolved it: defaults, then the
        YAML file, then env overrides. Secrets are redacted by key name
        (`secret`, `password`, `secret_access_key`, `token`, `sasl`, `nkey_seed`)
        and by shape (a URI password becomes `user:[REDACTED]`), so this
        is safe to hand to anyone who can reach the port.
      responses:
        '200':
          description: |
            A JSON object mirroring the config's nesting. `{module, opts}`
            becomes `{"module": "...", "opts": {...}}`; keyword lists become
            objects; atoms become strings.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /asyncapi.json:
    get:
      operationId: getAsyncApi
      tags: [operations]
      summary: AsyncAPI 3.0 document of this instance's messaging channels
      description: |
        Every Kafka topic, RabbitMQ routing key, NATS subject, and Redis channel
        this instance publishes delivered hooks to, built from the sources and
        sinks configured right now, plus the lifecycle events channel when
        `lifecycle.sinks` is set. Each message is an `Ankusa.Sink.Message` v1
        envelope (`SinkMessageV1` in `components.schemas`). Sinks without a
        channel (`log`, `http`) are left out. Carries no credentials.

        The body is JSON, which AsyncAPI tooling reads as YAML 1.2.
      responses:
        '200':
          description: The AsyncAPI document.
          content:
            application/asyncapi+json:
              schema:
                type: object
                required: [asyncapi, info]
                properties:
                  asyncapi:
                    const: '3.0.0'
                  info:
                    type: object
                additionalProperties: true
  /v1/wal:
    servers:
      - url: http://localhost:4002
        description: Operator API listener (default `admin.port`).
    get:
      operationId: getWal
      tags: [operations]
      summary: This node's WAL statistics
      description: |
        `Ankusa.WAL.stats/1` from this node's own log, `{}` when the log is
        unreachable. Node-local, like the DLQ and the quarantine list: ask
        every node. A node running `wal.type: none` has no log to report.
      responses:
        '200':
          description: This node's WAL stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wal'
        '409':
          $ref: '#/components/responses/WalDisabled'
  /v1/dlq:
    get:
      operationId: listDeadLetters
      tags: [dlq]
      summary: List dead-lettered hooks
      description: |
        Newest first, metadata only — bodies are never returned. Results are
        this node's DLQ file; with several dispatch nodes, ask each one.
      parameters:
        - name: source_id
          in: query
          required: false
          description: Exact source id to filter on.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Inclusive lower bound on when the hook was dead-lettered, in unix milliseconds.
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          description: Maximum entries returned. Values outside 0..1000 are clamped to that range.
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Matching entries, newest first. `total` counts all matches, before `limit`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqPage'
        '400':
          $ref: '#/components/responses/InvalidFilter'
        '409':
          $ref: '#/components/responses/RoleNotEnabled'
  /v1/dlq/replay:
    post:
      operationId: replayDeadLetters
      tags: [dlq]
      summary: Re-deliver dead-lettered hooks
      description: |
        Re-delivers matching entries through their source's configured sinks.
        Replay is at-least-once: an entry already delivered upstream but not
        recorded as such will be delivered again, so consumers should dedupe on
        the envelope id. Entries stay in the DLQ — replay does not remove them.
      requestBody:
        required: false
        description: |
          A filter, not a payload. Omitted or empty (`{}`) replays everything.
          Unknown keys are ignored.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayFilter'
      responses:
        '200':
          description: The number of entries replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Replayed'
        '400':
          $ref: '#/components/responses/InvalidFilter'
        '409':
          $ref: '#/components/responses/RoleNotEnabled'
  /v1/quarantine:
    get:
      operationId: listQuarantined
      tags: [quarantine]
      summary: Recent quarantined hooks
      description: |
        The edge node's in-memory recent list (at most 200 entries), newest
        first. Metadata only — bodies are never returned. The durable record
        lives in `quarantine/quarantine.log` on the node's data volume.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum entries returned. Values outside 0..1000 are clamped to that range.
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Recent quarantined entries, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantinePage'
        '400':
          $ref: '#/components/responses/InvalidFilter'
        '409':
          $ref: '#/components/responses/RoleNotEnabled'
  /v1/rate-limits:
    get:
      operationId: listRateLimits
      tags: [rate_limits]
      summary: Every limit this node enforces
      description: |
        The configured default and the configured tenants, unioned with this
        node's runtime overrides (an override wins). Sorted by tenant id.
        `default` is `null` when the config sets none, which with no tenant
        entry means unlimited.
      responses:
        '200':
          description: The default, if any, and every tenant with a limit — configured or overridden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimits'
        '409':
          $ref: '#/components/responses/RoleNotEnabled'
  /v1/tenants/{tenant}/rate-limit:
    parameters:
      - name: tenant
        in: path
        required: true
        description: The tenant id, as it appears in the catch URL.
        schema:
          type: string
    get:
      operationId: getTenantRateLimit
      tags: [rate_limits]
      summary: The limit that applies to one tenant
      description: |
        The override when this node has one, else `rate_limits.tenants`, else
        `rate_limits.default` — with `source` saying which. `source: none` means
        unlimited; `rate` and `burst` are `null` then.
      responses:
        '200':
          description: The effective limit and where it came from.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantRateLimit'
        '400':
          $ref: '#/components/responses/InvalidTenant'
        '409':
          $ref: '#/components/responses/RoleNotEnabled'
    put:
      operationId: putTenantRateLimit
      tags: [rate_limits]
      summary: Set a tenant's override
      description: |
        Stored in this node's memory and persisted to `rate_limits.json`, so it
        survives a restart of this node. Takes effect at once: the tenant's
        bucket is reset, so a raised limit is not held back by the old limit's
        accumulated debt. A `{rate, burst}` pair is required whole — neither key
        is inferred.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimit'
      responses:
        '200':
          description: The stored override.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantRateLimit'
        '400':
          $ref: '#/components/responses/InvalidRateLimit'
        '409':
          $ref: '#/components/responses/RoleNotEnabled'
        '503':
          $ref: '#/components/responses/RateLimitStoreUnavailable'
    delete:
      operationId: deleteTenantRateLimit
      tags: [rate_limits]
      summary: Remove a tenant's override
      description: |
        The config's limit applies again (`source: config` or `default`), and
        the bucket is reset. Immediate, like the source store's own deletes —
        and, like them, this node's alone.
      responses:
        '204':
          description: Deleted. No body.
        '400':
          $ref: '#/components/responses/InvalidTenant'
        '404':
          $ref: '#/components/responses/RateLimitNotFound'
        '409':
          $ref: '#/components/responses/RoleNotEnabled'
        '503':
          $ref: '#/components/responses/RateLimitStoreUnavailable'
  /admin/routes/test:
    servers:
      - url: http://localhost:4003
        description: Route-management listener (default `routes.admin.port`).
    post:
      operationId: testRoute
      tags: [routes]
      summary: Dry run — what would happen to this request?
      description: |
        Runs the same decision the guard runs, and reports it: the global IP
        rules first, then route matching, then the matched route's own rules.
        Nothing is captured, no counter moves, and the decision cache is
        neither read nor written — a dry run cannot make a path look hot, and
        it never answers from an entry another request wrote. This is the
        endpoint that turns "why was my webhook rejected" into one call, and it
        is worth using before changing any route.

        `ip_rule` is the rule that *decided* an IP question, with the list it
        came from (`scope`); it is `null` whenever no rule decided — a list's
        `default` (nothing matched), or a reason that is not an IP decision at
        all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DryRunRequest'
            example: {method: POST, path: /webhooks/stripe, ip: 203.0.113.7}
      responses:
        '200':
          description: 'The decision, and what produced it: `decision: deny` with the `reason` that denied it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
              examples:
                matched:
                  summary: 'An enabled route matched — here, after its own rule allowed the address'
                  value:
                    decision: allow
                    reason: matched
                    route_id: stripe
                    ip_rule: {action: allow, cidr: '203.0.113.0/24', scope: route}
                matchedWithoutRouteRules:
                  summary: The same decision with no rule behind it (a route whose `ip_rules` are empty)
                  value: {decision: allow, reason: matched, route_id: stripe, ip_rule: null}
                noRoute:
                  summary: No route matches the path
                  value: {decision: deny, reason: no_route, route_id: null, ip_rule: null}
                methodMismatch:
                  summary: The path matches, but the method does not
                  value: {decision: deny, reason: method, route_id: null, ip_rule: null}
                ipDeniedByRoute:
                  summary: The matched route's own deny rule matched this address
                  value:
                    decision: deny
                    reason: ip_denied
                    route_id: stripe
                    ip_rule: {action: deny, cidr: '203.0.113.0/24', scope: route}
                ipDeniedByPinnedRoute:
                  summary: |
                    The route declares an allow-only list and this address matches
                    none of it, so no rule decided and `ip_rule` is `null` — the
                    route simply is not available to that sender.
                  value: {decision: deny, reason: ip_denied, route_id: stripe, ip_rule: null}
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /admin/routes:
    servers:
      - url: http://localhost:4003
        description: Route-management listener (default `routes.admin.port`).
    get:
      operationId: listRoutes
      tags: [routes]
      summary: List route definitions
      description: |
        Ordered by id, which is a total order over the slug alphabet and so also
        a pagination cursor. `next_cursor` is `null` on the last page.
      parameters:
        - name: enabled
          in: query
          required: false
          description: Filter by `enabled`. Anything other than `true`/`false` is `400 invalid_query`.
          schema:
            type: string
            enum: ['true', 'false']
          example: 'true'
        - name: limit
          in: query
          required: false
          description: Maximum routes per page. Clamped to 1..200.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 200
          example: 100
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page; returns ids greater than it.
          schema:
            type: string
          example: checkout
      responses:
        '200':
          description: One page of route definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePage'
              examples:
                oneRoute:
                  summary: After creating `stripe`
                  value:
                    routes:
                      - id: stripe
                        path: /webhooks/stripe
                        methods: [POST]
                        enabled: true
                        ip_rules: [{action: allow, cidr: '203.0.113.0/24'}]
                        metadata: {owner: payments}
                        inserted_at: '2026-09-28T14:16:26Z'
                        updated_at: '2026-09-28T14:16:26Z'
                    next_cursor: null
        '400':
          $ref: '#/components/responses/InvalidQuery'
    post:
      operationId: createRoute
      tags: [routes]
      summary: Create a route definition
      description: |
        `id` is optional: without one, a lowercase ULID is generated. A taken id
        is a `409 duplicate_route`, and an **enabled** route may not capture the
        same normalized path and any of the same methods as another enabled
        route (two disabled routes are free to collide — they capture nothing).
        Past `routes.max_routes` the answer is `409 too_many_routes`; nothing is
        ever evicted, because an evicted route would start rejecting real
        webhooks.

        The id `test` is **not** reserved: only the `POST /admin/routes/test`
        *dry run* shadows this path, and it shadows it for `POST` alone. `POST
        /admin/routes` with `{"id": "test"}` creates that route like any other
        id, and `GET`/`PUT`/`PATCH`/`DELETE /admin/routes/test` then address it
        normally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteInput'
            example:
              id: stripe
              path: /webhooks/stripe
              methods: [POST]
              ip_rules: [{action: allow, cidr: '203.0.113.0/24'}]
              metadata: {owner: payments}
      responses:
        '201':
          description: The stored route, timestamps included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
              examples:
                created:
                  value:
                    id: stripe
                    path: /webhooks/stripe
                    methods: [POST]
                    enabled: true
                    ip_rules: [{action: allow, cidr: '203.0.113.0/24'}]
                    metadata: {owner: payments}
                    inserted_at: '2026-09-28T14:16:26Z'
                    updated_at: '2026-09-28T14:16:26Z'
        '400':
          $ref: '#/components/responses/InvalidRoute'
        '409':
          $ref: '#/components/responses/DuplicateRoute'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /admin/routes/{id}:
    servers:
      - url: http://localhost:4003
        description: Route-management listener (default `routes.admin.port`).
    parameters:
      - name: id
        in: path
        required: true
        description: The route's id (a lowercase slug).
        schema:
          type: string
        example: stripe
    get:
      operationId: getRoute
      tags: [routes]
      summary: Fetch one route definition
      responses:
        '200':
          description: The route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
              examples:
                stripe:
                  value:
                    id: stripe
                    path: /webhooks/stripe
                    methods: [POST]
                    enabled: true
                    ip_rules: [{action: allow, cidr: '203.0.113.0/24'}]
                    metadata: {owner: payments}
                    inserted_at: '2026-09-28T14:16:26Z'
                    updated_at: '2026-09-28T14:16:26Z'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceRoute
      tags: [routes]
      summary: Replace a route definition
      description: |
        A full definition, `PUT`-idempotent: the `id` comes from the path (a body
        `id` is ignored), `inserted_at` is preserved, and `updated_at` moves. A
        `PUT` for an id that does not exist yet *creates* it, so the cap applies
        to that case too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteInput'
            example:
              path: /webhooks/stripe
              methods: [POST]
              enabled: false
              ip_rules: []
              metadata: {owner: payments, staging: true}
      responses:
        '200':
          description: The stored route, with the `inserted_at` it already had.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
              examples:
                replaced:
                  value:
                    id: stripe
                    path: /webhooks/stripe
                    methods: [POST]
                    enabled: false
                    ip_rules: []
                    metadata: {owner: payments, staging: true}
                    inserted_at: '2026-09-28T14:16:26Z'
                    updated_at: '2026-09-28T14:16:31Z'
        '400':
          $ref: '#/components/responses/InvalidRoute'
        '409':
          $ref: '#/components/responses/DuplicateRoute'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
    patch:
      operationId: updateRoute
      tags: [routes]
      summary: Patch a route definition
      description: |
        Only `enabled`, `methods`, `ip_rules`, and `metadata` are patchable.
        `path` and `id` are **immutable** here — moving a route changes which
        requests it captures, which is a `PUT` (a full, reviewable definition),
        not a patch — and answer `400 invalid_route` with
        `message: "immutable; use PUT"`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutePatch'
            example: {enabled: true}
      responses:
        '200':
          description: The patched route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
              examples:
                reenabled:
                  value:
                    id: stripe
                    path: /webhooks/stripe
                    methods: [POST]
                    enabled: true
                    ip_rules: []
                    metadata: {owner: payments, staging: true}
                    inserted_at: '2026-09-28T14:16:26Z'
                    updated_at: '2026-09-28T14:16:33Z'
        '400':
          $ref: '#/components/responses/InvalidRoute'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateRoute'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
    delete:
      operationId: deleteRoute
      tags: [routes]
      summary: Delete a route definition
      description: |
        Immediate: the guard stops capturing the route on the next request, with
        no cache TTL to wait out — the decision cache is keyed by the published
        snapshot's epoch, so a mutation makes every cached decision unreachable.
        Whether a restart brings the route back is the store's question: the
        default ETS store re-seeds from `routes.seed` on **every** boot, so a
        deleted route that is also in the seed returns — remove it from the seed
        as well — while the Redis store seeds once per namespace and keeps the
        deletion.
      responses:
        '204':
          description: Deleted. No body.
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /admin/ip-rules:
    servers:
      - url: http://localhost:4003
        description: Route-management listener (default `routes.admin.port`).
    get:
      operationId: getIpRules
      tags: [routes]
      summary: The global IP rules
      responses:
        '200':
          description: The ordered global rules, and the `default` when none match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpRules'
              examples:
                empty:
                  summary: 'The default: allow everything, no rules'
                  value: {default: allow, rules: []}
                pinned:
                  summary: Deny by default, with one allowed range
                  value:
                    default: deny
                    rules: [{action: allow, cidr: '203.0.113.0/24'}]
    put:
      operationId: putIpRules
      tags: [routes]
      summary: Replace the global IP rules
      description: |
        Ordered, first match wins, and `default` decides the case no rule
        matched. Both `default` and `rules` are required — omitting either is a
        `400`, not a silent default. These are a **floor**: a global `deny`
        always wins, including over a route's own `allow`. CIDRs are parsed at
        write time, so a typo is a `400` here rather than a
        silently-never-matching rule on the hot path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpRules'
            example:
              default: deny
              rules: [{action: allow, cidr: '203.0.113.0/24'}]
      responses:
        '200':
          description: The stored rules, as parsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpRules'
              examples:
                pinned:
                  value:
                    default: deny
                    rules: [{action: allow, cidr: '203.0.113.0/24'}]
        '400':
          $ref: '#/components/responses/InvalidIpRules'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
components:
  schemas:
    Health:
      type: object
      required: [status, instance, roles]
      properties:
        status:
          const: ok
        instance:
          type: string
        roles:
          type: array
          description: The roles this node runs, sorted.
          items:
            type: string
            enum: [claim_check, dispatch, edge, storage]
    Wal:
      type: object
      required: [instance, wal]
      properties:
        instance:
          type: string
        wal:
          type: object
          description: |
            Adapter-defined WAL stats (`next_seq`, `min_seq`, `max_seq`,
            `cursors` for the disk log), `{}` when the WAL is unreachable.
    DlqEntry:
      type: object
      description: A dead-lettered hook. The recorded reason is `inspect/1` of a term.
      required:
        - id
        - source_id
        - tenant_id
        - seq
        - received_at
        - dead_lettered_at
        - size
        - content_type
        - reason
      properties:
        id:
          type: string
          description: Envelope id (a UUIDv7).
        source_id:
          type: string
        tenant_id:
          type: [string, 'null']
        seq:
          type: [integer, 'null']
          description: WAL sequence number, `null` if the record never committed.
        received_at:
          type: integer
          description: When the edge received the hook, unix milliseconds.
        dead_lettered_at:
          type: integer
          description: When dispatch gave up, unix milliseconds.
        size:
          type: integer
        content_type:
          type: [string, 'null']
        reason:
          type: string
          description: '`inspect/1` of the give-up reason, e.g. `{:sink, Ankusa.Sink.Http, {:status, 503}}`.'
    DlqPage:
      type: object
      required: [total, entries]
      properties:
        total:
          type: integer
          description: Number of matching entries, before `limit`.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DlqEntry'
    QuarantineEntry:
      type: object
      required: [id, source_id, received_at, reason]
      properties:
        id:
          type: string
        source_id:
          type: string
        received_at:
          type: integer
          description: When the edge received the hook, unix milliseconds.
        reason:
          type: string
          description: '`inspect/1` of the verifier failure, e.g. `:no_match`.'
    QuarantinePage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/QuarantineEntry'
    ReplayFilter:
      type: object
      properties:
        source_id:
          type: string
          description: Exact source id.
        id:
          type: string
          description: Exact envelope id.
        since:
          type: integer
          description: Inclusive lower bound on the dead-letter timestamp, unix milliseconds.
    Replayed:
      type: object
      required: [replayed]
      properties:
        replayed:
          type: integer
          description: Number of entries re-delivered.
    RateLimit:
      type: object
      description: |
        A rate limit. `rate` is hooks per second and may be fractional (`0.5`
        is one every two seconds); `burst` is the most hooks admitted back to
        back.
      required: [rate, burst]
      additionalProperties: false
      properties:
        rate:
          type: number
          exclusiveMinimum: 0
          example: 50
        burst:
          type: integer
          minimum: 1
          example: 100
    TenantRateLimit:
      type: object
      description: One tenant's limit, and whether it came from config or an override.
      required: [tenant, rate, burst, source]
      properties:
        tenant:
          type: string
        rate:
          type: [number, 'null']
          description: `null` when `source` is `none`.
        burst:
          type: [integer, 'null']
          description: `null` when `source` is `none`.
        source:
          type: string
          enum: [override, config, default, none]
          description: |
            `override`: this node's runtime override. `config`:
            `rate_limits.tenants`. `default`: `rate_limits.default`. `none`: no
            limit applies, so the tenant is unlimited.
    RateLimits:
      type: object
      required: [default, tenants]
      properties:
        default:
          oneOf:
            - $ref: '#/components/schemas/RateLimit'
            - type: 'null'
          description: |
            The configured `rate_limits.default`, or `null` when the config sets
            none. It is never an override: overrides are per tenant.
        tenants:
          type: array
          description: Sorted by tenant id.
          items:
            $ref: '#/components/schemas/TenantRateLimit'
    RoutesHealth:
      type: object
      description: |
        `GET /health` on the `routes.admin.port` listener: how many route
        definitions this node is enforcing.
      required: [status, routes]
      properties:
        status:
          const: ok
        routes:
          type: integer
          description: The number of route definitions in the table, enabled or not.
          example: 1
    IpRule:
      type: object
      description: One rule. `cidr` is parsed at write time, so an unparseable one is a `400`.
      required: [action, cidr]
      properties:
        action:
          type: string
          enum: [allow, deny]
        cidr:
          type: string
          description: |
            An IPv4 or IPv6 network. A bare address is a full-length prefix
            (`10.1.2.3` is `/32`). Families never cross: `0.0.0.0/0` matches only
            IPv4, `::/0` only IPv6, and an IPv4-mapped client (`::ffff:10.1.2.3`)
            is normalized to IPv4 before matching.
          example: '203.0.113.0/24'
    IpRules:
      type: object
      description: |
        The global IP rules: a floor every route inherits. A route's own
        `ip_rules` replace this list *for that route*, but a global `deny` has
        already won by then.
      required: [default, rules]
      properties:
        default:
          type: string
          description: Applied when no rule in `rules` matched.
          enum: [allow, deny]
        rules:
          type: array
          description: Ordered; the first match wins.
          items:
            $ref: '#/components/schemas/IpRule'
    Route:
      type: object
      description: |
        A route definition: the capture gate. It decides whether a request is
        captured, not which source it belongs to.
      required: [id, path, methods, enabled, ip_rules, metadata, inserted_at, updated_at]
      properties:
        id:
          type: string
          description: |
            A lowercase slug, `^[a-z0-9](?:[a-z0-9_-]{0,62}[a-z0-9])?$`, supplied
            by the client or generated (a lowercase ULID). Immutable after
            creation.
          example: stripe
        path:
          type: string
          description: |
            A pattern, not a regex: `/`-separated segments, each a literal, a
            `:param` (exactly one segment), or a trailing `*` wildcard (one or
            more segments — `/hooks/shopify/*` does not match `/hooks/shopify`).
            Requests are normalized before matching, and a percent-encoded slash
            (`%2F`) or a `.`/`..` segment is a rejection, not a boundary.
          example: /webhooks/stripe
        methods:
          type: array
          description: The methods this route captures. Defaults to `[POST]`.
          items:
            type: string
            pattern: '^[A-Z]+$'
          example: [POST]
        enabled:
          type: boolean
          description: |
            A disabled route captures nothing — and is exempt from the duplicate
            check, so a staged definition may sit next to a live one.
        ip_rules:
          type: array
          description: |
            Empty (the default) means the global list applies. Non-empty
            **replaces** it for this route, and a client matching none of them is
            denied: the point of pinning a provider's ranges is that anything
            else is refused.
          items:
            $ref: '#/components/schemas/IpRule'
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON for the operator — an owner, a sender name.
          example: {owner: payments}
        inserted_at:
          type: string
          format: date-time
          description: Set once, at creation. A `PUT` keeps it; a `PATCH` cannot touch it.
          example: '2026-09-28T14:16:26Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-28T14:16:26Z'
    RouteInput:
      type: object
      description: |
        A route definition as written. Unknown keys are a `400 invalid_route`
        (`"unknown field"`), as are `inserted_at`/`updated_at`: an update cannot
        forge its own history.
      required: [path]
      properties:
        id:
          type: string
          description: Optional on create. On `PUT` the path's `id` wins.
        path:
          type: string
          example: /webhooks/stripe
        methods:
          type: array
          items:
            type: string
            pattern: '^[A-Z]+$'
          default: [POST]
        enabled:
          type: boolean
          default: true
        ip_rules:
          type: array
          items:
            $ref: '#/components/schemas/IpRule'
          default: []
        metadata:
          type: object
          additionalProperties: true
          default: {}
    RoutePatch:
      type: object
      description: |
        Only these four fields are patchable. `path` and `id` answer
        `400 invalid_route` with `message: "immutable; use PUT"`.
      properties:
        enabled:
          type: boolean
        methods:
          type: array
          items:
            type: string
            pattern: '^[A-Z]+$'
        ip_rules:
          type: array
          items:
            $ref: '#/components/schemas/IpRule'
        metadata:
          type: object
          additionalProperties: true
    RoutePage:
      type: object
      required: [routes, next_cursor]
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        next_cursor:
          type: [string, 'null']
          description: |
            The last id of this page when another page exists — pass it back as
            `cursor`. `null` on the last page.
          example: null
    DryRunRequest:
      type: object
      required: [method, path, ip]
      properties:
        method:
          type: string
          example: POST
        path:
          type: string
          description: The request path as the client would send it, normalization included.
          example: /webhooks/stripe
        ip:
          type: string
          description: The client address. `X-Forwarded-For` resolution is the guard's job, not the dry run's.
          example: 203.0.113.7
    DryRunIpRule:
      type: object
      description: The rule that produced an IP decision, and the list it came from.
      required: [action, cidr, scope]
      properties:
        action:
          type: string
          enum: [allow, deny]
        cidr:
          type: string
          example: '203.0.113.0/24'
        scope:
          type: string
          enum: [global, route]
          description: |
            `global` for `routes.ip_rules`, `route` for the matched route's own
            list.
    DryRunResult:
      type: object
      required: [decision, reason, route_id, ip_rule]
      properties:
        decision:
          type: string
          enum: [allow, deny]
        reason:
          type: string
          enum: [matched, no_route, method, ip_denied]
          description: |
            `matched` is the only `allow`. `no_route` and `method` are both a
            `404` to the sender, so a probe cannot learn which paths exist;
            `ip_denied` is a `403` (or a `404` with
            `routes.ip_denied_status: 404`).
        route_id:
          type: [string, 'null']
          description: The matched route, when one matched — including when its own rules then denied the address.
          example: stripe
        ip_rule:
          oneOf:
            - $ref: '#/components/schemas/DryRunIpRule'
            - type: 'null'
          description: |
            The rule that decided the IP question — the global list's or the
            matched route's own — or `null` when no rule decided: a list's
            `default` applied because nothing matched, or the reason is not an
            IP decision (`no_route`, `method`). A route's own `allow` rule
            deciding a `matched` decision is reported here too.
    Error:
      type: object
      description: The error shape every endpoint answers with, on every listener.
      required: [error]
      properties:
        error:
          type: string
          enum:
            - not_found
            - invalid_filter
            - role_not_enabled
            - invalid_route
            - duplicate_route
            - too_many_routes
            - invalid_query
            - invalid_ip_rules
            - invalid_request
            - invalid_body
            - invalid_tenant
            - invalid_rate_limit
            - rate_limit_not_found
            - store_unavailable
            - wal_disabled
        field:
          type: string
          description: |
            The offending field: on `invalid_filter` the parameter or `body`; on
            the route errors the route field (`path`, `ip_rules`, …), the
            parameter (`enabled`, `limit`), or the dry-run field.
        message:
          type: string
          description: Human-readable reason, on the `invalid_*` codes that carry one.
        role:
          type: string
          description: Present on `role_not_enabled`; the role this node does not run.
        conflicting_id:
          type: string
          description: Present on `duplicate_route`; the route already holding that path and method.
        max_routes:
          type: integer
          description: Present on `too_many_routes`; the configured cap.
  responses:
    InvalidFilter:
      description: '`400`. `invalid_filter`: a non-integer `since` or `limit`, a non-string `source_id` or `id`, or a replay body that is not a JSON object or is over 64 KiB. `field` names the offending parameter, or `body`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidTenant:
      description: '`400`. `invalid_tenant`: the tenant is not a valid identity — it must match `[A-Za-z0-9_-]{1,64}`, because it is a URL path segment and a storage partition.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badTenant:
              value: {error: invalid_tenant}
    InvalidRateLimit:
      description: '`400`. `invalid_rate_limit`: the body is not a JSON object, or not a limit — `rate` and `burst` are both required, `rate` is a number greater than 0, `burst` an integer of at least 1, and unknown fields are refused. `message` says which.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            zeroRate:
              value: {error: invalid_rate_limit, message: 'rate must be a number greater than 0, got 0'}
            missingBurst:
              value: {error: invalid_rate_limit, message: 'burst is required'}
            unknownField:
              value: {error: invalid_rate_limit, message: 'unknown field "per"'}
            notJson:
              value: {error: invalid_rate_limit, message: 'body must be a JSON object'}
    RoleNotEnabled:
      description: '`409`. `role_not_enabled`: this node does not run the role the route needs. Ask another node.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WalDisabled:
      description: '`409`. `wal_disabled`: this node runs `wal.type: none` and has no log to report.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: wal_disabled}
    InvalidRoute:
      description: '`400`. `invalid_route`: a route definition that would not mean what it says — a path that is not rooted or has an illegal segment, a non-boolean `enabled`, a bad CIDR, unknown fields, or `path`/`id` in a `PATCH`. `field` names it and `message` says why. Also `invalid_body` when the body never parsed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unknownField:
              summary: '`inserted_at` is not a route field'
              value: {error: invalid_route, field: inserted_at, message: 'unknown field'}
            badId:
              value: {error: invalid_route, field: id, message: 'must be a lowercase slug of at most 64 characters'}
            unrootedPath:
              value: {error: invalid_route, field: path, message: 'must start with "/"'}
            badSegment:
              value: {error: invalid_route, field: path, message: 'invalid segment "*"'}
            immutablePath:
              value: {error: invalid_route, field: path, message: 'immutable; use PUT'}
            notJson:
              summary: '`invalid_body` instead, when the body never parsed'
              value: {error: invalid_body}
    InvalidQuery:
      description: '`400`. `invalid_query`: a `limit` that is not an integer, or an `enabled` that is neither `true` nor `false`. `field` names it.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badLimit:
              value: {error: invalid_query, field: limit}
            badEnabled:
              value: {error: invalid_query, field: enabled}
    InvalidRequest:
      description: '`400`. `invalid_request`: the dry run''s `method`, `path`, or `ip` is missing or unusable. `field` names it. Also `invalid_body` when the request body never parsed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badIp:
              value: {error: invalid_request, field: ip, message: 'must be an IPv4 or IPv6 address'}
            unmatchablePath:
              value: {error: invalid_request, field: path, message: 'is not a matchable request path'}
            missingMethod:
              value: {error: invalid_request, field: method, message: 'is required and must be a string'}
            notJson:
              summary: '`invalid_body` instead, when the body never parsed'
              value: {error: invalid_body}
    InvalidIpRules:
      description: '`400`. `invalid_ip_rules`: both `default` and `rules` are required, `default` is `allow` or `deny`, `rules` is a list, and every rule is an object with an `action` of `allow`/`deny` and a `cidr` that parses. A range inside `::ffff:0:0/96` parses but is refused, because client addresses are matched as IPv4 and such a range could never match; write the equivalent IPv4 CIDR. `field` is `default` or `rules`; a bad rule''s `message` names its index (`rule 0: ...`). A body that is not a JSON object is `invalid_body`, not this.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingDefault:
              summary: '`default` is required'
              value: {error: invalid_ip_rules, field: default, message: is required}
            missingRules:
              summary: '`rules` is required'
              value: {error: invalid_ip_rules, field: rules, message: is required}
            rulesNotAList:
              value: {error: invalid_ip_rules, field: rules, message: 'must be a list of rules'}
            unknownRuleField:
              value: {error: invalid_ip_rules, field: rules, message: 'rule 0: unknown field "cidrs"'}
            badAction:
              value: {error: invalid_ip_rules, field: rules, message: 'rule 0: invalid action "maybe"'}
            badCidr:
              value: {error: invalid_ip_rules, field: rules, message: 'rule 0: invalid cidr "10.0.0.0/33"'}
            mappedRange:
              summary: 'a range inside `::ffff:0:0/96`: it parses, but it could never match'
              value: {error: invalid_ip_rules, field: rules, message: 'rule 0: invalid cidr "::ffff:10.0.0.0/104": it is inside ::ffff:0:0/96, and client addresses are matched as IPv4, so it can never match; write the equivalent IPv4 CIDR instead'}
            badDefault:
              value: {error: invalid_ip_rules, field: default, message: 'must be "allow" or "deny", got "maybe"'}
            notJson:
              summary: '`invalid_body` instead, when the body never parsed'
              value: {error: invalid_body}
    DuplicateRoute:
      description: '`409`. `duplicate_route`: an enabled route already captures this path and one of these methods, or a `POST` names an id that is taken. `conflicting_id` is the route holding it. Also `too_many_routes`: the store is at `routes.max_routes`, and nothing is evicted to make room — delete a route instead.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            takenId:
              value: {error: duplicate_route, conflicting_id: stripe}
            samePathAndMethod:
              value: {error: duplicate_route, conflicting_id: checkout}
            atCap:
              summary: '`too_many_routes` instead, when the cap is reached'
              value: {error: too_many_routes, max_routes: 10000}
    NotFound:
      description: '`404`. `not_found`: no such route, or no such path on this listener. A method the path does not serve is also a `404`, deliberately — a probe cannot tell a missing path from a wrong method.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            noSuchRoute:
              value: {error: not_found}
    RateLimitNotFound:
      description: '`404`. `rate_limit_not_found`: this node holds no runtime override for that tenant. The config may still give it a limit — `GET` reports that as `source: config` or `default`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            noOverride:
              value: {error: rate_limit_not_found}
    StoreUnavailable:
      description: '`503`. `store_unavailable`: nothing was written. Either the route store could not be reached (a Redis store with Redis down), or the write kept losing to concurrent writers and exhausted its retries — the table changed under the snapshot it had validated, every time. Both are transient: retry, and reads keep working from this node''s in-memory snapshot either way.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            redisDown:
              value: {error: store_unavailable}
    RateLimitStoreUnavailable:
      description: '`503`. `store_unavailable`: `rate_limits.json` could not be written on this node, so the override was not applied — this node''s limits are unchanged. Transient: retry.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unwritableDataDir:
              value: {error: store_unavailable}
