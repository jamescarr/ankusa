    patch:
      operationId: updateTenantRoute
      tags: [routes]
      summary: Patch one of the tenant's route definitions
      description: |
        Only `enabled`, `methods`, `ip_rules`, and `metadata` are patchable;
        `id`, `path`, `tenant_id` and `source_id` are **immutable** here and
        answer `400 invalid_route` with `message: "immutable; use PUT"`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutePatch'
            example: {enabled: true}
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The patched route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
              examples:
                reenabled:
                  value:
                    id: stripe
                    tenant_id: acme
                    source_id: acme.stripe
                    path: /webhooks/acme/stripe
                    methods: [POST]
                    enabled: true
                    ip_rules: []
                    metadata: {owner: payments, staging: true}
                    revision: 3
                    inserted_at: '2026-09-28T14:17:02Z'
                    updated_at: '2026-09-28T14:17:12Z'
        '400':
          $ref: '#/components/responses/InvalidRoute'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateRoute'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
    delete:
      operationId: deleteTenantRoute
      tags: [routes]
      summary: Delete one of the tenant's route definitions
      description: |
        Immediate, like `DELETE /admin/routes/{id}`. A route another tenant owns
        is a `404`, and the store checks the owner in the delete itself, so a
        route re-created under another tenant a moment ago is never removed.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Deleted. No body.
        '400':
          $ref: '#/components/responses/InvalidTenant'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /admin/ip-rules:
    servers:
      - url: http://localhost:4003
        description: Route-management listener (default `routes.admin.port`).
    get:
      operationId: getIpRules
      tags: [routes]
      summary: The global IP rules
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The ordered global rules, and the `default` when none match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpRules'
              examples:
                empty:
                  summary: 'The default: allow everything, no rules'
                  value: {default: allow, rules: []}
                pinned:
                  summary: Deny by default, with one allowed range
                  value:
                    default: deny
                    rules: [{action: allow, cidr: '203.0.113.0/24'}]
    put:
      operationId: putIpRules
      tags: [routes]
      summary: Replace the global IP rules
      description: |
        Ordered, first match wins, and `default` decides the case no rule
        matched. Both `default` and `rules` are required — omitting either is a
        `400`, not a silent default. These are a **floor**: a global `deny`
        always wins, including over a route's own `allow`. CIDRs are parsed at
        write time, so a typo is a `400` here rather than a
        silently-never-matching rule on the hot path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpRules'
            example:
              default: deny
              rules: [{action: allow, cidr: '203.0.113.0/24'}]
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The stored rules, as parsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpRules'
              examples:
                pinned:
                  value:
                    default: deny
                    rules: [{action: allow, cidr: '203.0.113.0/24'}]
        '400':
          $ref: '#/components/responses/InvalidIpRules'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <token>`: an OIDC/OAuth2 access token (`mode: jwt`)
        or a static token (`mode: token`).
    mutualTLS:
      type: mutualTLS
      description: |
        A client certificate presented to a listener with `tls.verify:
        verify_peer` (`mode: mtls`), mapped to scopes by `auth.mtls.subject_map`.
  schemas:
    Health:
      type: object
      required: [status, instance, roles]
      properties:
        status:
          const: ok
        instance:
          type: string
        roles:
          type: array
          description: The roles this node runs, sorted.
          items:
            type: string
            enum: [claim_check, dispatch, edge, storage]
    CheckState:
      type: string
      enum: [ok, failing, draining]
    Readiness:
      type: object
      description: |
        One key per readiness check that applies to the node (see `GET /ready`);
        a check that does not apply has no key.
      required: [status, instance]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        instance:
          type: string
        store:
          $ref: '#/components/schemas/CheckState'
          description: Present on a node that runs the local store.
        intake:
          $ref: '#/components/schemas/CheckState'
          description: 'Present with `wal.type: dual`.'
        sinks:
          $ref: '#/components/schemas/CheckState'
          description: 'Present with `wal.type: none`.'
        disk:
          $ref: '#/components/schemas/CheckState'
          description: Present with `node.min_free_bytes`.
        backlog:
          $ref: '#/components/schemas/CheckState'
          description: |
            Present with `queue.max_oldest_due_ms`. A label: never makes the
            node unready.
        backup:
          $ref: '#/components/schemas/CheckState'
          description: |
            Present with `backup.enabled` and `backup.max_age_ms`: `failing`
            when the last successful backup is older than `max_age_ms` (or the
            uploader is not running). `503` only with `backup.require_fresh`.
        reasons:
          type: object
          description: Present while a check is not `ok`, why, per check.
          properties:
            store:
              type: string
              enum: [no_space, io_error, read_only, corruption, busy, timeout, not_running, other, error]
            intake:
              type: string
              enum: [down, recovering, error]
            sinks:
              type: string
              enum: [publish_failed, error]
            disk:
              type: string
              enum: [below_floor, unmeasured, error]
            backlog:
              type: string
              enum: [over_threshold, unavailable, error]
            backup:
              type: string
              enum: [stale, error]
    Wal:
      type: object
      required: [instance, wal]
      properties:
        instance:
          type: string
        wal:
          type: object
          description: |
            This node's store: `next_seq` (exact), `hooks` and `deliveries`
            (RocksDB key estimates), `disk_bytes`; `{}` when the store is
            unreachable.
    DlqEntry:
      type: object
      description: A dead-lettered hook. The recorded reason is `inspect/1` of a term.
      required:
        - id
        - source_id
        - tenant_id
        - seq
        - received_at
        - dead_lettered_at
        - size
        - content_type
        - reason
      properties:
        id:
          type: string
          description: Envelope id (a UUIDv7).
        source_id:
          type: string
        tenant_id:
          type: [string, 'null']
        seq:
          type: [integer, 'null']
          description: Queue sequence number of the committed hook, `null` if it never committed.
        received_at:
          type: integer
          description: When the edge received the hook, unix milliseconds.
        dead_lettered_at:
          type: integer
          description: When dispatch gave up, unix milliseconds.
        size:
          type: integer
        content_type:
          type: [string, 'null']
        reason:
          type: string
          description: '`inspect/1` of the give-up reason, e.g. `{:sink, Ankusa.Sink.Http, {:status, 503}}`.'
    DlqPage:
      type: object
      required: [total, entries]
      properties:
        total:
          type: integer
          description: Number of matching entries, before `limit`.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DlqEntry'
    QuarantineEntry:
      type: object
      required: [id, source_id, received_at, reason]
      properties:
        id:
          type: string
        source_id:
          type: string
        tenant_id:
          type: [string, 'null']
          description: The hook's tenant (`default` unless the source or a tenant route set one); `null` only for entries held before the pen recorded it.
        received_at:
          type: integer
          description: When the edge received the hook, unix milliseconds.
        reason:
          type: string
          description: '`inspect/1` of the verifier failure, e.g. `:no_match`.'
        size:
          type: [integer, 'null']
          description: Bytes the entry holds against `quarantine.max_bytes`; `null` for entries held before the pen recorded it.
    QuarantinePage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/QuarantineEntry'
    QuarantinePurge:
      type: object
      required: [deleted, bytes]
      properties:
        deleted:
          type: integer
          description: Entries deleted.
        bytes:
          type: integer
          description: The bytes they held against `quarantine.max_bytes`.
    AuditPage:
      type: object
      required: [entries, next_cursor]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page; `null` on the last.
    AuditEntry:
      type: object
      required: [seq, at, actor, remote_ip, action, tenant, resource, before_hash, after_hash, request_id, result, revision, detail]
      properties:
        seq:
          type: integer
          description: The row's place in commit order. Strictly increasing; the key of the row.
        at:
          type: string
          format: date-time
        actor:
          type: string
          description: The principal id (`Ankusa.Principal`); `system` for a change made from code.
        remote_ip:
          type: [string, 'null']
          description: The client address, behind `routes.trusted_proxies` the one `X-Forwarded-For` names.
        action:
          type: string
          description: |
            `source.create|update|delete`, `rate_limit.put|delete`,
            `quarantine.purge`, `replay.create|update|cancel`,
            `route.create|update|delete`, `ip_rules.put`.
        tenant:
          type: [string, 'null']
        resource:
          type: [string, 'null']
          description: The subject's id (`<tenant>.<name>` for a source, the route id, the replay job id).
        before_hash:
          type: [string, 'null']
          description: HMAC-SHA256 (hex) of the subject before the change; `null` when there was none.
        after_hash:
          type: [string, 'null']
          description: HMAC-SHA256 (hex) of the subject after the change; `null` for a delete.
        request_id:
          type: [string, 'null']
          description: The request's `X-Request-Id`, or the id the node made up (answered in the same response header).
        result:
          type: string
          enum: [ok, failed, interrupted]
          description: |
            `ok`: the change was made. `failed`: the store refused it. `interrupted`:
            the node died between writing the row and finishing it (a change in
            the route store or the Redis source store): the change may or may not
            have been applied, and `after_hash` is the hash of what was about to
            be written.
        revision:
          type: [integer, 'null']
          description: The subject's revision after the change, for a subject that has one (sources in the node's store, routes).
        detail:
          type: [object, 'null']
          additionalProperties: true
          description: "Non-secret particulars: a purge's filter and count, a replay's kind, a rate limit's numbers."
    ReplaySpec:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [dlq, archive, quarantine]
          description: |
            `dlq` re-sends dead rows; `archive` re-sends archived hooks over a
            time window; `quarantine` re-verifies hooks held in the quarantine
            pen and commits the ones that now pass.
        source_id:
          type: string
          description: Exact source id to filter on.
        id:
          type: string
          description: Exact envelope id to filter on (`dlq` and `quarantine` only).
        since:
          type: integer
          description: |
            Inclusive lower bound, unix milliseconds: on the dead-letter
            timestamp (`dlq`) or on `received_at` (`quarantine`).
        until:
          type: integer
          description: |
            Inclusive upper bound, unix milliseconds, on the same timestamp as
            `since` (`dlq` and `quarantine` only). Must not be less than `since`.
        from:
          type: integer
          minimum: 0
          description: Inclusive lower bound on `received_at`, unix milliseconds (`archive` only).
        to:
          type: integer
          description: |
            Inclusive upper bound on `received_at`, unix milliseconds
            (`archive` only). Must be greater than `from`, and old enough that
            the compactor has archived the whole window (`storage.roll_ms +
            storage.interval_ms` in the past).
        sinks:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: integer
            minimum: 0
          description: Indexes into the source's current sinks; omitted means every current sink (`archive` only).
        rate:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1000
          description: Items per second — delivery rows for `dlq`, hooks for `archive` and `quarantine`.
        max_lag_ms:
          type: integer
          minimum: 100
          maximum: 600000
          default: 2000
          description: The oldest-due lag at which the job throttles, in milliseconds.
    ReplayPatch:
      type: object
      properties:
        state:
          type: string
          enum: [running, paused, cancelled]
        rate:
          type: integer
          minimum: 1
          maximum: 100000
        max_lag_ms:
          type: integer
          minimum: 100
          maximum: 600000
    Replay:
      type: object
      description: |
        A replay job. Counters are best-effort: `moved`/`scanned`/`skipped` are
        committed with the job's cursor, `delivered`/`dead` come from the
        pipeline's outcome reports and are approximate across a crash.
      required:
        [id, kind, state, filter, rate, max_lag_ms, created_at, updated_at, finished_at,
         moved, scanned, skipped, delivered, dead, error]
      properties:
        id:
          type: string
          description: UUIDv7 job id; also the `replay_id` on every replayed delivery.
        kind:
          type: string
          enum: [dlq, archive, quarantine]
        state:
          type: string
          enum: [running, paused, done, cancelled, failed]
        filter:
          type: object
          description: Exactly the filter keys given at creation.
        rate:
          type: integer
          description: Items per second.
        max_lag_ms:
          type: integer
          description: Throttle threshold, milliseconds.
        created_at:
          type: integer
          description: Unix milliseconds.
        updated_at:
          type: integer
          description: Unix milliseconds.
        finished_at:
          type: [integer, 'null']
          description: Unix milliseconds, `null` until the job finishes.
        moved:
          type: integer
          description: Rows revived (`dlq`), hooks re-enqueued (`archive`), or held hooks committed after passing verification again (`quarantine`).
        scanned:
          type: integer
          description: Keys or records examined.
        skipped:
          type: integer
          description: |
            Archive records with no source, no bound sink, or an undecodable
            frame (`archive`); held hooks that still fail verification, whose
            source is gone, or that were a duplicate of a hook already
            accepted (`quarantine` — the duplicates leave the pen, the rest
            stay in it).
        delivered:
          type: integer
          description: Deliveries this job's rows got through, per pipeline outcome reports.
        dead:
          type: integer
          description: Deliveries this job's rows dead-lettered again, per pipeline outcome reports.
        error:
          type: [string, 'null']
          description: '`null`, or why the job paused itself or failed.'
    ReplayList:
      type: object
      required: [replays]
      properties:
        replays:
          type: array
          items:
            $ref: '#/components/schemas/Replay'
    RateLimit:
      type: object
      description: |
        A tenant's ingest limit. `rate` is hooks per second and may be
        fractional (`0.5` is one every two seconds); `burst` is the most hooks
        admitted back to back. The rest are optional: `bytes_per_second` and
        `burst_bytes` limit body bytes (charged with the hook, after
        verification; `burst_bytes` defaults to one second's worth and needs
        `bytes_per_second`), `max_body_bytes` is the biggest body the tenant may
        send (`413` past it; at most the instance's `max_body_bytes`), and
        `max_queue` / `max_queue_bytes` are the hooks and body bytes the tenant
        may hold in this node's batchers at once (`429 tenant_overload` past
        either). A limit replaces the one below it whole: keys left out are
        unset, not inherited.
      required: [rate, burst]
      additionalProperties: false
      properties:
        rate:
          type: number
          exclusiveMinimum: 0
          example: 50
        burst:
          type: integer
          minimum: 1
          example: 100
        bytes_per_second:
          type: number
          exclusiveMinimum: 0
          example: 5000000
        burst_bytes:
          type: integer
          minimum: 1
          example: 10000000
        max_body_bytes:
          type: integer
          minimum: 1
          example: 1000000
        max_queue:
          type: integer
          minimum: 1
          example: 2000
        max_queue_bytes:
          type: integer
          minimum: 1
          example: 67108864
    TenantErase:
      type: object
      description: |
        One tenant's erase. `stage` and `started_at` (ISO 8601) appear while
        `state` is `erasing` and the status is read; `erased_at` once it is `erased`.
      required: [tenant, state]
      properties:
        tenant:
          type: string
        state:
          type: string
          enum: [erasing, erased]
        stage:
          type: string
          enum: [sources, routes, rate_limit, queue, archive, quarantine, claims, dedupe, entities, commit]
        started_at:
          type: string
          format: date-time
        erased_at:
          type: string
          format: date-time
    TenantRateLimit:
      type: object
      description: |
        One tenant's limit, and whether it came from config or an override. The
        optional keys of a `RateLimit` appear only when the limit sets them.
      required: [tenant, rate, burst, source]
      properties:
        tenant:
          type: string
        rate:
          type: [number, 'null']
          description: '`null` when `source` is `none`.'
        burst:
          type: [integer, 'null']
          description: '`null` when `source` is `none`.'
        bytes_per_second:
          type: number
          exclusiveMinimum: 0
        burst_bytes:
          type: integer
          minimum: 1
        max_body_bytes:
          type: integer
          minimum: 1
        max_queue:
          type: integer
          minimum: 1
        max_queue_bytes:
          type: integer
          minimum: 1
        source:
          type: string
          enum: [override, config, default, none]
          description: |
            `override`: this node's runtime override. `config`:
            `rate_limits.tenants`. `default`: `rate_limits.default`. `none`: no
            limit applies, so the tenant is unlimited.
    RateLimits:
      type: object
      required: [default, tenants]
      properties:
        default:
          oneOf:
            - $ref: '#/components/schemas/RateLimit'
            - type: 'null'
          description: |
            The configured `rate_limits.default`, or `null` when the config sets
            none. It is never an override: overrides are per tenant.
        tenants:
          type: array
          description: Sorted by tenant id.
          items:
            $ref: '#/components/schemas/TenantRateLimit'
    RoutesHealth:
      type: object
      description: |
        `GET /health` on the `routes.admin.port` listener: how many route
        definitions this node is enforcing.
      required: [status, routes]
      properties:
        status:
          const: ok
        routes:
          type: integer
          description: The number of route definitions in the table, enabled or not.
          example: 1
    IpRule:
      type: object
      description: One rule. `cidr` is parsed at write time, so an unparseable one is a `400`.
      required: [action, cidr]
      properties:
        action:
          type: string
          enum: [allow, deny]
        cidr:
          type: string
          description: |
            An IPv4 or IPv6 network. A bare address is a full-length prefix
            (`10.1.2.3` is `/32`). Families never cross: `0.0.0.0/0` matches only
            IPv4, `::/0` only IPv6, and an IPv4-mapped client (`::ffff:10.1.2.3`)
            is normalized to IPv4 before matching.
          example: '203.0.113.0/24'
    IpRules:
      type: object
      description: |
        The global IP rules: a floor every route inherits. A route's own
        `ip_rules` replace this list *for that route*, but a global `deny` has
        already won by then.
      required: [default, rules]
      properties:
        default:
          type: string
          description: Applied when no rule in `rules` matched.
          enum: [allow, deny]
        rules:
          type: array
          description: Ordered; the first match wins.
          items:
            $ref: '#/components/schemas/IpRule'
    Route:
      type: object
      description: |
        A route definition: the capture gate. It decides whether a request is
        captured and, with `tenant_id` and `source_id`, which tenant and source
        it may admit it into. A resolver result that disagrees with the binding
        is a `404` to the sender.
      required: [id, tenant_id, source_id, path, methods, enabled, ip_rules, metadata, revision, inserted_at, updated_at]
      properties:
        id:
          type: string
          description: |
            A lowercase slug, `^[a-z0-9](?:[a-z0-9_-]{0,62}[a-z0-9])?$`, supplied
            by the client or generated (a lowercase ULID). Immutable after
            creation.
          example: stripe
        tenant_id:
          type: string
          description: |
            The owning tenant, `[A-Za-z0-9_-]{1,64}`; `default` (the default) is
            the shared tenant and binds none. A route owned by a tenant admits
            hooks only into that tenant: a request whose resolver names another
            tenant, or whose source belongs to another, is a `404`. Where the
            resolver names no tenant and the source is shared, the hook is
            stored under this tenant.
          example: default
        source_id:
          type: [string, 'null']
          description: |
            The one source the route admits, or `null` to leave it to the
            resolver. A request the resolver maps to another source is a `404`.
          example: null
        path:
          type: string
          description: |
            A pattern, not a regex: `/`-separated segments, each a literal, a
            `:param` (exactly one segment), or a trailing `*` wildcard (one or
            more segments — `/hooks/shopify/*` does not match `/hooks/shopify`).
            Requests are normalized before matching, and a percent-encoded slash
            (`%2F`) or a `.`/`..` segment is a rejection, not a boundary.
          example: /webhooks/stripe
        methods:
          type: array
          description: The methods this route captures. Defaults to `[POST]`.
          items:
            type: string
            pattern: '^[A-Z]+$'
          example: [POST]
        enabled:
          type: boolean
          description: |
            A disabled route captures nothing — and is exempt from the duplicate
            check, so a staged definition may sit next to a live one.
        ip_rules:
          type: array
          description: |
            Empty (the default) means the global list applies. Non-empty
            **replaces** it for this route, and a client matching none of them is
            denied: the point of pinning a provider's ranges is that anything
            else is refused.
          items:
            $ref: '#/components/schemas/IpRule'
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSON for the operator — an owner, a sender name.
          example: {owner: payments}
        revision:
          type: integer
          minimum: 1
          description: Counts the definition's changes, from 1 at creation. Re-creating a deleted route starts again at 1.
          example: 1
        inserted_at:
          type: string
          format: date-time
          description: Set once, at creation. A `PUT` keeps it; a `PATCH` cannot touch it.
          example: '2026-09-28T14:16:26Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-28T14:16:26Z'
    RouteInput:
      type: object
      description: |
        A route definition as written. Unknown keys are a `400 invalid_route`
        (`"unknown field"`), as are `inserted_at`/`updated_at`: an update cannot
        forge its own history.
      required: [path]
      properties:
        id:
          type: string
          description: Optional on create. On `PUT` the path's `id` wins.
        tenant_id:
          type: string
          description: |
            Defaults to `default`. On the tenant surface the path's tenant is
            used, and a different one is `400 invalid_route`.
          default: default
        source_id:
          type: [string, 'null']
          description: Optional; at most 256 characters, without whitespace or `/`.
          default: null
        path:
          type: string
          example: /webhooks/stripe
        methods:
          type: array
          items:
            type: string
            pattern: '^[A-Z]+$'
          default: [POST]
        enabled:
          type: boolean
          default: true
        ip_rules:
          type: array
          items:
            $ref: '#/components/schemas/IpRule'
          default: []
        metadata:
          type: object
          additionalProperties: true
          default: {}
    RoutePatch:
      type: object
      description: |
        Only these four fields are patchable. `path`, `id`, `tenant_id` and
        `source_id` answer `400 invalid_route` with `message: "immutable; use PUT"`.
      properties:
        enabled:
          type: boolean
        methods:
          type: array
          items:
            type: string
            pattern: '^[A-Z]+$'
        ip_rules:
          type: array
          items:
            $ref: '#/components/schemas/IpRule'
        metadata:
          type: object
          additionalProperties: true
    RoutePage:
      type: object
      required: [routes, next_cursor]
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        next_cursor:
          type: [string, 'null']
          description: |
            The last id of this page when another page exists — pass it back as
            `cursor`. `null` on the last page.
          example: null
    DryRunRequest:
      type: object
      required: [method, path, ip]
      properties:
        method:
          type: string
          example: POST
        path:
          type: string
          description: The request path as the client would send it, normalization included.
          example: /webhooks/stripe
        ip:
          type: string
          description: The client address. `X-Forwarded-For` resolution is the guard's job, not the dry run's.
          example: 203.0.113.7
    DryRunIpRule:
      type: object
      description: The rule that produced an IP decision, and the list it came from.
      required: [action, cidr, scope]
      properties:
        action:
          type: string
          enum: [allow, deny]
        cidr:
          type: string
          example: '203.0.113.0/24'
        scope:
          type: string
          enum: [global, route]
          description: |
            `global` for `routes.ip_rules`, `route` for the matched route's own
            list.
    DryRunResult:
      type: object
      required: [decision, reason, route_id, ip_rule]
      properties:
        decision:
          type: string
          enum: [allow, deny]
        reason:
          type: string
          enum: [matched, no_route, method, ip_denied]
          description: |
            `matched` is the only `allow`. `no_route` and `method` are both a
            `404` to the sender, so a probe cannot learn which paths exist;
            `ip_denied` is a `403` (or a `404` with
            `routes.ip_denied_status: 404`).
        route_id:
          type: [string, 'null']
          description: The matched route, when one matched — including when its own rules then denied the address.
          example: stripe
        ip_rule:
          oneOf:
            - $ref: '#/components/schemas/DryRunIpRule'
            - type: 'null'
          description: |
            The rule that decided the IP question — the global list's or the
            matched route's own — or `null` when no rule decided: a list's
            `default` applied because nothing matched, or the reason is not an
            IP decision (`no_route`, `method`). A route's own `allow` rule
            deciding a `matched` decision is reported here too.
    Error:
      type: object
      description: The error shape every endpoint answers with, on every listener.
      required: [error]
      properties:
        error:
          type: string
          enum:
            - not_found
            - invalid_filter
            - role_not_enabled
            - invalid_route
            - duplicate_route
            - too_many_routes
            - invalid_query
            - invalid_ip_rules
            - invalid_request
            - invalid_body
            - invalid_tenant
            - invalid_rate_limit
            - rate_limit_not_found
            - store_unavailable
            - wal_disabled
            - unauthenticated
            - forbidden
        field:
          type: string
          description: |
            The offending field: on `invalid_filter` the parameter or `body`; on
            the route errors the route field (`path`, `ip_rules`, …), the
            parameter (`enabled`, `limit`), or the dry-run field.
        message:
          type: string
          description: Human-readable reason, on the `invalid_*` codes that carry one.
        role:
          type: string
          description: Present on `role_not_enabled`; the role this node does not run.
        conflicting_id:
          type: string
          description: Present on `duplicate_route`; the route already holding that path and method.
        max_routes:
          type: integer
          description: Present on `too_many_routes`; the configured cap.
        scope:
          type: string
          description: |
            Present on `forbidden`; the scope the principal lacks (`dlq:read`,
            `tenant:acme`, `tenant:*`, …).
  responses:
    InvalidFilter:
      description: '`400`. `invalid_filter`: a non-integer `since`, `until` or `limit`, a negative `since`/`until` or an `until` before `since` on a quarantine purge, a non-string `source_id` or `id`, a replay spec with an unknown key or a bad field (`kind`, `since`/`until`, `from`/`to`, `sinks`, `rate`, `max_lag_ms`, `state`), or a replay body that is not a JSON object or is over 64 KiB. `field` names the offending parameter or key.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidTenant:
      description: '`400`. `invalid_tenant`: the tenant is not a valid identity — it must match `[A-Za-z0-9_-]{1,64}`, because it is a URL path segment and a storage partition.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badTenant:
              value: {error: invalid_tenant}
    InvalidRateLimit:
      description: '`400`. `invalid_rate_limit`: the body is not a JSON object, or not a limit — `rate` and `burst` are both required, `rate` is a number greater than 0, `burst` an integer of at least 1, the optional keys are in range (`burst_bytes` needs `bytes_per_second`; `max_body_bytes` is at most the instance''s), and unknown fields are refused. `message` says which.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            zeroRate:
              value: {error: invalid_rate_limit, message: 'rate must be a number greater than 0, got 0'}
            missingBurst:
              value: {error: invalid_rate_limit, message: 'burst is required'}
            unknownField:
              value: {error: invalid_rate_limit, message: 'unknown field "per"'}
            burstBytesAlone:
              value: {error: invalid_rate_limit, message: 'burst_bytes needs bytes_per_second'}
            notJson:
              value: {error: invalid_rate_limit, message: 'body must be a JSON object'}
    RoleNotEnabled:
      description: '`409`. `role_not_enabled`: this node does not run the role the route needs. Ask another node.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ReplayNotFound:
      description: '`404`. `replay_not_found`: this node holds no replay job with that id.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: replay_not_found}
    WalDisabled:
      description: '`409`. `wal_disabled`: this node runs `wal.type: none` and has no log to report.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: wal_disabled}
    InvalidRoute:
      description: '`400`. `invalid_route`: a route definition that would not mean what it says — a path that is not rooted or has an illegal segment, a non-boolean `enabled`, a bad CIDR, a `tenant_id` or `source_id` that is not valid (or, on the tenant surface, a `tenant_id` other than the path''s), unknown fields, or `path`/`id`/`tenant_id`/`source_id` in a `PATCH`. `field` names it and `message` says why. Also `invalid_body` when the body never parsed, and, on the tenant surface, `invalid_tenant` when the tenant in the path is not an identity.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unknownField:
              summary: '`inserted_at` is not a route field'
              value: {error: invalid_route, field: inserted_at, message: 'unknown field'}
            badId:
              value: {error: invalid_route, field: id, message: 'must be a lowercase slug of at most 64 characters'}
            unrootedPath:
              value: {error: invalid_route, field: path, message: 'must start with "/"'}
            badSegment:
              value: {error: invalid_route, field: path, message: 'invalid segment "*"'}
            immutablePath:
              value: {error: invalid_route, field: path, message: 'immutable; use PUT'}
            immutableTenant:
              value: {error: invalid_route, field: tenant_id, message: 'immutable; use PUT'}
            badTenantId:
              value: {error: invalid_route, field: tenant_id, message: 'must match [A-Za-z0-9_-]{1,64}'}
            otherTenantId:
              summary: The tenant surface took the tenant from the path, and the body names another
              value: {error: invalid_route, field: tenant_id, message: 'must be acme, the tenant in the path, or absent'}
            badSourceId:
              value: {error: invalid_route, field: source_id, message: 'must be a non-empty string of at most 256 characters, without whitespace or "/"'}
            badTenant:
              summary: '`invalid_tenant` instead, when the tenant in the path is not an identity'
              value: {error: invalid_tenant}
            notJson:
              summary: '`invalid_body` instead, when the body never parsed'
              value: {error: invalid_body}
    InvalidQuery:
      description: '`400`. `invalid_query`: a `limit` that is not an integer, or an `enabled` that is neither `true` nor `false`. `field` names it.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badLimit:
              value: {error: invalid_query, field: limit}
            badEnabled:
              value: {error: invalid_query, field: enabled}
            badTenant:
              summary: '`invalid_tenant` instead, when the tenant in the path is not an identity'
              value: {error: invalid_tenant}
    InvalidRequest:
      description: '`400`. `invalid_request`: the dry run''s `method`, `path`, or `ip` is missing or unusable. `field` names it. Also `invalid_body` when the request body never parsed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badIp:
              value: {error: invalid_request, field: ip, message: 'must be an IPv4 or IPv6 address'}
            unmatchablePath:
              value: {error: invalid_request, field: path, message: 'is not a matchable request path'}
            missingMethod:
              value: {error: invalid_request, field: method, message: 'is required and must be a string'}
            notJson:
              summary: '`invalid_body` instead, when the body never parsed'
              value: {error: invalid_body}
    InvalidIpRules:
      description: '`400`. `invalid_ip_rules`: both `default` and `rules` are required, `default` is `allow` or `deny`, `rules` is a list, and every rule is an object with an `action` of `allow`/`deny` and a `cidr` that parses. A range inside `::ffff:0:0/96` parses but is refused, because client addresses are matched as IPv4 and such a range could never match; write the equivalent IPv4 CIDR. `field` is `default` or `rules`; a bad rule''s `message` names its index (`rule 0: ...`). A body that is not a JSON object is `invalid_body`, not this.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingDefault:
              summary: '`default` is required'
              value: {error: invalid_ip_rules, field: default, message: is required}
            missingRules:
              summary: '`rules` is required'
              value: {error: invalid_ip_rules, field: rules, message: is required}
            rulesNotAList:
              value: {error: invalid_ip_rules, field: rules, message: 'must be a list of rules'}
            unknownRuleField:
              value: {error: invalid_ip_rules, field: rules, message: 'rule 0: unknown field "cidrs"'}
            badAction:
              value: {error: invalid_ip_rules, field: rules, message: 'rule 0: invalid action "maybe"'}
            badCidr:
              value: {error: invalid_ip_rules, field: rules, message: 'rule 0: invalid cidr "10.0.0.0/33"'}
            mappedRange:
              summary: 'a range inside `::ffff:0:0/96`: it parses, but it could never match'
              value: {error: invalid_ip_rules, field: rules, message: 'rule 0: invalid cidr "::ffff:10.0.0.0/104": it is inside ::ffff:0:0/96, and client addresses are matched as IPv4, so it can never match; write the equivalent IPv4 CIDR instead'}
            badDefault:
              value: {error: invalid_ip_rules, field: default, message: 'must be "allow" or "deny", got "maybe"'}
            notJson:
              summary: '`invalid_body` instead, when the body never parsed'
              value: {error: invalid_body}
    DuplicateRoute:
      description: '`409`. `duplicate_route`: an enabled route already captures this path and one of these methods, or a `POST` names an id that is taken. `conflicting_id` is the route holding it. Also `too_many_routes`: the store is at `routes.max_routes`, and nothing is evicted to make room — delete a route instead.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            takenId:
              value: {error: duplicate_route, conflicting_id: stripe}
            samePathAndMethod:
              value: {error: duplicate_route, conflicting_id: checkout}
            heldElsewhere:
              summary: On the tenant surface, an id or an enabled path and method another tenant holds — whose it is is not said
              value: {error: duplicate_route}
            atCap:
              summary: '`too_many_routes` instead, when the cap is reached'
              value: {error: too_many_routes, max_routes: 10000}
    NotFound:
      description: '`404`. `not_found`: no such route, or no such path on this listener. A method the path does not serve is also a `404`, deliberately — a probe cannot tell a missing path from a wrong method.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            noSuchRoute:
              value: {error: not_found}
    RateLimitNotFound:
      description: '`404`. `rate_limit_not_found`: this node holds no runtime override for that tenant. The config may still give it a limit — `GET` reports that as `source: config` or `default`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            noOverride:
              value: {error: rate_limit_not_found}
    StoreUnavailable:
      description: '`503`. `store_unavailable`: nothing was written. Either the route store could not be reached (a Redis store with Redis down), or the write kept losing to concurrent writers and exhausted its retries — the table changed under the snapshot it had validated, every time. Both are transient: retry, and reads keep working from this node''s in-memory snapshot either way.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            redisDown:
              value: {error: store_unavailable}
    NodeStoreUnavailable:
      description: '`503`. `store_unavailable`: this node''s store could not be read or written, so nothing changed. Transient: retry.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            storeDown:
              value: {error: store_unavailable}
    Unauthorized:
      description: '`401`. `unauthenticated`: no credential, or one that is wrong, expired or unknown. The body is the same whatever the cause. Every operation except `GET /health` and `GET /ready` needs a credential.'
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Always `Bearer realm="ankusa"`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: unauthenticated}
    Forbidden:
      description: '`403`. `forbidden`: the credential is good, but its principal lacks `scope`, which the operation needs. Scopes are checked before anything else, so a caller without them learns nothing about this node.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingRead:
              value: {error: forbidden, scope: 'routes:read'}
            missingWrite:
              value: {error: forbidden, scope: 'routes:write'}
            missingDlq:
              value: {error: forbidden, scope: 'dlq:read'}
            missingTenant:
              summary: A resource that spans tenants needs `tenant:*`
              value: {error: forbidden, scope: 'tenant:*'}
            missingTenantScope:
              summary: The tenant surface, for a tenant the principal does not hold
              value: {error: forbidden, scope: 'tenant:globex'}
