      security: [{scimToken: []}]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimGroup'
          application/json:
            schema:
              $ref: '#/components/schemas/ScimGroup'
      responses:
        '200':
