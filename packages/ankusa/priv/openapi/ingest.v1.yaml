openapi: 3.2.0
info:
  title: Ankusa Ingest API
  version: 1.0.0
  summary: Point a provider's webhook at a catch URL, get an honest 2xx.
  description: |
    HTTP surface of the `:edge` role. This document is the cross-language
    contract for webhook *senders*: the Elixir code conforms to it, not the
    reverse.

    The core invariant is visible in the status codes: a `2xx` is never
    returned until the hook is durably accepted — by this node's log
    (`wal.type: disk`) or by the source's sinks (`wal.type: none`). `201
    accepted` means durably accepted; `202 quarantined` means the source's
    policy kept a failed-verification hook instead of rejecting it.

    There is no request authentication here beyond provider signature
    verification, which is webhook semantics rather than access control: the
    source's configured verifier (Stripe, GitHub, Standard Webhooks, or none)
    checks the provider's own signature header over the exact raw body.

    The catch-URL shape is pluggable (`Ankusa.RouteResolver`). The two paths
    below are the shipped resolvers: `.../webhooks/{source_id}` (single-tenant,
    the default) and `.../webhooks/{tenant_id}/{source_id}` (the tenant is
    authoritative from the path).
servers:
  - url: http://localhost:4000
    description: Local development listener (default `port`).
security: []
tags:
  - name: ingest
    description: Accept a provider's webhook.
  - name: operations
    description: Health and self-description.
paths:
  /webhooks/{source_id}:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    post:
      operationId: ingestHook
      tags: [ingest]
      summary: Ingest a hook for a source
      description: |
        The default catch URL (`Ankusa.RouteResolver.Path`, prefix
        `webhooks`). The tenant comes from the source config.
      requestBody:
        required: true
        description: |
          The provider's exact raw bytes, at most `max_body_bytes`. Signature
          verification runs over these bytes verbatim, so any transformation
          (JSON re-encoding, whitespace) invalidates the signature.
        content:
          '*/*': {}
      responses:
        '201':
          $ref: '#/components/responses/Accepted'
        '202':
          $ref: '#/components/responses/Quarantined'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/VerificationFailed'
        '404':
          $ref: '#/components/responses/UnknownSource'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Overloaded'
  /webhooks/{tenant_id}/{source_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SourceId'
    post:
      operationId: ingestHookForTenant
      tags: [ingest]
      summary: Ingest a hook for a tenant's source
      description: |
        The multi-tenant catch URL (`Ankusa.RouteResolver.TenantPath`, prefix
        `webhooks`). The tenant in the path is authoritative: it scopes storage
        and overrides the source's configured tenant.
      requestBody:
        required: true
        description: The provider's exact raw bytes, at most `max_body_bytes`.
        content:
          '*/*': {}
      responses:
        '201':
          $ref: '#/components/responses/Accepted'
        '202':
          $ref: '#/components/responses/Quarantined'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/VerificationFailed'
        '404':
          $ref: '#/components/responses/UnknownSource'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Overloaded'
  /health:
    get:
      operationId: getHealth
      tags: [operations]
      summary: Liveness probe
      description: |
        Always `200` while the listener is up.
      responses:
        '200':
          description: The listener is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ready:
    get:
      operationId: getReady
      tags: [operations]
      summary: Readiness probe
      description: |
        `200` while this node can ack a hook. Every readiness check that applies
        to the node's config lists its state in the body (`ok`, `failing` or
        `draining`), with `reasons` naming why a check is not `ok`: `store` (a
        synced write to the local store succeeds; the answer is cached for 1 s),
        `intake` (`wal.type: dual`), `sinks` (`wal.type: none`: no sink failed its
        last publish within `health.sink_error_window_ms`), `disk`
        (`node.min_free_bytes`), `backlog` (`queue.max_oldest_due_ms`) and
        `backup` (`backup.max_age_ms`). `503` with `Retry-After: 1` while a check
        that gates is not `ok`: `store`, `intake`, `sinks` and `disk` always,
        `backup` only with `backup.require_fresh`, `backlog` never (a label).
        A node with none of these checks is always ready. `/health` stays a
        liveness probe.
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example: {status: ready, instance: default, store: ok, backlog: failing, reasons: {backlog: over_threshold}}
        '503':
          description: Not ready.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Always `1`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example: {status: unavailable, instance: default, store: failing, reasons: {store: no_space}}
components:
  parameters:
    SourceId:
      name: source_id
      in: path
      required: true
      description: |
        A declared `Ankusa.Source` id. An undeclared id is a `404
        unknown_source`, not an auto-created source.
      schema:
        type: string
        minLength: 1
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: |
        Any non-empty UTF-8 string. Percent-encoded in the path.
      schema:
        type: string
        minLength: 1
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
  schemas:
    Accepted:
      type: object
      description: The hook is durably accepted.
      required: [status, id]
      properties:
        status:
          const: accepted
        id:
          type: string
          description: |
            The envelope id Ankusa assigned to this hook (a UUIDv7), generated
            on receipt. Unrelated to the provider's own event id.
        duplicate:
          type: boolean
          description: |
            `true` when a provider retry was collapsed by the source's dedupe:
            nothing new was stored, and `id` is the original hook's id.
    Quarantined:
      type: object
      required: [status, reason]
      properties:
        status:
          const: quarantined
        reason:
          type: string
          description: |
            `inspect/1` of the verifier's failure reason, e.g. `:no_match`.
      description: |
        Verification failed and the source's `on_verify_failure` is
        `quarantine`.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - unknown_source
            - verification_failed
            - payload_too_large
            - body_read_failed
            - invalid_header
            - not_found
            - overload
            - store_unavailable
            - rate_limited
            - tenant_overload
            - ip_rate_limited
            - node_rate_limited
            - source_rate_limited
            - quarantine_rate_limited
            - quarantine_full
        reason:
          type: string
          description: Present on `verification_failed` and `body_read_failed`.
        limit:
          type: integer
          description: Present on `payload_too_large`; the `max_body_bytes` that applies to this request — the tenant's own when it has one, else the instance's.
        header:
          type: [string, "null"]
          description: Present on `invalid_header`; the offending header name, or null when the name itself is not printable.
    Health:
      type: object
      required: [status, instance]
      properties:
        status:
          const: ok
        instance:
          type: string
    CheckState:
      type: string
      enum: [ok, failing, draining]
    Readiness:
      type: object
      description: |
        One key per readiness check that applies to the node (see `GET /ready`);
        a check that does not apply has no key.
      required: [status, instance]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        instance:
          type: string
        store:
          $ref: '#/components/schemas/CheckState'
          description: Present on a node that runs the local store.
        intake:
          $ref: '#/components/schemas/CheckState'
          description: 'Present with `wal.type: dual`.'
        sinks:
          $ref: '#/components/schemas/CheckState'
          description: 'Present with `wal.type: none`.'
        disk:
          $ref: '#/components/schemas/CheckState'
          description: Present with `node.min_free_bytes`.
        backlog:
          $ref: '#/components/schemas/CheckState'
          description: |
            Present with `queue.max_oldest_due_ms`. A label: never makes the
            node unready.
        backup:
          $ref: '#/components/schemas/CheckState'
          description: |
            Present with `backup.enabled` and `backup.max_age_ms`: `failing`
            when the last successful backup is older than `max_age_ms` (or the
            uploader is not running). `503` only with `backup.require_fresh`.
        reasons:
          type: object
          description: Present while a check is not `ok`, why, per check.
          properties:
            store:
              type: string
              enum: [no_space, io_error, read_only, corruption, busy, timeout, not_running, other, error]
            intake:
              type: string
              enum: [down, recovering, error]
            sinks:
              type: string
              enum: [publish_failed, error]
            disk:
              type: string
              enum: [below_floor, unmeasured, error]
            backlog:
              type: string
              enum: [over_threshold, unavailable, error]
            backup:
              type: string
              enum: [stale, error]
  responses:
    Accepted:
      description: '`201`. Durably accepted; stored before the response.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Accepted'
    Quarantined:
      description: '`202`. Held for an operator; see the source''s `on_verify_failure`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Quarantined'
    BadRequest:
      description: >-
        `400`. `body_read_failed`: the body could not be read at all (client disconnect, read timeout). Retry.
        `invalid_header`: a header name or value holds a byte outside visible ASCII, space and tab; no sink could carry it. Permanent for this request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VerificationFailed:
      description: |
        `401`. `verification_failed`: the signature check failed and the
        source's `on_verify_failure` is `reject`. Permanent for this body — do
        not retry it unchanged.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnknownSource:
      description: '`404`. `unknown_source`. Permanent; the catch URL names no declared source.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: '`413`. `payload_too_large`. Permanent; body exceeds `max_body_bytes` — the instance''s, or the tenant''s own (`rate_limits.tenants[t].max_body_bytes`), which is named in `limit`. Refused on the declared `Content-Length` before the body is read.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: |
        `429`. Nothing was stored. Transient — retry after the `Retry-After`
        seconds. `error` is one of:

        - `rate_limited`: this hook's tenant is over its ingest quota on this
          node (`rate_limits`: hooks or bytes per second).
        - `tenant_overload`: this hook's tenant holds its whole share of this
          node's batchers (`rate_limits.tenants[t].max_queue` /
          `max_queue_bytes`). `Retry-After` is `1`. Other tenants are not
          affected, and this is never the global `503 overload`.
        - `ip_rate_limited`, `node_rate_limited`: the client address, or the
          node as a whole, is over `rate_limits.per_ip` / `rate_limits.node`.
          Answered before the request body is read.
        - `source_rate_limited`: the source is over its body-bytes-per-second
          ceiling (`rate_limits.sources.default`). Answered before the body is
          read when `Content-Length` is declared, after it otherwise.
        - `quarantine_rate_limited`: verification failed, the source's
          `on_verify_failure` is `quarantine`, and the source's quarantine
          bucket on this node (`quarantine.burst`/`quarantine.rate`) is empty.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Overloaded:
      description: |
        `503`. Transient — retry after the `Retry-After` seconds. `error` is
        one of:

        - `overload`: the batcher queue is full; the edge sheds load rather
          than growing without bound.
        - `store_unavailable`: no durable destination accepted the hook (the
          store commit failed under `wal.type: disk`, or a sink refused under
          `wal.type: none`).
        - `quarantine_full`: verification failed, the source's
          `on_verify_failure` is `quarantine`, and this node's pen is at its
          byte cap (`quarantine.max_bytes`). Nothing was stored — a full pen
          refuses, it never evicts a held hook. It clears only when an operator
          releases or purges entries, so `Retry-After` is `60`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
