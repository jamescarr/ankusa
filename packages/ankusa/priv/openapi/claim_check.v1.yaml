openapi: 3.1.0
info:
  title: Ankusa Claim Check Gateway
  version: 1.0.0
  summary: Read-only byte transport for claim-check refs.
  description: |
    HTTP surface of the `:claim_check` role. This document is the
    cross-language contract. The Elixir code conforms to it, not the reverse.

    A claim-check ref is one string, in one of two forms:

        urn:ankusa:claim:v1:<tenant>:<claim_id>
        urn:ankusa:claim:v2:<tenant>:<claim_id>:<exp_unix>:<signature>

    A reader turns it into a request by dropping the `urn:ankusa:claim:v<n>:`
    prefix and joining the tenant and claim id with `/` under `/v1/claims/`;
    a v2 ref's expiry and signature go on the same request as the `exp` and
    `sig` query parameters, which the gateway checks before it reads anything
    (a v2 ref is only as good as its expiry; a v1 ref never expires, and is
    refused once the gateway is told to accept signed refs only). The gateway
    returns the bytes; the reader checks them against the `sha256` the queue
    message carries next to the ref, which is never sent to the gateway.

    Every operation except `GET /health` needs a credential
    (`claim_check.auth`): a static bearer token (`mode: token`), an OIDC
    access token (`mode: jwt`) or a client certificate (`mode: mtls`).
    Reading a claim needs the `claims:read` scope **and** the tenant of the
    path, as `tenant:<tenant_id>` or `tenant:*` (or whatever the gateway's
    `claim_check.authorize` hook decides): `401` without an accepted
    credential, `403` without the scope. `mode: none` is accepted on a
    loopback address only, or with `allow_insecure: true` when a mesh or
    proxy in front of the port authenticates every caller. A shared cache
    must sit behind that layer, never in front of it.
servers:
  - url: http://localhost:4001
    description: Local development listener (default `claim_check.port`).
security:
  - bearerAuth: []
  - mutualTLS: []
tags:
  - name: claims
    description: Read claim bytes.
  - name: operations
    description: Health.
paths:
  /v1/claims/{tenant_id}/{claim_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ClaimId'
    get:
      operationId: readClaim
      tags: [claims]
      summary: Read a claim's bytes
      description: |
        Returns exactly the claim's bytes. Claims are written once and never
        rewritten, so a response is cacheable forever. With the gateway's
        `claim_check.integrity_check: manifest` (the default) a whole claim
        is checked against its pack's manifest before it is sent, `502
        integrity_mismatch` when it differs, and `200` and `206` carry the
        digest as `X-Ankusa-Sha256`. The reader still MUST check the bytes
        against the message's `sha256`, which is the writer's digest (a ranged
        read can only be checked once the whole claim has been reassembled).

        One `bytes` range is served as `206`; several ranges, another unit, a
        malformed `Range`, or any `If-Range` (claims carry no validator) are
        ignored and answered `200` with the whole claim.
      parameters:
        - name: Range
          in: header
          required: false
          description: |
            One byte range: `bytes=first-last`, `bytes=first-` or
            `bytes=-suffix_length` (RFC 9110 §14.1.2). `last` past the claim's
            end is clamped to it.
          schema:
            type: string
            pattern: '^bytes=(\d+-\d*|-\d+)$'
          examples:
            span:
              value: bytes=0-1023
            suffix:
              value: bytes=-1024
        - name: exp
          in: query
          required: false
          description: |
            A v2 ref's expiry (Unix seconds). Send with `sig`, both or neither.
          schema:
            $ref: '#/components/schemas/Exp'
        - name: sig
          in: query
          required: false
          description: |
            A v2 ref's signature. Send with `exp`, both or neither: one of
            the two, a value out of grammar, or a signature no configured key
            produced for this tenant, claim and `exp` is `400 bad_signature`;
            a good one whose `exp` has passed is `410 ref_expired`. With
            neither (a v1 ref) the gateway answers `400 unsigned_ref` when it
            refuses unsigned refs (`claim_check.accept_unsigned_refs`).
          schema:
            $ref: '#/components/schemas/Sig'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The claim's bytes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            X-Ankusa-Sha256:
              $ref: '#/components/headers/Sha256'
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '206':
          description: The requested range of the claim's bytes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            X-Ankusa-Sha256:
              $ref: '#/components/headers/Sha256'
            Content-Range:
              description: '`bytes first-last/length`, `length` the whole claim''s size.'
              schema:
                type: string
                pattern: '^bytes \d+-\d+/\d+$'
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '416':
          description: |
            The range starts at or past the claim's end (or is `bytes=-0`, or
            the claim is empty). Empty body.
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            Content-Range:
              description: '`bytes */length`, `length` the whole claim''s size.'
              schema:
                type: string
                pattern: '^bytes \*/\d+$'
        '502':
          $ref: '#/components/responses/IntegrityMismatch'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /health:
    get:
      operationId: getHealth
      security: []
      tags: [operations]
      summary: Liveness probe
      responses:
        '200':
          description: The listener is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <token>`: an OIDC/OAuth2 access token
        (`mode: jwt`) or a static token (`mode: token`).
    mutualTLS:
      type: mutualTLS
      description: |
        A client certificate presented to a listener with `tls.verify:
        verify_peer` (`mode: mtls`), mapped to scopes by `auth.mtls.subject_map`.
  headers:
    CacheControl:
      description: |
        Always `private, max-age=31536000, immutable`: the path is a
        capability, so only the reader may cache it.
      schema:
        type: string
    AcceptRanges:
      description: Always `bytes`.
      schema:
        type: string
        const: bytes
    Sha256:
      description: |
        The lowercase hex sha256 of the whole claim, as its pack's manifest
        records it. Sent unless `claim_check.integrity_check` is `off`; on a
        `206` it is the whole claim's digest, to check once the ranges are
        reassembled.
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: The claim's tenant. Never needs encoding.
      schema:
        $ref: '#/components/schemas/TenantId'
    ClaimId:
      name: claim_id
      in: path
      required: true
      description: The claim's id, a canonical (uppercase) ULID.
      schema:
        $ref: '#/components/schemas/ClaimId'
  schemas:
    TenantId:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,64}$'
      examples: ['acme']
    ClaimId:
      type: string
      description: |
        A ULID in canonical form: 26 characters of uppercase Crockford
        base32. The first 48 bits are the pack's creation time in Unix
        milliseconds; the last 16 are the claim's position in its pack.
      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      examples: ['01M39VMD8RA3C5HR4RBV67Y002']
    Ref:
      type: string
      description: |
        A claim-check ref, as carried in a queue message's `claim` field.
        v1 has two segments, tenant and claim id; v2 adds the Unix second the
        ref expires and a 43-character unpadded base64url HMAC-SHA256 of
        `urn:ankusa:claim:v2:<tenant>:<claim_id>:<exp_unix>` under one of the
        gateway's `claim_check.ref_signing_keys`. The digest to check the
        bytes against is the message's `sha256` field (lowercase hex), not
        part of the ref.
      pattern: '^urn:ankusa:claim:(v1:[A-Za-z0-9_-]{1,64}:[0-7][0-9A-HJKMNP-TV-Z]{25}|v2:[A-Za-z0-9_-]{1,64}:[0-7][0-9A-HJKMNP-TV-Z]{25}:[1-9][0-9]{0,11}:[A-Za-z0-9_-]{43})$'
      examples:
        - urn:ankusa:claim:v1:acme:01M39VMD8RA3C5HR4RBV67Y002
        - urn:ankusa:claim:v2:acme:01M39VMD8RA3C5HR4RBV67Y002:1790345000:MAmydaNzNwA3sV38ggZG15ElUTajA8QtBkKevsaq1Ac
    Exp:
      type: string
      description: |
        A v2 ref's expiry, in Unix seconds: decimal, 1 to 12 digits, no
        leading zero.
      pattern: '^[1-9][0-9]{0,11}$'
      examples: ['1790345000']
    Sig:
      type: string
      description: |
        A v2 ref's signature: 43 unpadded base64url characters, the
        HMAC-SHA256 of `urn:ankusa:claim:v2:<tenant>:<claim_id>:<exp_unix>`.
      pattern: '^[A-Za-z0-9_-]{43}$'
      examples: ['MAmydaNzNwA3sV38ggZG15ElUTajA8QtBkKevsaq1Ac']
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_tenant
            - invalid_id
            - bad_signature
            - unsigned_ref
            - ref_expired
            - not_found
            - store_unavailable
            - store_forbidden
            - overloaded
            - integrity_mismatch
            - unauthenticated
            - forbidden
        scope:
          type: string
          description: |
            Present on `forbidden` from the built-in check; the scope the
            principal lacks (`claims:read`, or `tenant:<tenant_id>`). A
            `claim_check.authorize` hook's refusal names none.
    Health:
      type: object
      required: [status]
      properties:
        status:
          const: ok
  responses:
    BadRequest:
      description: |
        `invalid_tenant` or `invalid_id` (not a canonical ULID); `bad_signature`
        (a v2 ref's `exp` or `sig` is missing one, out of grammar, or not what
        any `claim_check.ref_signing_keys` entry signed for this tenant, claim
        and expiry); `unsigned_ref` (a v1 path while the gateway refuses
        unsigned refs). Permanent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`not_found`: no such claim (expired by retention, never written, or no such route). Permanent. Dead-letter, do not requeue.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IntegrityMismatch:
      description: |
        `integrity_mismatch`: the bytes the store returned, or the pack's
        manifest, do not match the sha256 the manifest records for this claim
        (`claim_check.integrity_check: manifest`). The claim is damaged in the
        store, so a retry reads the same bytes: dead-letter, do not requeue.
        None of the bytes are sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description: |
        `ref_expired`: the ref's signature is good and its `exp` has passed.
        Permanent for this ref: dead-letter, do not requeue. Redeliver the
        hook to get a fresh one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StoreUnavailable:
      description: |
        `store_unavailable` (the object store is unreachable, throttling, or
        slower than the gateway's deadline) or `overloaded` (the node is at
        `claim_check.max_concurrent_reads`). Transient. Retry.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: |
        `401`. `unauthenticated`: no credential, or one that is wrong, expired
        or unknown. A fault in the reader's configuration, not in the claim:
        fix the credential and retry; do not dead-letter the message.
      headers:
        WWW-Authenticate:
          description: Always `Bearer realm="ankusa"`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: unauthenticated}
    Forbidden:
      description: |
        `403`. `forbidden`: the credential is good, but its principal lacks
        `claims:read` or the path's tenant (`scope` names it). Like `401`, a
        reader configuration fault: do not dead-letter the message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingScope:
              value: {error: forbidden, scope: 'claims:read'}
            otherTenant:
              value: {error: forbidden, scope: 'tenant:acme'}
