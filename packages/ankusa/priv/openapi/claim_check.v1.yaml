openapi: 3.1.0
info:
  title: Ankusa Claim Check Gateway
  version: 1.0.0
  summary: Read-only byte transport for claim-check refs.
  description: |
    HTTP surface of the `:claim_check` role. This document is the
    cross-language contract. The Elixir code conforms to it, not the reverse.

    A claim-check ref is one string:

        urn:ankusa:claim:v1:<tenant>:<object_id>:<offset>:<length>:sha256-<hex>

    A reader turns it into a request by dropping the `urn:ankusa:claim:v1:`
    prefix and the `sha256-` digest, and joining the rest with `/` under
    `/v1/claims/`. The gateway returns the bytes; the reader checks them
    against the digest, which is never sent to the gateway.

    This API performs no authentication or authorization. Deployers secure it
    at their own boundary (a service mesh, Envoy, an API gateway, network
    policy). The tenant is a path segment so that layer can authorize by
    route without reading bodies. A shared cache must sit behind that layer,
    never in front of it.
servers:
  - url: http://localhost:4001
    description: Local development listener (default `claim_check.port`).
security: []
tags:
  - name: claims
    description: Read claim bytes.
  - name: operations
    description: Health.
paths:
  /v1/claims/{tenant_id}/{object_id}/{offset}/{length}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ObjectId'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Length'
    get:
      operationId: readClaim
      tags: [claims]
      summary: Read a claim's bytes
      description: |
        Returns exactly `length` bytes starting at `offset` in the object.
        Objects are written once and never rewritten, so a response is
        cacheable forever. The server does not verify integrity: the reader
        MUST check the bytes against the sha256 in its ref.
      responses:
        '200':
          description: The claim's bytes.
          headers:
            Cache-Control:
              description: Always `public, max-age=31536000, immutable`.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /health:
    get:
      operationId: getHealth
      tags: [operations]
      summary: Liveness probe
      responses:
        '200':
          description: The listener is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: The claim's tenant. Never needs encoding.
      schema:
        $ref: '#/components/schemas/TenantId'
    ObjectId:
      name: object_id
      in: path
      required: true
      description: The pack object's id, an RFC 9562 UUIDv7, lowercase and hyphenated.
      schema:
        $ref: '#/components/schemas/UUIDv7'
    Offset:
      name: offset
      in: path
      required: true
      description: Byte offset of the claim inside the object. Decimal, no leading zeros.
      schema:
        type: string
        pattern: '^(0|[1-9][0-9]{0,11})$'
    Length:
      name: length
      in: path
      required: true
      description: Length of the claim in bytes. Decimal, no leading zeros, at least 1.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,11}$'
  schemas:
    TenantId:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,64}$'
      examples: ['acme']
    UUIDv7:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      examples: ['0199a1c2-7b3e-7d4a-9c1f-2e5b8a6d4f10']
    Ref:
      type: string
      description: |
        A claim-check ref, as carried in a queue message's `claim` field.
        Segments: tenant, object id, offset, length, and the claim's sha256
        (lowercase hex).
      pattern: '^urn:ankusa:claim:v1:[A-Za-z0-9_-]{1,64}:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}:(0|[1-9][0-9]{0,11}):[1-9][0-9]{0,11}:sha256-[0-9a-f]{64}$'
      examples:
        - urn:ankusa:claim:v1:acme:0199a1c2-7b3e-7d4a-9c1f-2e5b8a6d4f10:66:3145728:sha256-3bea8a9a07c1e8dcaa4c1b816815c35a29b4fb585ba6ecc70ea44840a794cfb3
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_tenant
            - invalid_id
            - invalid_range
            - not_found
            - store_unavailable
    Health:
      type: object
      required: [status]
      properties:
        status:
          const: ok
  responses:
    BadRequest:
      description: '`invalid_tenant`, `invalid_id`, or `invalid_range` (a malformed offset or length). Permanent.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`not_found`: no such object, or no such route. Permanent. Dead-letter, do not requeue.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RangeNotSatisfiable:
      description: '`invalid_range`: the range runs past the end of the object. Permanent.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StoreUnavailable:
      description: '`store_unavailable`. Transient. Retry.'
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
