openapi: 3.1.0
info:
  title: Ankusa Claim Check Gateway
  version: 1.0.0
  summary: Read-only byte transport for claim-check refs.
  description: |
    HTTP surface of the `:claim_check` role. This document is the
    cross-language contract. The Elixir code conforms to it, not the reverse.

    A claim-check ref is one string:

        urn:ankusa:claim:v1:<tenant>:<claim_id>

    A reader turns it into a request by dropping the `urn:ankusa:claim:v1:`
    prefix and joining the two segments with `/` under `/v1/claims/`. The
    gateway returns the bytes; the reader checks them against the `sha256`
    the queue message carries next to the ref, which is never sent to the
    gateway.

    This API performs no authentication or authorization. Deployers secure it
    at their own boundary (a service mesh, Envoy, an API gateway, network
    policy). The tenant is a path segment so that layer can authorize by
    route without reading bodies. A shared cache must sit behind that layer,
    never in front of it.
servers:
  - url: http://localhost:4001
    description: Local development listener (default `claim_check.port`).
security: []
tags:
  - name: claims
    description: Read claim bytes.
  - name: operations
    description: Health.
paths:
  /v1/claims/{tenant_id}/{claim_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ClaimId'
    get:
      operationId: readClaim
      tags: [claims]
      summary: Read a claim's bytes
      description: |
        Returns exactly the claim's bytes. Claims are written once and never
        rewritten, so a response is cacheable forever. The server does not
        verify integrity: the reader MUST check the bytes against the
        message's `sha256` (a ranged read can only be checked once the whole
        claim has been reassembled).

        One `bytes` range is served as `206`; several ranges, another unit, a
        malformed `Range`, or any `If-Range` (claims carry no validator) are
        ignored and answered `200` with the whole claim.
      parameters:
        - name: Range
          in: header
          required: false
          description: |
            One byte range: `bytes=first-last`, `bytes=first-` or
            `bytes=-suffix_length` (RFC 9110 §14.1.2). `last` past the claim's
            end is clamped to it.
          schema:
            type: string
            pattern: '^bytes=(\d+-\d*|-\d+)$'
          examples:
            span:
              value: bytes=0-1023
            suffix:
              value: bytes=-1024
      responses:
        '200':
          description: The claim's bytes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '206':
          description: The requested range of the claim's bytes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            Content-Range:
              description: '`bytes first-last/length`, `length` the whole claim''s size.'
              schema:
                type: string
                pattern: '^bytes \d+-\d+/\d+$'
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: |
            The range starts at or past the claim's end (or is `bytes=-0`, or
            the claim is empty). Empty body.
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            Content-Range:
              description: '`bytes */length`, `length` the whole claim''s size.'
              schema:
                type: string
                pattern: '^bytes \*/\d+$'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /health:
    get:
      operationId: getHealth
      tags: [operations]
      summary: Liveness probe
      responses:
        '200':
          description: The listener is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  headers:
    CacheControl:
      description: |
        Always `private, max-age=31536000, immutable`: the path is a
        capability, so only the reader may cache it.
      schema:
        type: string
    AcceptRanges:
      description: Always `bytes`.
      schema:
        type: string
        const: bytes
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: The claim's tenant. Never needs encoding.
      schema:
        $ref: '#/components/schemas/TenantId'
    ClaimId:
      name: claim_id
      in: path
      required: true
      description: The claim's id, a canonical (uppercase) ULID.
      schema:
        $ref: '#/components/schemas/ClaimId'
  schemas:
    TenantId:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,64}$'
      examples: ['acme']
    ClaimId:
      type: string
      description: |
        A ULID in canonical form: 26 characters of uppercase Crockford
        base32. The first 48 bits are the pack's creation time in Unix
        milliseconds; the last 16 are the claim's position in its pack.
      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      examples: ['01M39VMD8RA3C5HR4RBV67Y002']
    Ref:
      type: string
      description: |
        A claim-check ref, as carried in a queue message's `claim` field.
        Segments: tenant and claim id. The digest to check the bytes against
        is the message's `sha256` field (lowercase hex), not part of the ref.
      pattern: '^urn:ankusa:claim:v1:[A-Za-z0-9_-]{1,64}:[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      examples:
        - urn:ankusa:claim:v1:acme:01M39VMD8RA3C5HR4RBV67Y002
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_tenant
            - invalid_id
            - not_found
            - store_unavailable
    Health:
      type: object
      required: [status]
      properties:
        status:
          const: ok
  responses:
    BadRequest:
      description: '`invalid_tenant` or `invalid_id` (not a canonical ULID). Permanent.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`not_found`: no such claim (expired by retention, never written, or no such route). Permanent. Dead-letter, do not requeue.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StoreUnavailable:
      description: '`store_unavailable`. Transient. Retry.'
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
