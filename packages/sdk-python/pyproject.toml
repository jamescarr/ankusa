[project]
name = "ankusa"
version = "0.3.0"
description = "Client SDK for Ankusa deployments. Bundles the claim-check gateway client and a webhook-receiving header helper today; more clients (ingest, admin) land here as they're built."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["ankusa", "webhook", "claim-check"]
dependencies = ["httpx>=0.27"]

[project.urls]
Repository = "https://github.com/jamescarr/ankusa"
Homepage = "https://github.com/jamescarr/ankusa/tree/main/packages/sdk-python"
Issues = "https://github.com/jamescarr/ankusa/issues"

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ankusa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]
