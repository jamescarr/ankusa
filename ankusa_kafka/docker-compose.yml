services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 2s
      timeout: 5s
      retries: 30

  redpanda-bootstrap:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    entrypoint: /bin/sh
    command:
      - -c
      - |
        rpk cluster health --api-urls redpanda:9644 --watch --exit-when-healthy
        rpk topic create ankusa.test --brokers redpanda:9092 --partitions 3 --replicas 1
    depends_on:
      redpanda:
        condition: service_healthy
