# Toolchain for the ankusa monorepo. Tasks live in .mise/tasks/ (one file
# each, driven by whatever is in packages/*); CI runs the same tasks.
#   mise tasks ls         # list them
#   mise run check        # everything CI checks, locally
#   mise config ls        # this file and every .mise/conf.d/*.toml fragment
#
# Repo-wide tools only. A toolchain one package needs lives in that package's
# fragment, .mise/conf.d/<dir under packages/>.toml (packages/sdk-rust ->
# .mise/conf.d/sdk-rust.toml), which mise loads alongside this file. A new SDK
# adds its fragment and leaves this file alone, so SDK PRs in flight together
# don't conflict here. Name fragments with hyphens, not dots: mise is turning
# a dot in a conf.d name into an environment suffix.

# The first mise that loads .mise/conf.d/; older ones skip the fragments
# silently and run with half the toolchain.
min_version = "2026.8.7"

[tools]
elixir = "1.20.4-otp-29"
erlang = "29.1.2"
node = "24"
# brod's crc32cer NIF (ankusa_kafka, ankusa_server, and the kafka example)
# compiles from source and needs CMake >= 3.16; 4.4.4 builds it on macOS.
cmake = "4.4.4"
kind = "0.33.0"
kubectl = "1.37.1"
helm = "4.3.1"
# Validates the rendered Helm chart (check:examples) against the Kubernetes schemas.
kubeconform = "0.8.0"
actionlint = "1.7.12"
promtool = "3.15.1"
