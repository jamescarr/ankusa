# One address in front of the edge replicas, so killing an edge is a failover
# the load generator does not have to know about.
events {}
http {
  upstream edges {
    server edge-1:4000;
    server edge-2:4000;
    server edge-3:4000;
    keepalive 32;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://edges;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_connect_timeout 2s;
      proxy_send_timeout 15s;
      proxy_read_timeout 15s;
    }
  }
}
