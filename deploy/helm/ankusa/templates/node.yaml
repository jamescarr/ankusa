{{- $wal := include "ankusa.wal" . -}}
{{- $fullname := include "ankusa.fullname" . -}}
{{- if eq $wal "none" }}
# wal.type: none. Stateless edge pods: no queue, nothing to lose with a pod, so a
# Deployment the HPA may scale freely. The 2xx waits for every sink's confirm.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ankusa.labels" . | nindent 4 }}
spec:
  {{- /* replicas is left out under an HPA: it owns the count, and a helm upgrade must not reset a scaled-out fleet. */}}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ int .Values.replicas }}
  {{- end }}
  minReadySeconds: {{ int .Values.minReadySeconds }}
  # Never below the replicas that serve: a new pod is ready before an old one stops.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "ankusa.selector" (dict "ctx" . "component" "node") | nindent 6 }}
  template:
    {{- include "ankusa.nodePodTemplate" . | nindent 4 }}
{{- else }}
# wal.type: {{ $wal }}. Every pod owns a RocksDB store on its own PVC and acks a hook
# only once it is durable there{{ if eq $wal "dual" }} and confirmed in the intake log{{ end }}: a killed pod comes back
# under the same name on the same volume with every hook it had accepted.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ankusa.labels" . | nindent 4 }}
spec:
  replicas: {{ int .Values.replicas }}
  serviceName: {{ $fullname }}-headless
  # The pods share nothing, so there is nothing to start in order. A rolling update
  # still replaces one pod at a time and waits for its /ready.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  minReadySeconds: {{ int .Values.minReadySeconds }}
  persistentVolumeClaimRetentionPolicy:
    {{- toYaml .Values.persistence.retentionPolicy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "ankusa.selector" (dict "ctx" . "component" "node") | nindent 6 }}
  template:
    {{- include "ankusa.nodePodTemplate" . | nindent 4 }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "ankusa.labels" . | nindent 10 }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
{{- end }}
