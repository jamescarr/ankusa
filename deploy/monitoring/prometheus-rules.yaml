# Prometheus alert rules for an Ankusa fleet.
#
# One alert per row of the SLI table in docs/architecture.md#slis-and-slos
# (the `slo` annotation repeats the row's first cell; `mise run check:monitoring`
# fails when a row has none), plus the failure signals the runbooks in
# docs/runbooks/ answer. Every alert carries a `runbook_url` that names a file
# there. `mise run check:monitoring` runs `promtool check rules`, the unit tests
# in prometheus-rules.test.yaml, and the checks above.
#
# Labels. Ankusa puts its own instance name (`default`, a tenant-isolated
# instance's id) on every series as `instance`. With Prometheus's default
# `honor_labels: false` that label is renamed `exported_instance` and
# `instance` is the scrape target (the node), so every rule aggregates by
# `job, instance, exported_instance`: one alert per node and Ankusa instance.
# Scrape `/metrics` of each node's metrics listener (`metrics.enabled`) or
# admin API; the rules assume nothing else about the job name.
#
# Counters. Ankusa's counters appear on their first event, with no earlier
# sample, so `increase()` reports 0 for a series' first event. Where a first
# event must page (store write failures, a subtree outage, the intake log), the
# rules compute `x - (x offset W or x * 0)`: the value now less the value W ago,
# or less zero for a series younger than W.
#
# Thresholds are the SLO table's. Change them there first.

groups:
  - name: ankusa.ack
    rules:
      - alert: AnkusaAckErrorRatioHigh
        expr: |
          sum by (job, instance, exported_instance) (
            rate(ankusa_ingest_requests_total{outcome=~"overload|store_unavailable|intake_unavailable|intake_pending|dlq_full"}[5m])
          )
          /
          sum by (job, instance, exported_instance) (
            rate(ankusa_ingest_requests_total[5m])
          )
          > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} refuses {{ $value | humanizePercentage }} of hooks with a 503"
          description: >-
            More than 1 % of the requests Ankusa instance {{ $labels.exported_instance }} on
            {{ $labels.instance }} answered in the last 5 minutes were 503s (overload,
            store_unavailable, intake_unavailable, intake_pending or dlq_full). Providers retry,
            but a sustained ratio means hooks are at risk of provider give-up.
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/ack-slo.md

      - alert: AnkusaAckLatencySLOBreach
        expr: |
          histogram_quantile(0.99,
            sum by (le, job, instance, exported_instance) (
              rate(ankusa_ingest_duration_seconds_bucket[5m])
            )
          ) > 0.05
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} ack p99 is {{ $value | humanizeDuration }} (target 50 ms)"
          description: >-
            The p99 of ankusa_ingest_duration_seconds on {{ $labels.instance }} has been above the
            50 ms objective for 30 minutes.
          slo: "Ack latency (steady, 10 KB bodies, 1 k req/s/node)"
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/ack-slo.md

      - alert: AnkusaAckLatencyDegraded
        expr: |
          histogram_quantile(0.99,
            sum by (le, job, instance, exported_instance) (
              rate(ankusa_ingest_duration_seconds_bucket[5m])
            )
          ) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} ack p99 is {{ $value | humanizeDuration }} (chaos bound 250 ms)"
          description: >-
            The p99 of ankusa_ingest_duration_seconds on {{ $labels.instance }} has been above 250 ms
            for 10 minutes: the bound the objectives allow only while pods are being killed.
          slo: "Ack latency during chaos (pod kills)"
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/ack-slo.md

      - alert: AnkusaAckLatencyCritical
        expr: |
          histogram_quantile(0.99,
            sum by (le, job, instance, exported_instance) (
              rate(ankusa_ingest_duration_seconds_bucket[5m])
            )
          ) > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} ack p99 is {{ $value | humanizeDuration }}"
          description: >-
            The p99 of ankusa_ingest_duration_seconds on {{ $labels.instance }} has been above one
            second for 5 minutes. Providers with a short timeout are already retrying.
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/ack-slo.md

      - alert: AnkusaIngestNearCapacity
        expr: |
          sum by (job, instance, exported_instance) (
            rate(ankusa_ingest_requests_total[5m])
          ) > 8000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} takes {{ $value | humanize }} hooks/s, 80 % of what the bench sustains"
          description: >-
            {{ $labels.instance }} has handled more than 8 000 requests per second for 15 minutes;
            the in-process bench sustains at least 10 000 per second per node with 1 KB bodies.
            Add an edge node before the ack latency objective goes.
          slo: "Ingest throughput (1 KB bodies, in-process bench)"
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/ack-slo.md

      - alert: AnkusaDrainBudgetAtRisk
        expr: |
          histogram_quantile(0.99,
            sum by (le, job, instance, exported_instance) (
              rate(ankusa_wal_commit_duration_seconds_bucket[5m])
            )
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} store commit p99 is {{ $value | humanizeDuration }}"
          description: >-
            A store commit takes more than the 2 s the SIGTERM drain budgets for it
            (Ankusa.Listener.ingress_shutdown_timeout_ms/1), so a stop can cut a request off and the
            provider sees a reset for a hook that may be committed.
          slo: "Drain on SIGTERM"
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/ack-slo.md

      - alert: AnkusaTenantOverload
        expr: |
          sum by (job, instance, exported_instance, tenant_id) (
            rate(ankusa_ingest_requests_total{outcome="tenant_overload"}[5m])
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} answers 429 tenant_overload {{ $value | humanize }} times a second"
          description: >-
            One tenant has used its whole share of the batchers on {{ $labels.instance }} for 10
            minutes. Other tenants are unaffected; this one is being refused. Without a tenant_id
            label the node runs with metrics.detail: none.
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/tenant-overload.md

  - name: ankusa.delivery
    rules:
      - alert: AnkusaDeliveryLatencySLOBreach
        expr: |
          histogram_quantile(0.99,
            sum by (le, job, instance, exported_instance, sink) (
              rate(ankusa_delivery_latency_seconds_bucket{result="ok"}[10m])
            )
          ) > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.sink }} deliveries settle with p99 {{ $value | humanizeDuration }} (target 5 s)"
          description: >-
            Deliveries to {{ $labels.sink }} from {{ $labels.instance }} take longer than 5 seconds
            from receipt to confirmation at the 99th percentile, retries and backoff included.
          slo: "Delivery latency, healthy sinks (received → confirmed)"
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/backlog-age.md

      - alert: AnkusaBacklogStale
        expr: ankusa_queue_oldest_due_age_seconds > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} has a delivery that has been due for {{ $value | humanizeDuration }}"
          description: >-
            The oldest due row on {{ $labels.instance }} has waited more than 5 minutes: dispatch is
            stopped, saturated or blocked behind a sink.
          slo: "Backlog age (oldest due row)"
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/backlog-age.md

      - alert: AnkusaBreakerOpen
        expr: ankusa_dispatch_breakers_open > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} has {{ $value }} open sink breaker(s)"
          description: >-
            At least one destination on {{ $labels.instance }} has had its circuit breaker open for
            5 minutes: its deliveries are parked, not attempted.
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/breaker-open.md

      - alert: AnkusaDLQGrowing
        expr: delta(ankusa_dlq_rows[1h]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} dead-lettered {{ $value }} more deliveries in the last hour"
          description: >-
            The dead-letter queue on {{ $labels.instance }} has grown for 15 minutes: deliveries are
            giving up. A steady DLQ is not alerting; a growing one is a sink or a config fault.
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/dlq-growth.md

      - alert: AnkusaDLQFull
        expr: ankusa_dlq_full > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} refuses new hooks: the DLQ is over its ceiling"
          description: >-
            The dead-letter queue on {{ $labels.instance }} is over queue.dlq.max_rows or max_bytes
            with no archived row left to evict, so new hooks get 503 dlq_full.
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/dlq-growth.md

  - name: ankusa.store
    rules:
      - alert: AnkusaDiskLow
        expr: ankusa_disk_free_bytes / ankusa_disk_total_bytes < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} has {{ $value | humanizePercentage }} of its data volume free"
          description: >-
            The file system holding data_dir on {{ $labels.instance }} is below 10 % free. At zero
            the store cannot commit and every hook is a 503.
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/disk-full.md

      - alert: AnkusaBackupStale
        expr: ankusa_backup_age_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} last backed up {{ $value | humanizeDuration }} ago"
          description: >-
            The last successful checkpoint upload from {{ $labels.instance }} is more than 5 minutes
            old: the data a lost host would take with it.
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/backup-stale.md

      - alert: AnkusaStoreWriteFailures
        expr: |
          ankusa_store_write_failures_total
          - (ankusa_store_write_failures_total offset 5m or ankusa_store_write_failures_total * 0)
          > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} failed {{ $value }} store write(s) of class {{ $labels.class }}"
          description: >-
            A write to the store on {{ $labels.instance }} failed in the last 5 minutes
            (class {{ $labels.class }}). Hooks it could not commit were answered 503, never acked.
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/store-write-failed.md

      - alert: AnkusaStoreUnavailable
        expr: ankusa_store_unavailable_seconds > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}'s store has been closed for {{ $value | humanizeDuration }}"
          description: >-
            The store on {{ $labels.instance }} is closed and retrying its open; every request is a
            503 store_unavailable until it is back.
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/store-write-failed.md

  - name: ankusa.node
    rules:
      - alert: AnkusaSubtreeDown
        expr: |
          ankusa_instance_subtree_down_total
          - (ankusa_instance_subtree_down_total offset 10m or ankusa_instance_subtree_down_total * 0)
          > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}'s {{ $labels.domain }} subtree went down"
          description: >-
            The {{ $labels.domain }} failure domain of {{ $labels.exported_instance }} on
            {{ $labels.instance }} exhausted its restart budget in the last 10 minutes and is
            waiting out a backoff of up to 60 s. Hooks wait in the store meanwhile.
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/node-unready.md

      - alert: AnkusaIntakeFailures
        expr: |
          ankusa_intake_failures_total
          - (ankusa_intake_failures_total offset 5m or ankusa_intake_failures_total * 0)
          > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} failed {{ $value }} intake log publish(es) ({{ $labels.class }})"
          description: >-
            A publish to the intake log from {{ $labels.instance }} failed in the last 5 minutes
            (class {{ $labels.class }}). Three in a row open the breaker and every hook becomes a
            503 intake_unavailable.
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/intake-down.md

      - alert: AnkusaIntakeNotReady
        expr: ankusa_intake_ready == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}'s intake breaker is not closed"
          description: >-
            The intake log breaker on {{ $labels.instance }} has not been closed for a minute: with
            wal.type: dual the node refuses hooks (503 intake_unavailable) while the log does not
            answer.
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/intake-down.md

      - alert: AnkusaIntakeReconcileStuck
        expr: ankusa_intake_reconcile_stuck > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} holds {{ $value }} hook(s) the reconciler cannot finish"
          description: >-
            A hook on {{ $labels.instance }} is persisted in the store but not confirmed in the
            intake log, and the reconciler has not been able to complete it for 5 minutes.
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/intake-down.md

      - alert: AnkusaMemoryGrowth
        expr: |
          min_over_time(ankusa_vm_memory_bytes[30m])
          > 1.05 * min_over_time(ankusa_vm_memory_bytes[30m] offset 1h)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}'s memory has grown more than 5 % an hour for an hour"
          description: >-
            The low-water mark of the Erlang VM's memory on {{ $labels.instance }} is more than 5 %
            above where it was an hour earlier, and has been for an hour: a leak, not a spike.
          slo: "Memory growth, 1 h soak at target rate"
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/memory-growth.md

  # Counting every series of a target is the most expensive query here; five
  # minutes between evaluations is plenty for a bound that moves over days.
  - name: ankusa.cardinality
    interval: 5m
    rules:
      - alert: AnkusaMetricsSeriesOverBudget
        expr: count by (job, instance) ({__name__=~"ankusa_.+"}) > 10000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} exposes {{ $value }} ankusa_ series (budget 10 000)"
          description: >-
            One node's /metrics carries more than 10 000 series. The budget is independent of the
            number of tenants, so a label that follows tenants or sources has escaped the
            cardinality policy (metrics.detail, metrics.max_series_per_metric).
          slo: "`/metrics` size"
          runbook_url: https://github.com/jamescarr/ankusa/blob/main/docs/runbooks/metrics-cardinality.md
