# Front door for the fleet in docker-compose.fleet.yml.
#
# Two listeners, two policies:
#
#   4000  ingest. Round-robined across the edge replicas, no auth: a provider
#         authenticates by signing the body, and Ankusa verifies that signature.
#         Access control for who may POST here belongs to the provider's own
#         configuration (a per-source secret), not to this proxy.
#
#   4002  admin API and /metrics. This is the surface Ankusa ships
#         unauthenticated (health, config, DLQ, quarantine, metrics) because it
#         cannot know your identity provider. So the proxy authenticates. Swap
#         basic auth for oauth2-proxy, your SSO, or mTLS — anything that sets an
#         identity — and keep the rule: 4002 is never reachable without one.
#
# The comment on each block is the reason it exists; deleting one is a decision
# about the security model, not a cleanup.

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Docker's embedded DNS. With a variable in proxy_pass, nginx re-resolves per
  # request, so scaling `edge` up or down is picked up without a reload —
  # a plain `upstream` block would pin whatever IPs it resolved at startup.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 4000;

    location / {
      set $edge http://edge:4000;
      proxy_pass $edge;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Hooks are small but the limit is the edge's `max_body_bytes`; nginx
      # should not be the thing that rejects a legitimate one.
      client_max_body_size 16m;
    }
  }

  server {
    listen 4002;

    auth_basic "ankusa admin";
    auth_basic_user_file /etc/nginx/htpasswd;

    location / {
      set $worker http://worker:4002;
      proxy_pass $worker;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
