# A reference fleet, and the reference answer to "where does authentication go?"
#
#   docker compose -f ankusa_server/compose/docker-compose.fleet.yml up -d --wait
#
# The image is the published one; to run a local build, set
# ANKUSA_IMAGE=jamescarr/ankusa:dev (built by `mise run docker:build`).
#
#   topology : two `edge` replicas in front, one `dispatch,storage` worker
#              behind, one Postgres WAL shared by all of them
#   auth     : nginx. Ingest (4000) is open — providers sign their own hooks.
#              The admin API (4002) is behind basic auth, which is the whole
#              point of this file.
#   proof    : POST /webhooks/demo twice. The second returns 200 duplicate even
#              though it may land on the other edge replica — dedup lives in the
#              shared Postgres WAL, not in either node's memory.
#
# Only nginx publishes ports. The Ankusa services are reachable on the compose
# network and nowhere else, so there is no way to reach an admin API by
# accident.
#
# Credentials here are examples: replace compose/htpasswd (and the Postgres
# password) before this faces anything real. Regenerate the password file with
#
#   docker run --rm httpd:2.4-alpine htpasswd -nbB admin 'your-password'

x-ankusa: &ankusa
  image: ${ANKUSA_IMAGE:-jamescarr/ankusa:latest}
  volumes:
    # The fleet config: shared Postgres WAL plus the credential-free demo
    # source.
    - ../config-examples/fleet-postgres-s3.yml:/etc/ankusa/ankusa.yml:ro
  environment: &ankusa-env
    ANKUSA_WAL_POSTGRES_URL: postgres://ankusa:ankusa@postgres:5432/ankusa
    # The mounted config asks for S3; keep the demo self-contained.
    ANKUSA_STORAGE_TYPE: local
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ankusa
      POSTGRES_PASSWORD: ankusa
      POSTGRES_DB: ankusa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ankusa -d ankusa"]
      interval: 2s
      timeout: 3s
      retries: 30
    # No volume: this is a demo, and `down -v` should leave nothing behind.
    restart: unless-stopped

  edge:
    <<: *ankusa
    environment:
      <<: *ankusa-env
      ANKUSA_ROLES: edge
    deploy:
      replicas: 2

  worker:
    <<: *ankusa
    environment:
      <<: *ankusa-env
      ANKUSA_ROLES: dispatch,storage

  nginx:
    image: nginx:alpine
    ports:
      - "4000:4000" # ingest: no auth, the providers sign their hooks
      - "4002:4002" # admin API: basic auth below
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - edge
      - worker
    restart: unless-stopped
