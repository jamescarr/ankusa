# Every key in the schema, at its default, with the alternatives next to it.
# This file loads as-is: copy it, delete what you don't use, and replace the
# ${VAR}s with your own.
#
# Env vars referenced here (all supplied by config-examples' test fixture, and
# by you in production):
#
#   ANKUSA_WAL_POSTGRES_URL   S3_BUCKET  S3_REGION  S3_ENDPOINT
#   AWS_ACCESS_KEY_ID         AWS_SECRET_ACCESS_KEY  GCS_BUCKET
#   STRIPE_WHSEC  SINK_URL  RABBITMQ_URL
#   RABBITMQ_EXCHANGE         KAFKA_BROKERS  KAFKA_TOPIC  KAFKA_USERNAME
#   KAFKA_SASL_PASSWORD       NATS_SERVERS  NATS_SUBJECT  NATS_USERNAME
#   NATS_PASSWORD             STANDARD_WEBHOOKS_SECRET   GITHUB_WEBHOOK_SECRET
#
# Anything you can also set with an ANKUSA_* env var is marked [env]; env wins
# over this file, which is how a container gets reconfigured without a rebuild.

node:
  # [env ANKUSA_ROLES] which OTP roles run here. One all-roles process is fine
  # to start with; split for scale (edge in front, dispatch+storage behind).
  roles: [edge, dispatch, storage]
  # [env ANKUSA_DATA_DIR] WAL, quarantine, DLQ, and local segments land here.
  data_dir: /var/lib/ankusa

log:
  # [env ANKUSA_LOG_LEVEL] debug | info | warning | error
  level: info

http:
  # [env ANKUSA_HTTP_PORT, else PORT] the ingest listener.
  port: 4000
  max_body_bytes: 8000000
  # path        -> POST /webhooks/:source_id
  # tenant_path -> POST /webhooks/:tenant_id/:source_id (tenant from the URL)
  routing: path
  # Segments before the source id. "/" means no prefix.
  prefix: /webhooks

admin:
  # The operator API (health, /metrics, /v1/config, DLQ, quarantine). The image
  # defaults this on because it is the only way to operate a container without
  # an Elixir shell; core's default for embedded users is false.
  enabled: true
  # [env ANKUSA_ADMIN_PORT] unauthenticated — do not publish it.
  port: 4002

batcher:
  # Both WALs serialize commits themselves, so partitions beyond a couple only
  # add contention.
  partitions: 2
  max_batch: 256
  # 0 = commit as soon as a batch is ready; the WAL append runs in a task, so
  # raising this trades a little ack latency for larger batches.
  max_delay_ms: 0
  # Full queue = shed load with 503 rather than grow without bound. Counts
  # buffered *and* in-flight records.
  max_queue: 10000

dispatch:
  poll_ms: 200
  batch: 128
  # Max sink deliveries in flight at once. Keep Req's Finch pool (default 50)
  # at least this large when using the http sink.
  concurrency: 32
  # Admitted-but-unfinished envelopes, and the max sum of their body bytes:
  # bounds what a stalled destination can hold.
  max_inflight: 4096
  max_inflight_bytes: 134217728
  retry:
    base_ms: 100
    max_ms: 30000
    max_attempts: 12
    # Full jitter: delay is multiplied by a random factor in [0.5, 1.0].
    jitter: true
  # Logical dispatch partitions: one receiver and one consumer each, so every
  # copy of an event queues in front of a single consumer. Raise it only when
  # you also raise the number of dispatchers.
  partitions: 1
  # How long the idempotent receiver remembers an event it has delivered.
  # Measured between the records' commit timestamps, never against the wall
  # clock at dispatch time.
  dedup_ttl_ms: 604800000
  # Where that ledger lives. `ets` is per-dispatcher (a failover re-delivers
  # what it had not); `ra` keeps it in the WAL cluster's replicated state, so it
  # survives a failover, at one consensus round trip per record.
  dedup_store: ets

wal:
  # [env ANKUSA_WAL_TYPE] disk | postgres
  #   disk     — local append-only log; survives process crash and power loss on
  #              this host, not the loss of the host.
  #   postgres — shared log; the same WAL for a whole fleet of edge nodes.
  type: disk
  postgres:
    # A connection URL, or the discrete keys below — never both.
    url: "${ANKUSA_WAL_POSTGRES_URL}"
    # host: postgres
    # port: 5432
    # username: ankusa
    # password: "${POSTGRES_PASSWORD}"
    # database: ankusa
    pool_size: 10
    ssl: false
    # Run the adapter's DDL bootstrap on boot. Set false if you migrate
    # separately.
    migrate: true

storage:
  # [env ANKUSA_STORAGE_TYPE] local | s3 | gcs
  type: local
  # Segment rollover: whichever comes first.
  roll_bytes: 16777216
  roll_ms: 30000
  # Used only when type: s3. Omit access_key_id/secret_access_key to fall back
  # to AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (static keys only: instance
  # profiles and IRSA are not supported by this adapter yet).
  s3:
    bucket: "${S3_BUCKET}"
    region: "${S3_REGION}"
    endpoint: "${S3_ENDPOINT}"
    access_key_id: "${AWS_ACCESS_KEY_ID}"
    secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
  # Used only when type: gcs.
  gcs:
    bucket: "${GCS_BUCKET}"
    endpoint: https://storage.googleapis.com
    # metadata — take tokens from the GCE/GKE instance metadata server.
    # token    — use the static token below.
    # none     — send no credentials (an emulator).
    auth: metadata
    # token: "${GCS_TOKEN}"   # required iff auth: token

claim_check:
  # [env ANKUSA_CLAIM_CHECK_PORT] the gateway listener (:claim_check role).
  port: 4001
  # Target size of one pack object; a body larger than this still gets a pack
  # of its own. Core defaults this to 16 MiB.
  pack_max_bytes: 16777216
  # LocalFS retention only. nil disables the sweeper; use a bucket lifecycle
  # rule for S3/GCS.
  retention_days: null
  # The gateway performs no authentication. Keep 4001 internal and put your
  # proxy, mesh, or network policy in front of it, the same as 4002.

sources:
  # One source per provider endpoint. The id is the catch-URL segment:
  # POST /webhooks/stripe here.
  stripe:
    # Scopes dedup and storage. With routing: tenant_path the URL wins.
    tenant: default
    # reject | quarantine | accept_flag (what happens when verification fails)
    on_verify_failure: reject
    # none | stripe | github | standard_webhooks | shopify | slack | hmac.
    # Every type except none requires secret; stripe, standard_webhooks, and
    # slack also take tolerance_seconds (default 300). hmac takes the
    # descriptor keys shown on the `custom` source below.
    verify:
      type: stripe
      secret: "${STRIPE_WHSEC}"
      tolerance_seconds: 300
    # What dispatch does with a provider's retry: `auto` dedups on the key
    # `dedup_key` extracts, `none` delivers every copy (and without this key,
    # `auto` is the default).
    dedup: auto
    # rules | stripe | github. rules takes header and/or json_path
    # (a dot path into the JSON body); with neither, it tries the `webhook-id`
    # header then JSON `id`.
    dedup_key:
      type: rules
      header: webhook-id
      json_path: data.id
    # At least one. Every sink is tried on every delivered hook.
    sinks:
      - {type: log}
      - type: http
        url: "${SINK_URL}"
        # post | put | patch
        method: post
        timeout_ms: 5000
        # true = one delivery at a time per {tenant_id, source_id}, in seq
        # order. Default false: deliveries to this sink run concurrently.
        # ordered: false
        headers:
          x-ankusa-env: prod
      - type: rabbitmq
        url: "${RABBITMQ_URL}"
        exchange: "${RABBITMQ_EXCHANGE}"
        # topic | direct | fanout | headers
        exchange_type: topic
        routing_key: "ankusa.stripe"
        inline_max_bytes: 8192
      - type: kafka
        # A list of host:port, or one comma-separated string — so
        # `brokers: "${KAFKA_BROKERS}"` takes "host:port,host:port" from env.
        brokers: ["${KAFKA_BROKERS}"]
        topic: "${KAFKA_TOPIC}"
        # Static string only (a fun is an embedding API, not a config surface).
        key: stripe
        inline_max_bytes: 8192
        # Omit both to talk to a plaintext broker.
        ssl: false
        sasl:
          # plain | scram_sha_256 | scram_sha_512
          mechanism: plain
          username: "${KAFKA_USERNAME}"
          password: "${KAFKA_SASL_PASSWORD}"
      - type: nats
        # A list of host:port, or one comma-separated string — so
        # `servers: "${NATS_SERVERS}"` takes "host:port,host:port" from env.
        # More than one is failover order, not fan-out.
        servers: ["${NATS_SERVERS}"]
        # A subject, not a stream: the sink never creates one, so a stream that
        # covers this subject has to exist.
        subject: "${NATS_SUBJECT}"
        inline_max_bytes: 8192
        # How long to wait for JetStream's publish ack.
        publish_timeout_ms: 5000
        tls: false
        # Exactly one scheme: username/password, token, or nkey_seed (+ jwt).
        # Omit the block for a server that needs no credentials.
        auth:
          username: "${NATS_USERNAME}"
          password: "${NATS_PASSWORD}"

  # A second source, showing the other verifier and the quarantine policy.
  standard:
    verify: {type: standard_webhooks, secret: "${STANDARD_WEBHOOKS_SECRET}"}
    dedup_key: {type: rules}
    on_verify_failure: quarantine
    sinks: [{type: log}]

  github:
    verify: {type: github, secret: "${GITHUB_WEBHOOK_SECRET}"}
    dedup_key: {type: github}
    on_verify_failure: accept_flag
    sinks: [{type: log}]

  # Verify nothing at all. Useful behind a trusted network, or as the demo the
  # image ships with.
  open:
    verify: {type: none}
    on_verify_failure: accept_flag
    sinks: [{type: log}]

  # Any other body-HMAC provider, described inline instead of named. `signed`
  # is quoted — unquoted `{body}` would parse as a YAML flow map.
  # custom:
  #   verify:
  #     type: hmac
  #     secret: "${CUSTOM_WEBHOOK_SECRET}"
  #     signature_header: "X-Custom-Signature"
  #     signed: "{body}"
  #     hash: sha256            # sha256 | sha512 | sha1
  #     encoding: hex           # hex | base64
  #     sig_prefix: "sha256="
  #     timestamp_header: "X-Custom-Timestamp"
  #     tolerance_seconds: 300
  #   sinks: [{type: log}]
