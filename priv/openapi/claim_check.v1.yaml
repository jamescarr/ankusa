openapi: 3.2.0
info:
  title: Ankusa Claim Check Gateway
  version: 1.0.0
  summary: Check bytes in, get a ticket. Present the ticket, get the bytes back.
  description: |
    HTTP surface of the `:claim_check` role. This document is the
    cross-language contract. The Elixir code conforms to it, not the reverse.

    This API performs no authentication or authorization. Deployers secure it
    at their own boundary (network policy, a proxy, a service mesh). The
    tenant is in the path so an external policy layer can authorize by route
    without reading bodies.
servers:
  - url: http://localhost:4001
    description: Local development listener (default `claim_check.port`).
security: []
tags:
  - name: claims
    description: Check in and redeem claims.
  - name: operations
    description: Health and self-description.
paths:
  /v1/claims/{tenant_id}/{id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ClaimId'
    put:
      operationId: checkInClaim
      tags: [claims]
      summary: Check in a claim
      description: |
        Stores the raw request body under a key derived from `tenant_id` and
        `id`. Idempotent: repeating the same request overwrites the same
        object. The ticket is returned only after a durable write.
      parameters:
        - name: x-ankusa-sha256
          in: header
          required: false
          description: Expected lowercase hex SHA-256 of the body. A mismatch returns 422.
          schema:
            $ref: '#/components/schemas/Sha256'
      requestBody:
        required: true
        description: |
          Raw bytes, at most `claim_check.max_bytes`. The request
          `content-type`, if any, is recorded in the ticket as advisory
          metadata only.
        content:
          '*/*': {}
      responses:
        '201':
          description: Claim stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/IntegrityMismatch'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
    get:
      operationId: redeemClaim
      tags: [claims]
      summary: Redeem a claim
      description: |
        Returns the stored bytes. The server does not verify integrity. The
        redeemer MUST check `size` and `sha256` against its ticket.
      responses:
        '200':
          description: The claim's bytes.
          content:
            application/octet-stream: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /v1/openapi.yaml:
    get:
      operationId: getOpenApiDocument
      tags: [operations]
      summary: This document
      responses:
        '200':
          description: The OpenAPI document served by this node.
          content:
            application/yaml: {}
  /health:
    get:
      operationId: getHealth
      tags: [operations]
      summary: Liveness probe
      responses:
        '200':
          description: The listener is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: |
        Any non-empty UTF-8 string, percent-encoded in the path. The server
        enforces a 256-byte limit on the decoded value (JSON Schema
        `maxLength` counts characters, not bytes).
      schema:
        type: string
        minLength: 1
    ClaimId:
      name: id
      in: path
      required: true
      description: Caller-supplied RFC 9562 UUIDv7, lowercase and hyphenated.
      schema:
        $ref: '#/components/schemas/UUIDv7'
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
  schemas:
    UUIDv7:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      examples: ['0199a1c2-7b3e-7d4a-9c1f-2e5b8a6d4f10']
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    Ticket:
      type: object
      description: |
        Canonical, versioned claim ticket. Shared by the HTTP API, the
        RabbitMQ `claim` field, and every redeemer. Carries no storage key.
      required: [v, tenant_id, id, size, sha256]
      additionalProperties: false
      properties:
        v:
          description: Format indicator. Redeemers reject any other value.
          const: 1
        tenant_id:
          type: string
          minLength: 1
        id:
          $ref: '#/components/schemas/UUIDv7'
        size:
          type: integer
          minimum: 0
        sha256:
          $ref: '#/components/schemas/Sha256'
        content_type:
          description: Advisory only. Never stored as object metadata.
          type: [string, 'null']
      examples:
        - v: 1
          tenant_id: acme
          id: 0199a1c2-7b3e-7d4a-9c1f-2e5b8a6d4f10
          size: 3145728
          sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          content_type: application/json
    TicketEnvelope:
      type: object
      required: [ticket]
      additionalProperties: false
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_tenant
            - invalid_id
            - not_found
            - too_large
            - integrity_mismatch
            - store_unavailable
    Health:
      type: object
      required: [status]
      properties:
        status:
          const: ok
  responses:
    BadRequest:
      description: '`invalid_tenant` or `invalid_id`. Permanent.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`not_found`. Permanent. Dead-letter, do not requeue.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: '`too_large`. Body exceeds `claim_check.max_bytes`. Permanent.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IntegrityMismatch:
      description: '`integrity_mismatch`. Body does not match `x-ankusa-sha256`. Permanent.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StoreUnavailable:
      description: '`store_unavailable`. Transient. Retry.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'