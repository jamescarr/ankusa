openapi: 3.2.0
info:
  title: Ankusa Ingest API
  version: 1.0.0
  summary: Point a provider's webhook at a catch URL, get an honest 2xx.
  description: |
    HTTP surface of the `:edge` role. This document is the cross-language
    contract for webhook *senders*: the Elixir code conforms to it, not the
    reverse.

    The core invariant is visible in the status codes: a `2xx` is never
    returned until the hook is durably in the WAL. `202` with
    `status: accepted` means committed and due for dispatch; `202` with
    `status: quarantined` means the source's `on_verify_failure` policy kept a
    failed-verification hook for an operator instead of rejecting it. A copy of
    an event that was already delivered is filtered out at dispatch, not at the
    ack, so the sender is not told which of its retries was the duplicate.

    There is no request authentication here beyond provider signature
    verification, which is webhook semantics rather than access control: the
    source's configured verifier (Stripe, GitHub, Standard Webhooks, or none)
    checks the provider's own signature header over the exact raw body.

    The catch-URL shape is pluggable (`Ankusa.RouteResolver`). The two paths
    below are the shipped resolvers: `.../webhooks/{source_id}` (single-tenant,
    the default) and `.../webhooks/{tenant_id}/{source_id}` (the tenant is
    authoritative from the path).
servers:
  - url: http://localhost:4000
    description: Local development listener (default `port`).
security: []
tags:
  - name: ingest
    description: Accept a provider's webhook.
  - name: operations
    description: Health and self-description.
paths:
  /webhooks/{source_id}:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    post:
      operationId: ingestHook
      tags: [ingest]
      summary: Ingest a hook for a source
      description: |
        The default catch URL (`Ankusa.RouteResolver.Path`, prefix
        `webhooks`). The tenant comes from the source config.
      requestBody:
        required: true
        description: |
          The provider's exact raw bytes, at most `max_body_bytes`. Signature
          verification runs over these bytes verbatim, so any transformation
          (JSON re-encoding, whitespace) invalidates the signature.
        content:
          '*/*': {}
      responses:
        '202':
          $ref: '#/components/responses/AcceptedOrQuarantined'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/VerificationFailed'
        '404':
          $ref: '#/components/responses/UnknownSource'
        '413':
          $ref: '#/components/responses/TooLarge'
        '503':
          $ref: '#/components/responses/Overloaded'
  /webhooks/{tenant_id}/{source_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SourceId'
    post:
      operationId: ingestHookForTenant
      tags: [ingest]
      summary: Ingest a hook for a tenant's source
      description: |
        The multi-tenant catch URL (`Ankusa.RouteResolver.TenantPath`, prefix
        `webhooks`). The tenant in the path is authoritative: it scopes dedup
        and storage, and overrides the source's configured tenant.
      requestBody:
        required: true
        description: The provider's exact raw bytes, at most `max_body_bytes`.
        content:
          '*/*': {}
      responses:
        '202':
          $ref: '#/components/responses/AcceptedOrQuarantined'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/VerificationFailed'
        '404':
          $ref: '#/components/responses/UnknownSource'
        '413':
          $ref: '#/components/responses/TooLarge'
        '503':
          $ref: '#/components/responses/Overloaded'
  /health:
    get:
      operationId: getHealth
      tags: [operations]
      summary: Liveness probe
      description: |
        Always `200` while the listener is up. The embedded WAL stats are `{}`
        when the WAL is unreachable.
      responses:
        '200':
          description: The listener is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /stats:
    get:
      operationId: getStats
      tags: [operations]
      summary: WAL statistics for this node
      responses:
        '200':
          description: This node's own WAL stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
components:
  parameters:
    SourceId:
      name: source_id
      in: path
      required: true
      description: |
        A declared `Ankusa.Source` id. An undeclared id is a `404
        unknown_source`, not an auto-created source.
      schema:
        type: string
        minLength: 1
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: |
        Any non-empty UTF-8 string. Percent-encoded in the path.
      schema:
        type: string
        minLength: 1
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
  schemas:
    Accepted:
      type: object
      description: |
        The hook is durably committed and will be dispatched. A copy of an event
        that was already delivered is dropped by the idempotent receiver in
        front of dispatch — this response does not tell the sender that.
      
      required: [status, id, seq]
      properties:
        status:
          const: accepted
        id:
          type: string
          description: |
            The envelope id Ankusa assigned to this hook (a UUIDv7), generated
            on receipt. Unrelated to the provider's own event id.
        seq:
          type: integer
          minimum: 1
          description: WAL sequence number, strictly increasing across commits.
    Quarantined:
      type: object
      required: [status, reason]
      properties:
        status:
          const: quarantined
        reason:
          type: string
          description: |
            `inspect/1` of the verifier's failure reason, e.g. `:no_match`.
      description: |
        Verification failed and the source's `on_verify_failure` is
        `quarantine`.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - unknown_source
            - verification_failed
            - payload_too_large
            - body_read_failed
            - not_found
            - overload
            - store_unavailable
        reason:
          type: string
          description: Present on `verification_failed` and `body_read_failed`.
        limit:
          type: integer
          description: Present on `payload_too_large`; the configured `max_body_bytes`.
    Health:
      type: object
      required: [status, instance, wal]
      properties:
        status:
          const: ok
        instance:
          type: string
        wal:
          type: object
          description: Adapter-defined WAL stats, `{}` when the WAL is unreachable.
    Stats:
      type: object
      required: [instance, wal]
      properties:
        instance:
          type: string
        wal:
          type: object
  responses:
    AcceptedOrQuarantined:
      description: |
        `202`. Accepted, and durably committed before this response was sent.
        `status: accepted` means it will be dispatched; `status: quarantined`
        means the source's `on_verify_failure` policy held it back for an
        operator. There is no `201` and no `200`/duplicate: every copy a
        provider sends is appended to the log and acked with its own envelope
        id, and a provider's retry is filtered out at dispatch rather than at
        the ack.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Accepted'
              - $ref: '#/components/schemas/Quarantined'
    BadRequest:
      description: '`400`. `body_read_failed`: the body could not be read at all (client disconnect, read timeout). Retry.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VerificationFailed:
      description: |
        `401`. `verification_failed`. When `reason` starts with
        `{:quarantine_rate_limited,`, the source's policy would have quarantined
        the hook but the quarantine rate limit was hit: transient, retry later.
        Any other `reason` is a failed signature verification — permanent for
        this body, do not retry unchanged.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnknownSource:
      description: '`404`. `unknown_source`. Permanent; the catch URL names no declared source.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: '`413`. `payload_too_large`. Permanent; body exceeds `max_body_bytes`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Overloaded:
      description: |
        `503`. `overload` (batcher queue full: the edge sheds load rather than
        growing without bound) or `store_unavailable` (WAL write failed).
        Transient — retry after the `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
