name: Release (Clojars)

# Tag-driven Clojars publish for packages/sdk-clojure (published as
# `io.github.jamescarr/ankusa-clj`), the same shape as release-maven.yml — its
# own tag prefix, `sdk-clojure-v*` (the directory name), distinct from the Hex
# core package's `ankusa-v*` and the other SDKs' prefixes. Tagged by
# `mise run release:tag sdk-clojure`.
#
# `clojure -T:build jar` builds the jar and POM with tools.build, then
# `clojure -T:build deploy` uploads that same jar with deps-deploy. The deploy
# step never rebuilds, so the jar that was attested is the jar that is uploaded.
#
# Two repository secrets, because Clojars has no OIDC trusted publishing:
#   CLOJARS_USERNAME  the Clojars account that owns the group.
#   CLOJARS_PASSWORD  a Clojars deploy token for that account (not the account
#                     password), from clojars.org -> Dashboard -> Deploy Tokens.
# One-time setup: a Clojars account with the `io.github.jamescarr` group
# verified through GitHub (clojars.org/verify/group). docs/releasing.md lists
# them.

on:
  push:
    tags:
      - "sdk-clojure-v*"

concurrency:
  group: release-clojars-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          source .mise/lib/pkg.sh
          PKG=$(pkg_from_tag "$GITHUB_REF_NAME")
          [ "$(pkg_kind "$PKG")" = clojure ] || fail "$GITHUB_REF_NAME is not a Clojure (Clojars) package tag"
          VERSION="${GITHUB_REF_NAME#"$PKG"-v}"
          PKG_VERSION=$(pkg_version "$PKG")
          [ "$PKG_VERSION" = "$VERSION" ] || fail "tag $VERSION != $(pkg_dir "$PKG")/build.clj $PKG_VERSION"
          pkg_has_heading "$PKG" "$VERSION" || fail "$(pkg_dir "$PKG")/CHANGELOG.md has no '## [$VERSION]' heading"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  ci:
    name: Run full test suite
    needs: resolve
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build, upload to Clojars, + GitHub release
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace the workflow's rather than extending
      # them, so `contents: write` has to be repeated here or `gh release
      # create` below gets a 403. The other three are what actions/attest
      # needs: id-token to mint the Sigstore certificate, attestations to
      # persist the attestation, artifact-metadata for the storage record.
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.11
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}" # the default key skips .mise/conf.d/
          # Pinned to .mise/conf.d/sdk-clojure.toml's java and clojure, the
          # toolchain `mise run check:package sdk-clojure` built and tested with.
          install_args: java clojure

      - name: Build the jar
        working-directory: packages/sdk-clojure
        run: clojure -T:build jar

      - uses: actions/attest@v4
        with:
          # No predicate input, so this is SLSA build provenance for the exact
          # bytes about to be uploaded.
          subject-path: |
            packages/sdk-clojure/target/ankusa-clj-${{ needs.resolve.outputs.version }}.jar
            packages/sdk-clojure/target/classes/META-INF/maven/io.github.jamescarr/ankusa-clj/pom.xml

      - name: Upload to Clojars
        working-directory: packages/sdk-clojure
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -T:build deploy

      - name: Wait for repo.clojars.org
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          source .mise/lib/pkg.sh
          # Clojars serves a deploy as soon as it lands, but a CDN in front of
          # it may hold a 404 cached from an earlier probe for a few minutes.
          tries=0
          while [ "$tries" -lt 20 ]; do
            code=$(pkg_registry_code sdk-clojure "$VERSION")
            [ "$code" = 200 ] && { echo "repo.clojars.org serves sdk-clojure $VERSION"; exit 0; }
            tries=$((tries + 1))
            sleep 30
          done
          fail "repo.clojars.org never served sdk-clojure $VERSION (last HTTP $code)"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          source .mise/lib/pkg.sh && pkg_notes sdk-clojure "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
