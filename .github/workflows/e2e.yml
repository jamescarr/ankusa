name: E2E

# The end-to-end proofs that need a whole deployment, not a package: they run
# nightly, on demand, and on every release tag, never on an ordinary push.
#
#   fleet : examples/fleet-e2e/run.sh. Load balancer -> two edge nodes ->
#           shared bucket and claim-check gateway -> consumer, with a node
#           killed mid-run and a provider retry sent to the other node. It also
#           runs on a pull request that touches the example, so a change to it
#           is proven before it merges.
#   kind  : `mise run e2e`. The Oban consumer on a kind cluster, pods killed.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    tags: ["*-v*"]
  pull_request:
    paths:
      - ".github/workflows/e2e.yml"
      - "examples/fleet-e2e/**"
      - "tools/loadgen/**"
      - "packages/ankusa_server/Dockerfile"

jobs:
  fleet:
    name: fleet end to end (compose)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      ANKUSA_IMAGE: ankusa-fleet-e2e:local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}" # the default key skips .mise/conf.d/
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The server image is the slow part (RocksDB compiles); run.sh is told to
      # skip its own `docker build` and use this one.
      - name: Build the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/ankusa_server/Dockerfile
          load: true
          tags: ${{ env.ANKUSA_IMAGE }}
          cache-from: type=gha,scope=fleet-e2e
          cache-to: type=gha,mode=max,scope=fleet-e2e
      - run: mix local.hex --force && mix local.rebar --force
      - name: examples/fleet-e2e/run.sh
        run: BUILD_ANKUSA=0 examples/fleet-e2e/run.sh
      # The host-loss drill of `wal.type: dual` (ADR 0002): a node and its volume lost
      # under load, the intake brokers stopped, a restore from the secondary backup alone;
      # and its control, which must see `disk` lose the hooks acked since the last backup.
      - name: examples/fleet-e2e/run.sh --wal dual --kill-node
        run: BUILD_ANKUSA=0 examples/fleet-e2e/run.sh --wal dual --kill-node
      - name: examples/fleet-e2e/run.sh --wal disk --kill-node
        run: BUILD_ANKUSA=0 examples/fleet-e2e/run.sh --wal disk --kill-node
      - name: Keep the load generator's reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fleet-e2e-reports
          path: examples/fleet-e2e/.e2e-out/
          if-no-files-found: ignore

  kind:
    name: kind + Oban end to end
    # Heavy, and untouched by a change to the fleet example.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}" # the default key skips .mise/conf.d/
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: mix local.hex --force && mix local.rebar --force
      - run: mise run e2e
      - name: Keep the load generator's reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-e2e-reports
          path: examples/oban-consumer/.e2e-out/
          if-no-files-found: ignore
