name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  OTP_VERSION: "29.0"
  ELIXIR_VERSION: "1.20.4"

jobs:
  ankusa:
    name: ankusa (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      # `--check-locked` rather than a plain `deps.get`: a plain get silently
      # rewrites a stale lock, which is how the lock drifted out of sync with
      # the adapters and examples once already.
      - run: mix deps.get --check-locked
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix docs --warnings-as-errors
      - run: mix hex.build

  ankusa_postgres:
    name: ankusa_postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ankusa
          POSTGRES_PASSWORD: ankusa
          POSTGRES_DB: ankusa_dev
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ankusa -d ankusa_dev"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - working-directory: ankusa_postgres
        run: mix deps.get --check-locked
      - working-directory: ankusa_postgres
        run: mix deps.unlock --check-unused
      - working-directory: ankusa_postgres
        run: mix format --check-formatted
      - working-directory: ankusa_postgres
        run: mix compile --warnings-as-errors
      - working-directory: ankusa_postgres
        run: mix test
      - working-directory: ankusa_postgres
        run: mix docs --warnings-as-errors

  ankusa_rabbitmq:
    name: ankusa_rabbitmq
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports: ["5673:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - working-directory: ankusa_rabbitmq
        run: mix deps.get --check-locked
      - working-directory: ankusa_rabbitmq
        run: mix deps.unlock --check-unused
      - working-directory: ankusa_rabbitmq
        run: mix format --check-formatted
      - working-directory: ankusa_rabbitmq
        run: mix compile --warnings-as-errors
      - working-directory: ankusa_rabbitmq
        run: mix test
      - working-directory: ankusa_rabbitmq
        run: mix docs --warnings-as-errors

  ankusa_kafka:
    name: ankusa_kafka
    needs: ankusa
    runs-on: ubuntu-latest
    # Not a `services:` container: Redpanda needs command-line flags
    # (`--kafka-addr`, `--advertise-kafka-addr`) that `services:` can't pass.
    # `ankusa_kafka/docker-compose.yml` is the same compose file local dev
    # uses. brod's crc32cer NIF builds from source; it needs CMake >= 3.16,
    # which the runner image already has.
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - working-directory: ankusa_kafka
        run: docker compose up -d --wait
      - working-directory: ankusa_kafka
        run: mix deps.get --check-locked
      - working-directory: ankusa_kafka
        run: mix deps.unlock --check-unused
      - working-directory: ankusa_kafka
        run: mix format --check-formatted
      - working-directory: ankusa_kafka
        run: mix compile --warnings-as-errors
      - working-directory: ankusa_kafka
        run: KAFKA_BROKERS=localhost:19092 mix test
      - working-directory: ankusa_kafka
        run: mix docs --warnings-as-errors
      - if: always()
        working-directory: ankusa_kafka
        run: docker compose down -v

  # The server image's project. It path-depends on core and all three adapters,
  # so its compile pulls in brod's crc32cer NIF — the runner's CMake handles
  # that, same as the kafka job. No services: nothing in this project's suite
  # talks to Postgres, RabbitMQ, or Redpanda, and `mix test` starts no instance
  # (config/config.exs turns autostart off in :test).
  ankusa_server:
    name: ankusa_server
    needs: ankusa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - working-directory: ankusa_server
        run: mix deps.get --check-locked
      - working-directory: ankusa_server
        run: mix deps.unlock --check-unused
      - working-directory: ankusa_server
        run: mix format --check-formatted
      - working-directory: ankusa_server
        run: mix compile --warnings-as-errors
      - working-directory: ankusa_server
        run: mix test

  # The examples are the deployable wrappers: path-dep consumers of core and an
  # adapter, plus the TypeScript workers. They are where a lockfile goes stale
  # without anyone noticing, so they assert their locks and compile too — the
  # Kafka one pulls in brod's crc32cer NIF, same as the job above.
  examples:
    name: examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [kafka-sqs-consumer, rabbitmq-consumer]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: examples/${{ matrix.example }}/ingest_app
        run: mix deps.get --check-locked
      - working-directory: examples/${{ matrix.example }}/ingest_app
        run: mix deps.unlock --check-unused
      - working-directory: examples/${{ matrix.example }}/ingest_app
        run: MIX_ENV=prod mix compile --warnings-as-errors
      - working-directory: examples/${{ matrix.example }}/worker
        run: npm ci
      - working-directory: examples/${{ matrix.example }}/worker
        run: npx tsc --noEmit

  # examples/oban-consumer's Elixir projects: no external services needed to
  # compile (the e2e proof against a real kind cluster is a separate local
  # gate — see AGENTS.md and examples/oban-consumer/run.sh).
  oban-example:
    name: oban-example
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - examples/oban-consumer/ingest_app
          - examples/oban-consumer/consumer_app
          - tools/loadgen
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - working-directory: ${{ matrix.project }}
        run: mix deps.get --check-locked
      - working-directory: ${{ matrix.project }}
        run: mix deps.unlock --check-unused
      - working-directory: ${{ matrix.project }}
        run: mix format --check-formatted
      - if: matrix.project != 'tools/loadgen'
        working-directory: ${{ matrix.project }}
        run: MIX_ENV=prod mix compile --warnings-as-errors
      - if: matrix.project == 'tools/loadgen'
        working-directory: ${{ matrix.project }}
        run: mix compile --warnings-as-errors
