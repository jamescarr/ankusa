name: CI

# Every job runs the same `mise run` task you run locally, with the toolchain
# pinned in .mise.toml. The package matrix is discovered from packages/*, so a
# new package (`mise run new:adapter`) needs no edit here; packages that need
# live infrastructure bring up their own docker-compose.yml in check:package.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  discover:
    name: discover packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: discover
        run: source .mise/lib/pkg.sh && echo "packages=$(pkg_json)" >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.11
      - run: mise run lint:workflows
      - run: mise run check:links

  package:
    name: ${{ matrix.package }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.11
      - run: mix local.hex --force && mix local.rebar --force
      - run: mise run check:package ${{ matrix.package }}

  # The deployable wrappers and TypeScript workers: path-dep consumers of the
  # packages, and where a lockfile goes stale without anyone noticing.
  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.11
      - run: mix local.hex --force && mix local.rebar --force
      - run: mise run check:examples

  tools:
    name: tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.11
      - run: mix local.hex --force && mix local.rebar --force
      - run: mise run check:tools
