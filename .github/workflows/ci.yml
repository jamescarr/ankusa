name: CI

# Every job runs the same `mise run` task you run locally, with the toolchain
# pinned in .mise.toml and .mise/conf.d/*.toml. The package matrix is
# discovered from packages/*, so a new package (`mise run new:adapter`) needs no
# edit here; packages that need live infrastructure bring up their own
# docker-compose.yml in check:package.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  discover:
    name: discover packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: discover
        run: source .mise/lib/pkg.sh && echo "packages=$(pkg_json)" >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}" # the default key skips .mise/conf.d/
      - run: mise run lint:workflows
      - run: mise run lint:pins
      - run: mise run check:links

  package:
    name: ${{ matrix.package }}
    needs: discover
    runs-on: ubuntu-latest
    env:
      # Fork PRs get no secrets; skip the login there rather than fail it.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}" # the default key skips .mise/conf.d/
      # `_build` also holds dialyzer's PLTs (`_build/plts`, see each mix.exs), so
      # this key — the OTP/Elixir pins in .mise.toml plus mix.lock — is the PLT
      # cache key: a run rebuilds a PLT only when the toolchain or a dep changed.
      # The PLT also covers the path-dependency `ankusa`, so an adapter that
      # calls a function core newly gained fails dialyzer against a stale PLT:
      # bump the `v` below when that happens (SEC-4: `Ankusa.Crypto.Envelope`;
      # SEC-8: `Ankusa.Verifier.max_tolerance_seconds/0`; SEC-9:
      # `Ankusa.SecretProvider`, `Ankusa.SourceStore.Static.publish/2`; SEC-12:
      # `Ankusa.Verifier.Asymmetric`/`Token`/`ClientCert`, called by the image's
      # loader; TEN-4: `Ankusa.Routes.Store.delete/3` replaced `delete/2`, so
      # the stale PLT made dialyzer crash on `ankusa_redis`'s callback check;
      # TEN-6: `Ankusa.RateLimiter.Store` and `Ankusa.Dedupe.Store` are new
      # behaviours `ankusa_redis` implements, absent from the stale PLT;
      # TEN-8: `Ankusa.Sink.Description` gained `payload` and `computed`, so
      # the stale PLT failed `ankusa_redis`'s `describe/2` callback check;
      # TEN-9: `Ankusa.Routes.Snapshot.check_budget/2`, called by
      # `ankusa_redis`'s stores, is new).
      # The `v` is in the restore prefix too, so bumping it still misses.
      # A mix.lock change alone matches the prefix: the entry built from the
      # previous lockfile is restored, `mix deps.get --check-locked` fetches
      # only the delta, and Mix recompiles only the deps that changed. Without
      # that, every dep bump was a total miss that rebuilt every dep — RocksDB
      # from source, ~8 min (PR 110: `ankusa` 5.6 -> 18.4 min).
      - name: cache mix deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/${{ matrix.package }}/deps
            packages/${{ matrix.package }}/_build
          key: mix-v9-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles(format('packages/{0}/mix.lock', matrix.package)) }}
          restore-keys: |
            mix-v9-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package }}-${{ hashFiles('.mise.toml') }}-
      # sdk-java's sbt build resolves its launcher, Scala and plugins through
      # coursier on every run (~10 s of the 51 s check step) and recompiles
      # 78 Java sources plus the test sources (~10 s); the conformance job
      # runs a second sbt (`Test/compile`, `testOnly`) over the same tree.
      # Locally the same command set is 20.42 s cold and 5.29 s with the
      # coursier cache and `target/` present (104 MiB + 15 MiB). Keyed by the
      # JDK/sbt pins (`.mise/conf.d/sdk-java.toml`), `build.sbt` and the sbt
      # version: zinc detects a changed build and recompiles what it must, and
      # the coursier jars stay valid, so the prefix stops after the toolchain.
      - name: cache sbt
        if: matrix.package == 'sdk-java'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            packages/sdk-java/target
            packages/sdk-java/project/target
          key: sbt-v1-${{ runner.os }}-${{ runner.arch }}-sdk-java-${{ hashFiles('.mise/conf.d/sdk-java.toml') }}-${{ hashFiles('packages/sdk-java/build.sbt', 'packages/sdk-java/project/build.properties', 'packages/sdk-java/project/plugins.sbt') }}
          restore-keys: |
            sbt-v1-${{ runner.os }}-${{ runner.arch }}-sdk-java-${{ hashFiles('.mise/conf.d/sdk-java.toml') }}-
      - name: rocksdb system deps
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - run: mix local.hex --force && mix local.rebar --force
      # check:package pulls each package's docker-compose images from Docker
      # Hub; anonymous pulls from shared runner IPs hit Hub's rate limit.
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: mise run check:package ${{ matrix.package }}
        env:
          # `mix hex.audit`'s report (retired packages, advisories), kept below.
          HEX_AUDIT_LOG: ${{ runner.temp }}/hex-audit-${{ matrix.package }}.txt
      # Even when the audit failed the job: the report says which dependency.
      - name: Upload the hex audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hex-audit-${{ matrix.package }}
          path: ${{ runner.temp }}/hex-audit-${{ matrix.package }}.txt
          if-no-files-found: ignore
          retention-days: 30

  # Core's object-store adapters (and the S3 backup round trip) against the
  # floci emulators: `mix test --only integration` (the rest of core's suite
  # runs in the `ankusa` package job).
  integration:
    name: core integration (floci)
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}" # the default key skips .mise/conf.d/
      - name: cache mix deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/ankusa/deps
            packages/ankusa/_build
          key: mix-v5-${{ runner.os }}-${{ runner.arch }}-ankusa-integration-${{ hashFiles('.mise.toml') }}-${{ hashFiles('packages/ankusa/mix.lock') }}
          restore-keys: |
            mix-v5-${{ runner.os }}-${{ runner.arch }}-ankusa-integration-${{ hashFiles('.mise.toml') }}-
      - name: rocksdb system deps
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - run: mix local.hex --force && mix local.rebar --force
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: mise run test:integration

  conformance:
    name: sdk conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}" # the default key skips .mise/conf.d/
      # The java SDK's conformance run is a second sbt compile over
      # `packages/sdk-java`; restore the `sdk-java` package job's entry (same
      # key and prefix; both restore, the first to finish saves).
      - name: cache sbt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            packages/sdk-java/target
            packages/sdk-java/project/target
          key: sbt-v1-${{ runner.os }}-${{ runner.arch }}-sdk-java-${{ hashFiles('.mise/conf.d/sdk-java.toml') }}-${{ hashFiles('packages/sdk-java/build.sbt', 'packages/sdk-java/project/build.properties', 'packages/sdk-java/project/plugins.sbt') }}
          restore-keys: |
            sbt-v1-${{ runner.os }}-${{ runner.arch }}-sdk-java-${{ hashFiles('.mise/conf.d/sdk-java.toml') }}-
      - run: mise run check:conformance

  # The deployable wrappers and TypeScript workers: path-dep consumers of the
  # packages, and where a lockfile goes stale without anyone noticing.
  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}" # the default key skips .mise/conf.d/
      - name: cache mix deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            examples/*/*/deps
            examples/*/*/_build
          key: mix-v5-${{ runner.os }}-${{ runner.arch }}-examples-${{ hashFiles('.mise.toml') }}-${{ hashFiles('examples/*/*/mix.lock') }}
          restore-keys: |
            mix-v5-${{ runner.os }}-${{ runner.arch }}-examples-${{ hashFiles('.mise.toml') }}-
      - name: rocksdb system deps
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - run: mix local.hex --force && mix local.rebar --force
      - run: mise run check:examples

  tools:
    name: tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}" # the default key skips .mise/conf.d/
      - run: mix local.hex --force && mix local.rebar --force
      - run: mise run check:tools

  # The perf regression gate (ground rule 10 of ANKUSA_HARDENING_PLAN.md,
  # docs/testing.md "Perf gate"): on every push to main, and on a PR only when
  # its diff touches a hot-path file. The job itself always runs (so a
  # branch-protection rule can require it); the steps that cost minutes are
  # skipped on a PR that does not touch the hot path. Hosted runners of one
  # class differ by a factor of two in speed from job to job, so the gate
  # compares against the base commit measured on this very runner (see the
  # "measure the base commit" step); the checked-in
  # packages/ankusa/bench/baseline.json (github-linux-x64) is the fallback when
  # there is no base commit to measure.
  bench:
    name: perf gate
    runs-on: ubuntu-latest
    env:
      # Ground rule 10's hot-path files, plus the gate's own files.
      HOT_PATHS: >-
        ^packages/ankusa/lib/ankusa/(
        (edge|queue|store|dispatch|verifier|routes)/.*|
        (store|queue|dedupe|envelope|http|route_resolver)\.ex|
        sink/(message|http)\.ex
        )$|^packages/ankusa/bench/|^\.mise/tasks/bench/|^\.github/workflows/ci\.yml$
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        name: does the diff touch the hot path?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: gate runs"
            exit 0
          fi
          pattern=$(echo "$HOT_PATHS" | tr -d ' ')
          touched=$(gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[].filename' | grep -E "$pattern" || true)
          if [ -n "$touched" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "hot-path files touched:"
            echo "$touched"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no hot-path file touched: gate skipped"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}" # the default key skips .mise/conf.d/
      - if: steps.scope.outputs.run == 'true'
        name: cache mix deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/ankusa/deps
            packages/ankusa/_build
          key: mix-v5-${{ runner.os }}-${{ runner.arch }}-ankusa-bench-${{ hashFiles('.mise.toml') }}-${{ hashFiles('packages/ankusa/mix.lock') }}
          restore-keys: |
            mix-v5-${{ runner.os }}-${{ runner.arch }}-ankusa-bench-${{ hashFiles('.mise.toml') }}-
      - if: steps.scope.outputs.run == 'true'
        name: rocksdb system deps
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - if: steps.scope.outputs.run == 'true'
        run: mix local.hex --force && mix local.rebar --force
      - if: steps.scope.outputs.run == 'true'
        name: measure the base commit on this runner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          src="packages/ankusa/lib packages/ankusa/priv packages/ankusa/config"
          if [ -z "$BASE_SHA" ] || [ -z "${BASE_SHA//0/}" ] || ! git fetch --depth=1 --quiet origin "$BASE_SHA"; then
            echo "::notice::no base commit to measure: comparing with the checked-in baseline"
            exit 0
          fi
          if ! git diff --quiet "$BASE_SHA" HEAD -- packages/ankusa/mix.exs packages/ankusa/mix.lock; then
            echo "::notice::mix.exs or mix.lock changed: comparing with the checked-in baseline"
            exit 0
          fi
          # The base's sources under this change's bench scripts.
          # shellcheck disable=SC2086
          rm -rf $src && git checkout "$BASE_SHA" -- $src
          BENCH_REBASELINE=1 BENCH_BASELINE="$RUNNER_TEMP/base-baseline.json" mise run bench:gate
          # shellcheck disable=SC2086
          rm -rf $src && git checkout HEAD -- $src
          echo "BENCH_BASELINE=$RUNNER_TEMP/base-baseline.json" >> "$GITHUB_ENV"
      - if: steps.scope.outputs.run == 'true'
        run: mise run bench:gate
      - if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-last
          path: |
            packages/ankusa/bench/last.json
            ${{ runner.temp }}/base-baseline.json
          if-no-files-found: ignore

  # The crash-consistency drill (scripts/drills/crash_drill.sh): ENOSPC on a
  # 96 MiB tmpfs, then kill -9 under load; every acked hook must read back.
  crash:
    name: crash drill (ENOSPC, kill -9)
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}" # the default key skips .mise/conf.d/
      - name: cache compiled deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/crash
          # The image (Dockerfile) is in the prefix: a change to it must not
          # restore a tree compiled inside another image. A changed lockfile
          # alone reuses the previous tree, and the drill's
          # `mix deps.get --check-locked && mix compile` rebuilds only what
          # changed instead of RocksDB from source (~8 min).
          key: crash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/ankusa_server/Dockerfile') }}-${{ hashFiles('.mise.toml', 'packages/ankusa/mix.lock') }}
          restore-keys: |
            crash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/ankusa_server/Dockerfile') }}-
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: mise run test:crash
      # The drill runs as root inside its container, so every file it wrote to
      # the .cache/crash mount is root-owned — and the cache action's post step
      # (a tar as the runner user) cannot read them, so the cache was never
      # saved and every run recompiled RocksDB and the rest of the deps from
      # source (~8 min). Hand the tree back before that post step. `always()`:
      # a failed drill still leaves an entry the next run can restore.
      - name: make the compiled-deps cache readable
        if: always()
        run: |
          [ -d .cache/crash ] || exit 0
          sudo chown -R "$(id -u):$(id -g)" .cache/crash

  # The same drill on ext4 over device-mapper (I/O error windows, then a
  # power-loss cut), which is what catches a hook acked without an fsync.
  # It needs a runner whose kernel lets a privileged container use loop and
  # device-mapper devices (GitHub's ubuntu-latest does). Exit 2 means a runner
  # that does not, and the step reports a skip; any other failure fails the job.
  crash-powerloss:
    name: crash drill (power-loss cut, device-mapper)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cache compiled deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/crash
          # The image (Dockerfile) is in the prefix: a change to it must not
          # restore a tree compiled inside another image. A changed lockfile
          # alone reuses the previous tree, and the drill's
          # `mix deps.get --check-locked && mix compile` rebuilds only what
          # changed instead of RocksDB from source (~8 min).
          key: crash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/ankusa_server/Dockerfile') }}-${{ hashFiles('.mise.toml', 'packages/ankusa/mix.lock') }}
          restore-keys: |
            crash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/ankusa_server/Dockerfile') }}-
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: scripts/drills/flakey.sh
        run: |
          rc=0
          scripts/drills/flakey.sh || rc=$?
          if [ "$rc" = 2 ]; then
            echo "::notice::the runner cannot run the device-mapper drill; skipped"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
      # Same root-owned cache as the tmpfs job above; the `if:` keeps this step
      # after a skipped drill too (a runner without device-mapper still warms
      # nothing, and the chown is a no-op when the container never wrote).
      - name: make the compiled-deps cache readable
        if: always()
        run: |
          [ -d .cache/crash ] || exit 0
          sudo chown -R "$(id -u):$(id -g)" .cache/crash
