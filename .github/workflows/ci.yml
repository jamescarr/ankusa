name: CI

# Every job runs the same `mise run` task you run locally, with the toolchain
# pinned in .mise.toml and .mise/conf.d/*.toml. The package matrix is
# discovered from packages/*, so a new package (`mise run new:adapter`) needs no
# edit here; packages that need live infrastructure bring up their own
# docker-compose.yml in check:package.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  # A newer push to the same PR supersedes the older run; a push to main (or
  # a tag) never cancels, because its result is the record for the commit.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI-22. mise loads `.mise/conf.d/*.toml` repo-wide, so every directory declares
# all 19 tools, and `task.run_auto_install` (default on) makes `mise run` install
# every missing one before the task starts — undoing the per-kind `install_args`
# the job chose. `auto_install=false` scopes a job's toolchain to exactly its
# mise-action step: a task that needs a tool the job did not install fails at
# that command instead of downloading the repo's whole set. Measured on run
# 41700744695: `ankusa_server` installed 16 tools inside `mise run`, `examples`
# 19; on 41689506568 a `lint` run downloaded 17 tools it never uses and died on
# a 500 from ruby's release URL.
#
# `http_retries=6` rides out exactly that burst: mise's backoff is ~0.2 s, 0.8 s,
# 2.6 s, 14 s, 14 s, 9 s — ~42 s from the first attempt to the final failure,
# measured on a probe with a URL that always answers 500 — instead of the
# default three attempts inside ~4 s. The downloads that remain — a package
# job's three tools — are the whole remaining 5xx surface.
env:
  MISE_AUTO_INSTALL: "false"
  MISE_HTTP_RETRIES: "6"

jobs:
  # CI-5: which jobs can this diff possibly need? This job decides once, every
  # other job reads its outputs, and `ci-summary` reports the result. The
  # filter lives at job level and never in the workflow's `paths:`: a skipped
  # job reports `skipped`, which blocks nothing (`main` has no protection and
  # no rulesets), so the workflow must always run and always report — the
  # guard is the executor's own `gh pr checks --watch`, and `ci-summary`
  # failing the run when this job did not finish.
  #
  # Everything here is fail-safe: a non-pull_request event, an empty or
  # unreadable diff, an unknown path and any error inside the step all resolve
  # to "run everything", never to "skip everything". A filter that breaks must
  # cost a slow run, not a missing gate.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # The JSON matrices: every package to run, and the same list without
      # `ankusa`, whose analysis and suite are the two lane jobs below. An
      # empty matrix is a workflow error, so "nothing" is `["-"]` and the
      # `package` job's `if:` is what keeps it from expanding.
      packages: ${{ steps.filter.outputs.packages }}
      packages_rest: ${{ steps.filter.outputs.packages_rest }}
      # `ankusa` is one of the packages to run (a core change, or a diff that
      # touched core): the two lane jobs' whole condition.
      core: ${{ steps.filter.outputs.core }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
      examples: ${{ steps.filter.outputs.examples }}
      tools: ${{ steps.filter.outputs.tools }}
      conformance: ${{ steps.filter.outputs.conformance }}
      integration: ${{ steps.filter.outputs.integration }}
      drills: ${{ steps.filter.outputs.drills }}
      # One line for `ci-summary` and the log: what the diff touched and what
      # it decided.
      reason: ${{ steps.filter.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff needs two commits: HEAD, and (on a pull request) the base.
          # A base that is still missing — the merge ref's parent is the branch
          # tip, but a base moved on — is fetched below; a failed fetch runs
          # everything.
          fetch-depth: 2
      - id: filter
        name: which jobs can this diff need?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          source .mise/lib/pkg.sh

          # Every package, in `pkg_names` order (`ankusa` first, then the Mix
          # adapters, then the images and the SDKs). Space separated: it is
          # word-split for the membership tests below.
          all=$(pkg_names | tr '\n' ' ')

          # $1: the packages to run, space separated, in any order (it is
          # reordered and deduplicated by the caller); then examples, tools,
          # conformance, integration, drills, docs_only, and a one-line reason.
          emit() {
            local pkgs="$1" name out="" rest="" core=false
            for name in $pkgs; do
              out="$out${out:+,}\"$name\""
              if [ "$name" = ankusa ]; then
                core=true
              else
                rest="$rest${rest:+,}\"$name\""
              fi
            done
            # An empty matrix is a workflow error, so "nothing to run" is the
            # one-element `["-"]`; the `package` job's `if:` is what keeps it
            # from expanding. Quoted, because `[-]` is not JSON and
            # `fromJSON('[-]')` fails the run with no job to show for it.
            [ -n "$out" ] || out='"-"'
            [ -n "$rest" ] || rest='"-"'
            {
              echo "packages=[$out]"
              echo "packages_rest=[$rest]"
              echo "core=$core"
              echo "examples=$2"
              echo "tools=$3"
              echo "conformance=$4"
              echo "integration=$5"
              echo "drills=$6"
              echo "docs_only=$7"
              echo "reason=$8"
            } >> "$GITHUB_OUTPUT"
            printf 'packages=[%s]\ncore=%s; examples=%s tools=%s conformance=%s integration=%s drills=%s docs_only=%s\n%s\n' \
              "$out" "$core" "$2" "$3" "$4" "$5" "$6" "$7" "$8"
          }

          # Both failure modes have the same answer: run everything. The guard
          # variable stops a failure inside `emit` from re-entering this.
          failed=0
          everything() {
            if [ "$failed" = 1 ]; then exit 0; fi
            failed=1
            echo "$1"
            if [ -z "$all" ]; then
              # Without the package list there is no "everything" to run, and
              # "skip everything" is the one answer this step must never give:
              # fail the job instead, and `ci-summary` fails the run.
              echo "::error::cannot list packages/*, so the all-jobs fallback is impossible"
              exit 1
            fi
            emit "$all" true true true true true false "$1"
            exit 0
          }
          trap 'everything "::warning::the diff filter failed; every job runs"' ERR

          if [ "$EVENT" != pull_request ]; then
            everything "not a pull request (event: $EVENT): a push to main, a tag or workflow_call runs every job"
          fi
          if [ -z "$BASE" ] || [ -z "${BASE//0/}" ] || [ -z "$HEAD" ]; then
            everything "no base and head to diff: every job runs"
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || true)
          if [ -z "$changed" ]; then
            # Most likely a shallow clone without the base commit. Not fatal:
            # the retry below decides, and a still-empty diff runs everything.
            git fetch --depth=1 --quiet origin "$BASE" >/dev/null 2>&1 || true
            changed=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || true)
          fi
          if [ -z "$changed" ]; then
            everything "the diff $BASE..$HEAD is empty or could not be read: every job runs"
          fi
          echo "the diff $BASE..$HEAD touches:"
          printf '%s\n' "$changed"

          # One pass over the diff, setting the flags each job reads. The
          # order of the patterns matters: a Markdown file is prose wherever it
          # lives (`*.md` comes before `packages/*`), and anything this list
          # does not recognise runs everything.
          every=0
          core=0
          touched=""
          conformance=false
          integration=false
          drills=false
          examples=false
          tools=false
          docs_only=true

          while IFS= read -r path; do
            case "$path" in
              # Prose, the site, the housekeeping files: `lint` (which also runs
              # check:monitoring and check:links) is what guards them.
              docs/* | *.md | marketing/* | static/* | LICENSE | .gitignore | .gitattributes | .editorconfig)
                ;;
              # The toolchain, the tasks, and CI itself: every job's outcome
              # can change without a package changing.
              .mise.toml | .mise/* | scripts/* | .github/*)
                every=1
                ;;
              packages/*/*)
                name=${path#packages/}
                name=${name%%/*}
                case " $all " in
                  *" $name "*) touched="$touched $name" ;;
                  *) every=1 ;;
                esac
                case "$path" in
                  packages/ankusa/* | packages/async_api_spex/*) core=1 ;;
                esac
                # The producer vectors are core's encoder's output, and the
                # shared job is the only thing that regenerates and validates
                # them. Each SDK's own `check:package` already runs that SDK's
                # `conformance_test`, so an SDK-only diff does not need it.
                case "$path" in
                  packages/ankusa/*) conformance=true ;;
                esac
                case "$path" in
                  packages/ankusa/*) integration=true ;;
                esac
                # The crash drills ack through the built image: the ack path
                # by name first (`queue/writer.ex`, `store.ex`,
                # `edge/batcher.ex` and their `queue/`, `store/`, `edge/`
                # siblings), then anything else under core's `lib`, the image
                # and every adapter. Deliberately a superset: the drills are
                # the ack-path gate, so only a diff that touched none of it
                # skips them.
                case "$path" in
                  packages/ankusa/lib/ankusa/queue/writer.ex | packages/ankusa/lib/ankusa/store.ex | packages/ankusa/lib/ankusa/edge/batcher.ex)
                    drills=true ;;
                  packages/ankusa/lib/ankusa/queue/* | packages/ankusa/lib/ankusa/store/* | packages/ankusa/lib/ankusa/edge/*)
                    drills=true ;;
                  packages/ankusa/lib/* | packages/ankusa/mix.exs | packages/ankusa/mix.lock)
                    drills=true ;;
                  packages/ankusa_server/* | packages/ankusa_*/lib/* | packages/ankusa_*/mix.exs)
                    drills=true ;;
                esac
                # `check:examples` builds every example's Mix app; these are
                # the packages those apps path-depend on.
                case "$path" in
                  packages/ankusa/* | packages/async_api_spex/* | packages/ankusa_kafka/* | packages/ankusa_rabbitmq/* | packages/ankusa_gateway/*)
                    examples=true ;;
                esac
                docs_only=false
                ;;
              conformance/*)
                conformance=true
                docs_only=false
                ;;
              examples/* | deploy/helm/*)
                examples=true
                docs_only=false
                ;;
              tools/*)
                tools=true
                examples=true
                docs_only=false
                ;;
              # `check:monitoring` runs in `lint`, which always runs.
              deploy/monitoring/*)
                docs_only=false
                ;;
              *)
                every=1
                ;;
            esac
          done <<EOF
          $changed
          EOF

          if [ "$every" = 1 ]; then
            everything "a toolchain, CI or script file, or a path this filter does not know, changed: every job runs"
          fi

          # The dependency rule from AGENTS.md: every adapter package and
          # `ankusa_server` path-depend on `ankusa` core, so a core change is
          # not finished until they pass — the whole Mix group, which is every
          # `hex` package (`ankusa`, the five adapters, `async_api_spex`,
          # `sdk-elixir`) plus `ankusa_server` (kind `docker`).
          if [ "$core" = 1 ]; then
            for name in $all; do
              case "$(pkg_kind "$name")" in
                hex | docker) touched="$touched $name" ;;
              esac
            done
          fi

          # Path dependencies beyond core: the two images embed the gateway library.
          case " $touched " in *" ankusa_gateway "* | *" ankusa_gateway_postgres "*) touched="$touched ankusa_gateway_server ankusa_server" ;; esac
          case " $touched " in *" ankusa_gateway_server "*) touched="$touched ankusa_server" ;; esac

          # `pkg_names` order, no duplicates.
          ordered=""
          for name in $all; do
            case " $touched " in *" $name "*) ordered="$ordered $name" ;; esac
          done

          if [ "$docs_only" = true ]; then
            reason="docs-only diff: every package job and every drill is skipped; lint still runs"
          else
            reason="packages:${ordered:- none}; examples=$examples tools=$tools conformance=$conformance integration=$integration drills=$drills"
          fi

          emit "$ordered" "$examples" "$tools" "$conformance" "$integration" "$drills" "$docs_only" "$reason"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The lint tasks are actionlint, a shell pin check, a grep for links and
      # promtool over the alert rules: no Elixir, no SDK toolchain. Installing
      # the repo's whole set made the mise-action step 19–34 s (restoring a
      # 655 MB cache) of a 26–36 s job; `actionlint` and `promtool` alone are a
      # few MB and a couple of seconds.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          install_args: actionlint promtool
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}-lint" # the default key skips .mise/conf.d/
      - run: mise run lint:workflows
      - run: mise run lint:pins
      - run: mise run check:links
      - run: mise run check:monitoring

  package:
    name: ${{ matrix.package }}
    needs: changes
    # `["-"]` is the changes job's "no package to run"; the matrix would be a
    # workflow error (`Matrix vector 'package' does not contain any values`),
    # so the job is skipped instead of expanded.
    if: needs.changes.outputs.packages_rest != '["-"]'
    runs-on: ubuntu-latest
    env:
      # Fork PRs get no secrets; skip the login there rather than fail it.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        # Every package the diff can need, but `ankusa` — it has the two lane
        # jobs below.
        package: ${{ fromJSON(needs.changes.outputs.packages_rest) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A package job needs one toolchain, not the repo's whole set: the
      # shared mise cache is 655 MB and restoring it costs 8–16 s of every
      # job's 18–30 s mise-action step (the tools themselves report "already
      # installed 0ms" — restore is the cost). Install and cache per kind, so
      # `sdk-go` (2 s check) restores go, not rust/java/clojure/php too.
      - id: toolchain
        name: the package's toolchain
        run: |
          set -euo pipefail
          source .mise/lib/pkg.sh
          kind=$(pkg_kind "${{ matrix.package }}")
          case "$kind" in
            hex | docker) tools="elixir erlang cmake"; cache=hex ;;
            npm) tools="node"; cache=npm ;;
            python) tools="uv"; cache=python ;;
            cargo) tools="rust"; cache=cargo ;;
            ruby) tools="ruby"; cache=ruby ;;
            go) tools="go"; cache=go ;;
            php) tools="http:php http:composer"; cache=php ;;
            java) tools="java sbt"; cache=java ;;
            clojure) tools="java clojure"; cache=clojure ;;
            *)
              echo "::error::no toolchain for kind $kind"
              exit 1
              ;;
          esac
          {
            echo "kind=$kind"
            echo "tools=$tools"
            echo "cache=$cache"
          } >> "$GITHUB_OUTPUT"
          # `check:package` brings a package's own docker-compose.yml up and
          # nothing else (`ankusa`'s integration emulators are a different
          # file, `ankusa_server` has none): only those packages cache images.
          if [ -f "$(pkg_dir "${{ matrix.package }}")/docker-compose.yml" ]; then
            echo "has_compose=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_compose=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          install_args: ${{ steps.toolchain.outputs.tools }}
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}-${{ steps.toolchain.outputs.cache }}" # the default key skips .mise/conf.d/
      # `_build` also holds dialyzer's PLTs (`_build/plts`, see each mix.exs), so
      # this key — the OTP/Elixir pins in .mise.toml plus mix.lock — is the PLT
      # cache key: a run rebuilds a PLT only when the toolchain or a dep changed.
      # The PLT also covers the path-dependency `ankusa`, so an adapter that
      # calls a function core newly gained fails dialyzer against a stale PLT:
      # bump the `v` below when that happens (SEC-4: `Ankusa.Crypto.Envelope`;
      # SEC-8: `Ankusa.Verifier.max_tolerance_seconds/0`; SEC-9:
      # `Ankusa.SecretProvider`, `Ankusa.SourceStore.Static.publish/2`; SEC-12:
      # `Ankusa.Verifier.Asymmetric`/`Token`/`ClientCert`, called by the image's
      # loader; TEN-4: `Ankusa.Routes.Store.delete/3` replaced `delete/2`, so
      # the stale PLT made dialyzer crash on `ankusa_redis`'s callback check;
      # TEN-6: `Ankusa.RateLimiter.Store` and `Ankusa.Dedupe.Store` are new
      # behaviours `ankusa_redis` implements, absent from the stale PLT;
      # TEN-8: `Ankusa.Sink.Description` gained `payload` and `computed`, so
      # the stale PLT failed `ankusa_redis`'s `describe/2` callback check;
      # TEN-9: `Ankusa.Routes.Snapshot.check_budget/2`, called by
      # `ankusa_redis`'s stores, is new; DUR-1.b.b: `Ankusa.Intake.Recovery.parse_args/1`,
      # `run_offline/2` and `format_summary/1`, called by the image's `recover`
      # command, are new; the sink layer: `Ankusa.Sink.Messaging`, which every
      # adapter sink `use`s, and `Ankusa.Sink.Connections`, which every adapter
      # `Application` starts, are new; DEL-2: `Ankusa.RetryPolicy.validate_opt!/3` and
      # `Ankusa.ClaimCheck.validate_stored_horizons!/2`, called by the image's loader and
      # `ankusa_redis`'s source store, are new; DEL-5: `Ankusa.Sink.Message.max_bytes/1`,
      # which every adapter sink's `use Ankusa.Sink.Messaging` calls, is new; OPS-2:
      # `Ankusa.LogLevel.set/1`, called by the image's `Application`, is new; DEL-1.b:
      # `Ankusa.Ordering.normalize_sinks!/2`, called by the image's loader, is new; OPS-4:
      # `Ankusa.Instance.Drain.run/1`, called by the image's `Application`, is new; OPS-6:
      # `Ankusa.Reload.register/2` and `apply_config/3`, called by the image's `Application`
      # and loader, are new).
      # The `v` is in the restore prefix too, so bumping it still misses.
      # A mix.lock change alone matches the prefix: the entry built from the
      # previous lockfile is restored, `mix deps.get --check-locked` fetches
      # only the delta, and Mix recompiles only the deps that changed. Without
      # that, every dep bump was a total miss that rebuilt every dep — RocksDB
      # from source, ~8 min (PR 110: `ankusa` 5.6 -> 18.4 min).
      # `mix-v18-`: entries under `mix-v17-…-ankusa-…` were written by the
      # `sdk conformance` job (2.4 min, test env only) before this job could
      # save its `dev`+`test`+`prod` tree, and actions/cache never overwrites
      # an existing key — so the restored tree lacked `dev` and RocksDB's NIF
      # was rebuilt from source every run. The rule now: **exactly one job
      # saves a given cache key; every other job restores it by prefix** (the
      # conformance job has its own `…-ankusa-conformance-…` key and restores
      # this tree through its second `restore-keys` prefix). Because
      # actions/cache never re-saves an existing key, a poisoned (partial)
      # entry is escaped only by bumping this version again (`mix-v20-`, …).
      # `mix-v19-`: CR-1 — `Ankusa.EventType.new!/2`, called by the image's
      # loader, is new, so the stale PLT failed `ankusa_server`'s dialyzer.
      # `mix-v20-`: CR-2 — `Ankusa.Filter`, called by the image's loader, is new
      # (same failure).
      # `mix-v21-`: CR-3 — `Ankusa.Sink.Template.normalize_sink!/2` and
      # `templated?/1`, called by the image's loader, are new, same failure.
      - name: cache mix deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/${{ matrix.package }}/deps
            packages/${{ matrix.package }}/_build
          key: mix-v21-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles(format('packages/{0}/mix.lock', matrix.package)) }}
          restore-keys: |
            mix-v21-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package }}-${{ hashFiles('.mise.toml') }}-
      # sdk-go has no dependencies outside the standard library, but
      # `go test -race -count=1` rebuilds the race-instrumented standard
      # library and the package on every run — 39 s of a 77 s job; locally the
      # same command set is 13.15 s cold and 2.94 s with a warm GOCACHE
      # (258 MiB). The build cache is content-addressed by source, toolchain
      # and flags, so an entry from another commit is still valid: key it by
      # the go pin and go.mod, and let a stale entry stay (a source change
      # only recompiles that package).
      - name: cache go build
        if: matrix.package == 'sdk-go'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-sdk-go-${{ hashFiles('.mise/conf.d/sdk-go.toml') }}-${{ hashFiles('packages/sdk-go/go.mod', 'packages/sdk-go/go.sum') }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ runner.arch }}-sdk-go-${{ hashFiles('.mise/conf.d/sdk-go.toml') }}-
      # sdk-rust's `target/` is the one build tree the caches did not carry:
      # `check:package sdk-rust` compiles the dependency graph four times
      # (clippy, test, doc, the packaged-source verify — 92 s on a hosted
      # runner, warm 10 s) and the `sdk conformance` job builds it again.
      # Keyed by the rust pin in `.mise/conf.d/sdk-rust.toml` (cargo's
      # fingerprints are rustc-version specific) and Cargo.lock; the `v` is in
      # the restore prefix too, so bumping it still misses, while a
      # Cargo.lock change alone matches the prefix and cargo rebuilds only the
      # crates whose sources changed. The conformance job restores the same
      # entry (both jobs restore; the first to finish saves, and the package
      # job's tree is a superset of what it builds).
      - name: cache cargo target
        if: matrix.package == 'sdk-rust'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/sdk-rust/target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-sdk-rust-${{ hashFiles('.mise/conf.d/sdk-rust.toml') }}-${{ hashFiles('packages/sdk-rust/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-sdk-rust-${{ hashFiles('.mise/conf.d/sdk-rust.toml') }}-
      # Only the Mix projects compile rocksdb/erlang-rocksdb (and brod's
      # crc32cer) — the cargo/go/java/clojure/php/python/ruby/npm jobs have no
      # native dependency to link against and no use for `mix`. Both steps
      # cost 5–11 s of a job whose check can be as short as 2 s (sdk-go).
      - name: rocksdb system deps
        if: steps.toolchain.outputs.kind == 'hex' || steps.toolchain.outputs.kind == 'docker'
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - if: steps.toolchain.outputs.kind == 'hex' || steps.toolchain.outputs.kind == 'docker'
        run: mix local.hex --force && mix local.rebar --force
      # check:package pulls each package's docker-compose images from Docker
      # Hub; anonymous pulls from shared runner IPs hit Hub's rate limit.
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The four packages with a compose file pull from Docker Hub every run,
      # and anonymous pulls from shared runner IPs get `toomanyrequests` (11 of
      # the last 21 failed jobs). Carry the images between runs instead:
      # `scripts/ci/images.sh` keeps one tar per digest-qualified ref, the key
      # hashes the compose file so a digest bump re-pulls exactly once, and
      # `docker compose up` finds the loaded images and pulls nothing
      # (`pull_policy` defaults to `missing`). A failed check still saves.
      - name: use the containerd image store
        if: steps.toolchain.outputs.has_compose == 'true'
        run: scripts/ci/images.sh containerd
      - name: cache the package's compose images
        if: steps.toolchain.outputs.has_compose == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/docker-images
          key: images-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/docker-compose.yml', matrix.package)) }}
          restore-keys: |
            images-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package }}-
      - name: load the package's compose images
        if: steps.toolchain.outputs.has_compose == 'true'
        run: |
          set -euo pipefail
          # The refs come from the compose file, not from a list kept here:
          # `config --images` is what `docker compose up` resolves.
          refs=()
          while IFS= read -r ref; do refs+=("$ref"); done < <(
            docker compose -f "packages/${{ matrix.package }}/docker-compose.yml" config --images
          )
          scripts/ci/images.sh sync "${{ runner.temp }}/docker-images" "${refs[@]}"
      - run: mise run check:package ${{ matrix.package }}
        env:
          # `mix hex.audit`'s report (retired packages, advisories), kept below.
          HEX_AUDIT_LOG: ${{ runner.temp }}/hex-audit-${{ matrix.package }}.txt
      - name: save the package's compose images
        if: always() && steps.toolchain.outputs.has_compose == 'true'
        run: |
          set -euo pipefail
          refs=()
          while IFS= read -r ref; do refs+=("$ref"); done < <(
            docker compose -f "packages/${{ matrix.package }}/docker-compose.yml" config --images
          )
          scripts/ci/images.sh save "${{ runner.temp }}/docker-images" "${refs[@]}"
      # Even when the audit failed the job: the report says which dependency.
      - name: Upload the hex audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hex-audit-${{ matrix.package }}
          path: ${{ runner.temp }}/hex-audit-${{ matrix.package }}.txt
          if-no-files-found: ignore
          retention-days: 30

  # `ankusa` — the package everything else depends on — was the whole critical
  # path of a run: one job ran compile + credo + PLT + dialyzer + sobelow
  # (2:30–3:15) and then `mix test --cover` (6:24–8:14) one after the other. The
  # two halves share nothing but `deps/` and the compiled project, so they run
  # as two jobs, each calling the same task a developer runs with `--lane`, and
  # a static failure now reports in ~3 min instead of after the suite.
  #
  # One writer per key (CI-1's rule): `ankusa-static` saves
  # `…-ankusa-static-…`, `ankusa-test` saves `…-ankusa-test-…`, and neither
  # writes the pre-split `…-ankusa-<toolchain>-<lock>` entry. The first run of
  # each lane therefore restores that full tree (`dev`+`test`+`prod`,
  # everything the old job kept warm) through its second restore prefix: that
  # is the warm start. `v19` is the version the pre-split entry was written
  # under — the escape hatch (one writer per key, actions/cache never re-saves
  # a key) is to bump it here and in the `package` job together.
  ankusa-static:
    name: ankusa (static)
    needs: changes
    # The same condition the matrix would apply to `ankusa`: core is in the
    # packages to run.
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      # Fork PRs get no secrets; skip the login there rather than fail it.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `ankusa` is kind `hex`, so this is exactly what the `package` job's
      # `toolchain` step resolves for that kind — `elixir erlang cmake` (cmake
      # for the RocksDB NIF) — instead of restoring the 655 MB shared cache.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          install_args: elixir erlang cmake
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}-hex" # the default key skips .mise/conf.d/
      - name: cache mix deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/ankusa/deps
            packages/ankusa/_build
          key: mix-v19-${{ runner.os }}-${{ runner.arch }}-ankusa-static-${{ hashFiles('.mise.toml') }}-${{ hashFiles('packages/ankusa/mix.lock') }}
          restore-keys: |
            mix-v19-${{ runner.os }}-${{ runner.arch }}-ankusa-static-${{ hashFiles('.mise.toml') }}-
            mix-v19-${{ runner.os }}-${{ runner.arch }}-ankusa-${{ hashFiles('.mise.toml') }}-
      # Only the Mix projects compile rocksdb's NIF (see the `package` job).
      - name: rocksdb system deps
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - run: mix local.hex --force && mix local.rebar --force
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # deps, `hex.audit`, format, `compile --warnings-as-errors`, credo, PLT
      # restore/save, dialyzer, sobelow, `mix docs`, `mix hex.build` — the lane
      # warms the `dev` env these run in.
      - run: mise run check:package ankusa --lane static
        env:
          # `mix hex.audit`'s report (retired packages, advisories), kept below.
          HEX_AUDIT_LOG: ${{ runner.temp }}/hex-audit-ankusa.txt
      # Even when the audit failed the job: the report says which dependency.
      - name: Upload the hex audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hex-audit-ankusa
          path: ${{ runner.temp }}/hex-audit-ankusa.txt
          if-no-files-found: ignore
          retention-days: 30

  # CI-17: the suite is four shards on four runners plus a merge job, because
  # one `mix test --cover` was 7-10 min of the run and the last job to finish.
  # `--partitions` assigns whole test *files* round-robin over the sorted file
  # list, so a heavy file decides the balance of whichever shard it lands in and
  # cannot be split. Measured per-shard job times: K=3 290/127/322 s
  # (run 41677632064), K=4 188/93/250/120 s (41679004989; 292 s from the first
  # shard to the merge's end) and 128/299/315/113 s on a run where every job
  # was ~30 % slower (41683881288), K=5 92/251/114/215/131 s (41685085654;
  # 297 s). A fifth runner bought no wall clock, so K stays at 4. A shard does
  # not enforce the coverage floor — `mix test --partitions K --cover`
  # exports `cover/<n>.coverdata` instead of computing a report, because a
  # report over 1/K of the code would fail the floor for the very reason the
  # suite is split. The `ankusa-coverage` job below is the one place it runs.
  #
  # The matrix and each job's `PARTITIONS` env are the two places K appears (a
  # job name cannot read `env`); keep them in step. The lane task takes `n/K`
  # itself, so a shard cannot disagree with the export name it uploads.
  ankusa-test:
    name: ankusa (tests, ${{ matrix.partition }}/4)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One red shard must not cancel the others: a cancelled shard uploads no
      # export, and the merge job would then report a missing shard instead of
      # the test failure that caused it. The run is red either way.
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    env:
      # Fork PRs get no secrets; skip the login there rather than fail it.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      PARTITIONS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          install_args: elixir erlang cmake
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}-hex" # the default key skips .mise/conf.d/
      # Same shape as the static lane, its own key: `deps/` plus `_build` with
      # the `test` env compiled (the suite never reads `dev`). All four shards
      # restore (and, on a cold key, race to save) the one entry — the same
      # single-writer rule as before, now within one matrix job.
      - name: cache mix deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/ankusa/deps
            packages/ankusa/_build
          key: mix-v19-${{ runner.os }}-${{ runner.arch }}-ankusa-test-${{ hashFiles('.mise.toml') }}-${{ hashFiles('packages/ankusa/mix.lock') }}
          restore-keys: |
            mix-v19-${{ runner.os }}-${{ runner.arch }}-ankusa-test-${{ hashFiles('.mise.toml') }}-
            mix-v19-${{ runner.os }}-${{ runner.arch }}-ankusa-${{ hashFiles('.mise.toml') }}-
      - name: rocksdb system deps
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - run: mix local.hex --force && mix local.rebar --force
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # One shard of `mix test --cover`, exporting its coverage and its own
      # ExUnit seed line to this job's summary; the lane fails the shard if it
      # ran no tests (`Result:` absent or zero) or left no export. The audit
      # and its `hex-audit-ankusa` artifact stay in the static lane —
      # `hex.audit` runs there, and two jobs must not upload one artifact name.
      - run: mise run check:package ankusa --partition ${{ matrix.partition }}/${{ env.PARTITIONS }}
      # Always: a red shard still has a complete export (Mix exports after the
      # suite, not only on success), and the merge job names a *missing*
      # shard, which is the failure that says the pipeline broke, not the test.
      - name: upload the shard's coverage export
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ankusa-coverage-${{ matrix.partition }}
          path: packages/ankusa/cover/${{ matrix.partition }}.coverdata
          if-no-files-found: error
          retention-days: 7

  # CI-17: merge the shards' exports and enforce the package's own floor — the
  # same `test_coverage: [summary: [threshold: 85]]` `mix test --cover` applies
  # in one process, through `mix test.coverage` (which calls the same
  # `generate_cover_results/1`; it exits non-zero with "Coverage test failed,
  # threshold not met" when the merged total is under the floor). No env or
  # `mix.exs` switch is needed: the export path used by a shard skips the
  # summary entirely, and this job imports every export before the summary is
  # computed.
  #
  # `always() && !cancelled()`: this job must run after a red shard to say which
  # shard is missing, and must not run when the matrix was skipped by `changes`.
  ankusa-coverage:
    name: ankusa (coverage)
    needs: [changes, ankusa-test]
    if: always() && !cancelled() && needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      # Keep in step with the `ankusa-test` matrix above; a shard missing from
      # cover/ fails this job before Mix runs.
      PARTITIONS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          install_args: elixir erlang cmake
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}-hex" # the default key skips .mise/conf.d/
      # The same entry the shards restored and saved: the compiled `test` tree
      # `mix test.coverage` needs to cover-compile and attribute lines to.
      - name: cache mix deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/ankusa/deps
            packages/ankusa/_build
          key: mix-v19-${{ runner.os }}-${{ runner.arch }}-ankusa-test-${{ hashFiles('.mise.toml') }}-${{ hashFiles('packages/ankusa/mix.lock') }}
          restore-keys: |
            mix-v19-${{ runner.os }}-${{ runner.arch }}-ankusa-test-${{ hashFiles('.mise.toml') }}-
            mix-v19-${{ runner.os }}-${{ runner.arch }}-ankusa-${{ hashFiles('.mise.toml') }}-
      - name: rocksdb system deps
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - run: mix local.hex --force && mix local.rebar --force
      # Each shard uploads `cover/<n>.coverdata`; `merge-multiple` puts them
      # back side by side in the package's `cover/`, which is what
      # `mix test.coverage` reads (`cover/*.coverdata`, gitignored).
      - name: download the shards' coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ankusa-coverage-*
          path: packages/ankusa/cover
          merge-multiple: true
      # The explicit guard: a missing or empty shard must fail here, with the
      # shard named, rather than merge into a report that looks complete. (If
      # *no* artifact arrives, the download step above already failed the job.)
      - name: merge the shards and enforce the 85 % floor
        working-directory: packages/ankusa
        env:
          MIX_ENV: test
        run: |
          set -euo pipefail
          for n in $(seq 1 "$PARTITIONS"); do
            if [ ! -s "cover/$n.coverdata" ]; then
              echo "::error::shard $n uploaded no cover/$n.coverdata — a missing shard is a failure, not a partial pass"
              exit 1
            fi
          done
          found=0
          for f in cover/*.coverdata; do
            if [ -e "$f" ]; then found=$((found + 1)); fi
          done
          if [ "$found" -ne "$PARTITIONS" ]; then
            echo "::error::expected $PARTITIONS coverage exports, found $found — a shard ran twice or a partition is wrong"
            exit 1
          fi
          mix deps.get --check-locked
          mix test.coverage

  # Core's object-store adapters (and the S3 backup round trip) against the
  # floci emulators: `mix test --only integration` (the rest of core's suite
  # runs in the `ankusa-test` job).
  integration:
    name: core integration (floci)
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `test:integration` is Mix against the emulators: the same three tools
      # and the same cache entry the `ankusa` package job keeps (CI-22).
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          install_args: elixir erlang cmake
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}-hex" # the default key skips .mise/conf.d/
      - name: cache mix deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/ankusa/deps
            packages/ankusa/_build
          key: mix-v5-${{ runner.os }}-${{ runner.arch }}-ankusa-integration-${{ hashFiles('.mise.toml') }}-${{ hashFiles('packages/ankusa/mix.lock') }}
          restore-keys: |
            mix-v5-${{ runner.os }}-${{ runner.arch }}-ankusa-integration-${{ hashFiles('.mise.toml') }}-
      - name: rocksdb system deps
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - run: mix local.hex --force && mix local.rebar --force
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The floci emulators and the AWS/GCS/Azure/OCI bootstrap containers are
      # ~390 MB pulled from Docker Hub on every run; keep them between runs
      # (see the `package` job for the shape of this).
      - name: use the containerd image store
        run: scripts/ci/images.sh containerd
      - name: cache the emulators' images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/docker-images
          key: images-v1-${{ runner.os }}-${{ runner.arch }}-integration-${{ hashFiles('packages/ankusa/docker-compose.integration.yml') }}
          restore-keys: |
            images-v1-${{ runner.os }}-${{ runner.arch }}-integration-
      - name: load the emulators' images
        run: |
          set -euo pipefail
          refs=()
          while IFS= read -r ref; do refs+=("$ref"); done < <(
            docker compose -f packages/ankusa/docker-compose.integration.yml config --images
          )
          scripts/ci/images.sh sync "${{ runner.temp }}/docker-images" "${refs[@]}"
      - run: mise run test:integration
      - name: save the emulators' images
        if: always()
        run: |
          set -euo pipefail
          refs=()
          while IFS= read -r ref; do refs+=("$ref"); done < <(
            docker compose -f packages/ankusa/docker-compose.integration.yml config --images
          )
          scripts/ci/images.sh save "${{ runner.temp }}/docker-images" "${refs[@]}"

  conformance:
    name: sdk conformance
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          # Everything `check:conformance` spawns, read off `.mise/tasks/check/conformance`
          # and `conformance/sdks.json`: `check.mjs` regenerates the producer
          # vectors with core's `mix` (RocksDB's NIF compiles, so cmake), then
          # hands each SDK its own command — `mix`, `npm`/`npx`, `uv`, `cargo`,
          # `bundle`, `go`, `sbt`, `clojure`, `composer`/`php` (CI-22).
          install_args: elixir erlang cmake node uv rust ruby go java sbt clojure http:php http:composer
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}" # the default key skips .mise/conf.d/
      # The rust SDK's conformance run is `cargo build --locked --tests` +
      # `cargo test --locked --test conformance`: the same dependency graph the
      # `sdk-rust` package job compiles. Restore its entry (same key and
      # prefix; whichever job saves first wins, and both restore).
      - name: cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/sdk-rust/target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-sdk-rust-${{ hashFiles('.mise/conf.d/sdk-rust.toml') }}-${{ hashFiles('packages/sdk-rust/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-sdk-rust-${{ hashFiles('.mise/conf.d/sdk-rust.toml') }}-
      # `check.mjs` regenerates the producer vectors with core's own encoder
      # (`mix ankusa.conformance.gen`, MIX_ENV=test), which compiles RocksDB:
      # restore the `ankusa` package job's tree. Exactly one job saves a given
      # cache key; every other job restores it by prefix. This job saves its
      # own `…-ankusa-conformance-…` entry (test env only) and reads the
      # package job's full `dev`+`test`+`prod` entry through the second
      # prefix, so sharing the prefix no longer costs the package job a save.
      - name: cache mix deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/ankusa/deps
            packages/ankusa/_build
          key: mix-v18-${{ runner.os }}-${{ runner.arch }}-ankusa-conformance-${{ hashFiles('.mise.toml') }}-${{ hashFiles('packages/ankusa/mix.lock') }}
          restore-keys: |
            mix-v18-${{ runner.os }}-${{ runner.arch }}-ankusa-conformance-${{ hashFiles('.mise.toml') }}-
            mix-v18-${{ runner.os }}-${{ runner.arch }}-ankusa-${{ hashFiles('.mise.toml') }}-
      - name: rocksdb system deps
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - run: mix local.hex --force && mix local.rebar --force
      - run: mise run check:conformance

  # The deployable wrappers and TypeScript workers: path-dep consumers of the
  # packages, and where a lockfile goes stale without anyone noticing.
  examples:
    name: examples
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          # What `check:examples` runs, plus the `examples/fleet-e2e/kind/`
          # toolchain the job's chart render stands in for (CI-22's set): every
          # example's `mix` app (RocksDB's NIF needs cmake), the npm SDKs'
          # `npm ci`/`build` and the workers' `npx tsc` (node), the Python
          # worker's `uv sync`, the Rust worker's `cargo fmt`/`clippy`, and the
          # charts' `helm lint`/`template` + `kubeconform`. The task itself never
          # shells out to `kind` or `kubectl` — it renders the fleet chart's
          # values with helm — but they stay declared, as the plan lists them.
          install_args: elixir erlang cmake node uv rust helm kubectl kubeconform kind
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}" # the default key skips .mise/conf.d/
      - name: cache mix deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            examples/*/*/deps
            examples/*/*/_build
          key: mix-v5-${{ runner.os }}-${{ runner.arch }}-examples-${{ hashFiles('.mise.toml') }}-${{ hashFiles('examples/*/*/mix.lock') }}
          restore-keys: |
            mix-v5-${{ runner.os }}-${{ runner.arch }}-examples-${{ hashFiles('.mise.toml') }}-
      # `check:examples` runs `cargo fmt --check && cargo clippy --locked
      # --all-targets -- -D warnings` for examples/nats-consumer, which
      # compiles async-nats/tokio/serde from scratch every run (26 s of the
      # 80 s step; 24–26 s in 439eae5, a69bf9c and d0406db). Same keying as
      # `sdk-rust`'s target cache: rust's fingerprints are rustc-version
      # specific, and a Cargo.lock change matches the prefix so cargo
      # rebuilds only the crates whose sources changed.
      - name: cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/nats-consumer/target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-examples-nats-consumer-${{ hashFiles('.mise/conf.d/sdk-rust.toml') }}-${{ hashFiles('examples/nats-consumer/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-examples-nats-consumer-${{ hashFiles('.mise/conf.d/sdk-rust.toml') }}-
      - name: rocksdb system deps
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - run: mix local.hex --force && mix local.rebar --force
      - run: mise run check:examples

  tools:
    name: tools
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `check:tools` is Mix only: the Elixir/OTP pair plus cmake for a native
      # dep rebuilt on a cache miss. Share the package jobs' `hex` cache entry
      # instead of restoring the repo's whole 655 MB toolchain cache.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          install_args: elixir erlang cmake
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}-hex" # the default key skips .mise/conf.d/
      - run: mix local.hex --force && mix local.rebar --force
      - run: mise run check:tools

  # The one scope decision the two bench jobs obey (CI-7, CI-10). A pull
  # request is judged by its diff from the API; a push to `main` by
  # `github.event.before..sha`, which is the PR diff that was already gated
  # plus whatever else landed in the range — so a main push that touches no
  # hot-path file runs neither job, and its commit keeps the verdict its PR
  # run gave it. Every failure in here resolves to `run=true`: a filter that
  # breaks must run the gate, never skip it. It is a job of its own because a
  # job reads another job's output only through `needs:`, and keeping the step
  # inside `bench` made `bench-tenant` wait for the whole gate (CI-10: the
  # merge push's wall clock went to 14:24 from 10:04). A checkout, a `gh api`
  # or `git diff`, and a `grep`: seconds, and both jobs start together after it.
  bench-scope:
    name: bench-scope
    runs-on: ubuntu-latest
    outputs:
      # The scope decision, for `perf gate` and `bench-tenant`.
      run: ${{ steps.scope.outputs.run }}
      # The gateway's own: its authorization and authentication budgets
      # (`bench-gateway`), for a diff to its code or its bench.
      gateway: ${{ steps.scope.outputs.gateway }}
    env:
      # Ground rule 10's hot-path files, plus the gate's own files. `ci.yml` is
      # not one of them: a workflow file cannot change the measured program, and
      # an invocation it gets wrong shows up on the next push to `main` within
      # minutes (CI-2 in CI_PIPELINE_PLAN.md).
      HOT_PATHS: >-
        ^packages/ankusa/lib/ankusa/(
        (edge|queue|store|dispatch|verifier|routes)/.*|
        (store|queue|dedupe|envelope|http|route_resolver)\.ex|
        sink/(message|http)\.ex
        )$|^packages/ankusa/bench/|^\.mise/tasks/bench/
      GATEWAY_PATHS: ^packages/ankusa_gateway/(lib|bench)/|^\.mise/tasks/bench/gateway$
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        name: does the diff touch the hot path?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          decide() {
            echo "run=$1" >> "$GITHUB_OUTPUT"
            echo "gateway=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
            exit 0
          }
          # A release tag runs this workflow on a commit its PR and its push to
          # main already gated. A new tag has no `before` commit to measure, so
          # the gate would compare a hosted runner with the checked-in laptop
          # baseline, which fails on any runner (the 0.7.0 tags did, 11 times).
          if [ "$REF_TYPE" = tag ]; then
            decide false "a release tag: its commit was gated on its pull request and its push to main"
          fi
          # Only a PR or a push carries a diff to judge. `workflow_call` and
          # `workflow_dispatch` have none: gate.
          case "$EVENT" in
            pull_request)
              files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[].filename') \
                || decide true "::notice::cannot list the pull request's files: gate runs"
              ;;
            push)
              # The previous head. A first push to a branch or a force-push
              # leaves it empty or all zeros: no diff to judge.
              if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ]; then
                decide true "::notice::no base commit (a first push or a force-push): gate runs"
              fi
              git fetch --depth=1 --quiet origin "$BEFORE" \
                || decide true "::notice::cannot fetch $BEFORE: gate runs"
              files=$(git diff --name-only "$BEFORE" "$SHA") \
                || decide true "::notice::cannot diff $BEFORE..$SHA: gate runs"
              ;;
            *)
              decide true "not a pull request or a push: gate runs"
              ;;
          esac
          pattern=$(echo "$HOT_PATHS" | tr -d ' ')
          touched=$(printf '%s\n' "$files" | grep -E "$pattern" || true)
          if [ -n "$touched" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "hot-path files touched:"
            echo "$touched"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no hot-path file touched: perf gate and bench-tenant skipped"
          fi
          gateway=$(printf '%s\n' "$files" | grep -E "$GATEWAY_PATHS" || true)
          if [ -n "$gateway" ]; then
            echo "gateway=true" >> "$GITHUB_OUTPUT"
            echo "gateway files touched:"
            echo "$gateway"
          else
            echo "gateway=false" >> "$GITHUB_OUTPUT"
            echo "no gateway file touched: bench-gateway skipped"
          fi

  # The perf regression gate (ground rule 10 of ANKUSA_HARDENING_PLAN.md,
  # docs/testing.md "Perf gate"): on a push to main and on a PR only when the
  # diff touches a hot-path file, which `bench-scope` decides. It runs beside
  # `bench-tenant` (both `needs: bench-scope`), so neither job's duration is on
  # the other's critical path, and a diff that touches nothing skips both.
  # Hosted runners of one class differ by a factor of two in speed from job to
  # job, so the gate compares against the base commit measured on this very
  # runner (see the "measure the base commit" step); the checked-in
  # packages/ankusa/bench/baseline.json (recorded on a laptop with the bench's
  # data directory on a RAM disk, see docs/testing.md "Perf gate") is the
  # fallback when there is no base commit to measure.
  bench:
    name: perf gate
    needs: bench-scope
    if: needs.bench-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      # `bench:gate` runs the tenant benches locally too; here `bench-tenant`
      # runs them in parallel, so the matrix task must not run them again.
      BENCH_SKIP_TENANTS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          # `bench:gate` is Mix (`mix compile`, `elixir bench/gate.exs`); the
          # same three tools and cache entry as the `ankusa` package job (CI-22).
          install_args: elixir erlang cmake
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}-hex" # the default key skips .mise/conf.d/
      - name: cache mix deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/ankusa/deps
            packages/ankusa/_build
          key: mix-v5-${{ runner.os }}-${{ runner.arch }}-ankusa-bench-${{ hashFiles('.mise.toml') }}-${{ hashFiles('packages/ankusa/mix.lock') }}
          restore-keys: |
            mix-v5-${{ runner.os }}-${{ runner.arch }}-ankusa-bench-${{ hashFiles('.mise.toml') }}-
      - name: rocksdb system deps
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - run: mix local.hex --force && mix local.rebar --force
      - name: measure the base commit on this runner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          src="packages/ankusa/lib packages/ankusa/priv packages/ankusa/config"
          deps="packages/ankusa/mix.exs packages/ankusa/mix.lock"
          if [ -z "$BASE_SHA" ] || [ -z "${BASE_SHA//0/}" ] || ! git fetch --depth=1 --quiet origin "$BASE_SHA"; then
            echo "::notice::no base commit to measure: comparing with the checked-in baseline"
            exit 0
          fi
          # The base's sources *and* its dependency set, under this change's
          # bench scripts. The base's `mix.exs`/`mix.lock` come along when they
          # differ: a base compiled against this branch's lock is not the base
          # (a bumped dependency, a new one), and the alternative — judging the
          # change against the checked-in baseline recorded on another runner of
          # a class that varies by 2x — turns a dependency-only diff into a coin
          # flip (see docs/testing.md "Perf gate").
          # shellcheck disable=SC2086
          rm -rf $src && git checkout "$BASE_SHA" -- $src $deps
          ( cd packages/ankusa && mix deps.get )
          BENCH_REBASELINE=1 BENCH_BASELINE="$RUNNER_TEMP/base-baseline.json" mise run bench:gate
          # shellcheck disable=SC2086
          rm -rf $src && git checkout HEAD -- $src $deps
          echo "BENCH_BASELINE=$RUNNER_TEMP/base-baseline.json" >> "$GITHUB_ENV"
      - run: mise run bench:gate
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-last
          path: |
            packages/ankusa/bench/last.json
            ${{ runner.temp }}/base-baseline.json
          if-no-files-found: ignore

  # The tenant benches (gauges, dispatch tick, intake, routes:
  # docs/testing.md "Perf gate") assert their own flatness and budgets and have
  # no baseline entry, so they are not part of the base-against-branch
  # measurement — they only rode along inside `mise run bench:gate` until
  # CI-7, where they were 2:33 of the gate's 10.6 min. They are their own job
  # here, obeying the same `bench-scope` decision as the gate and starting with
  # it (CI-10: `needs: bench` made this job wait for the whole gate, 14:24 of
  # wall clock instead of 10:04), so the two benches overlap and share the warm
  # `MIX_ENV=test` tree. Nothing else about the benches changes: same commands,
  # same `BENCH_REBASELINE` skip, same assertions (`mise run bench:tenants`).
  bench-tenant:
    name: bench-tenant
    needs: bench-scope
    if: needs.bench-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          # `bench:tenants` is Mix too — elixir, OTP and cmake — from the same
          # cache entry as the gate beside it (CI-22).
          install_args: elixir erlang cmake
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}-hex" # the default key skips .mise/conf.d/
      # The same entry the `bench` job keeps: both compile the same
      # `MIX_ENV=test` tree with the same task, so both restore it and the
      # first to finish saves (as the two crash drills do with the image
      # cache) — one entry, never two copies of the same `_build`.
      - name: cache mix deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/ankusa/deps
            packages/ankusa/_build
          key: mix-v5-${{ runner.os }}-${{ runner.arch }}-ankusa-bench-${{ hashFiles('.mise.toml') }}-${{ hashFiles('packages/ankusa/mix.lock') }}
          restore-keys: |
            mix-v5-${{ runner.os }}-${{ runner.arch }}-ankusa-bench-${{ hashFiles('.mise.toml') }}-
      - name: rocksdb system deps
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - run: mix local.hex --force && mix local.rebar --force
      - run: mise run bench:tenants

  # The gateway's self-asserting bench (`packages/ankusa_gateway/bench/
  # authz_bench.exs`): the p99 of a `rules` decision, of a cached remote
  # decision and of a warm authentication, and what auth adds to a claim read
  # through the router. No baseline: each case has its own budget. Runs when
  # the diff touches the gateway's code or its bench (`bench-scope`).
  bench-gateway:
    name: bench-gateway
    needs: bench-scope
    if: needs.bench-scope.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          # Mix over core (RocksDB, so cmake), as `bench-tenant`.
          install_args: elixir erlang cmake
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}-hex" # the default key skips .mise/conf.d/
      - name: cache mix deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/ankusa_gateway/deps
            packages/ankusa_gateway/_build
          key: mix-v5-${{ runner.os }}-${{ runner.arch }}-ankusa_gateway-bench-${{ hashFiles('.mise.toml') }}-${{ hashFiles('packages/ankusa_gateway/mix.lock') }}
          restore-keys: |
            mix-v5-${{ runner.os }}-${{ runner.arch }}-ankusa_gateway-bench-${{ hashFiles('.mise.toml') }}-
      - name: rocksdb system deps
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - run: mix local.hex --force && mix local.rebar --force
      - run: mise run bench:gateway

  # The crash-consistency drill (scripts/drills/crash_drill.sh): ENOSPC on a
  # 192 MiB tmpfs, then kill -9 under load; every acked hook must read back.
  crash:
    name: crash drill (ENOSPC, kill -9)
    needs: changes
    if: needs.changes.outputs.drills == 'true'
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          # `test:crash` is `scripts/drills/crash.sh tmpfs`, which runs the
          # drill inside the `ankusa_server` image (docker only); the Elixir,
          # OTP and cmake pins in `.mise.toml` are what that image's `FROM`
          # tracks, so they stay declared here as the plan's set, from the
          # `ankusa` package job's cache entry (CI-22).
          install_args: elixir erlang cmake
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}-hex" # the default key skips .mise/conf.d/
      - name: cache compiled deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/crash
          # The image (Dockerfile) is in the prefix: a change to it must not
          # restore a tree compiled inside another image. A changed lockfile
          # alone reuses the previous tree, and the drill's
          # `mix deps.get --check-locked && mix compile` rebuilds only what
          # changed instead of RocksDB from source (~8 min).
          key: crash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/ankusa_server/Dockerfile') }}-${{ hashFiles('.mise.toml', 'packages/ankusa/mix.lock') }}
          restore-keys: |
            crash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/ankusa_server/Dockerfile') }}-
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The drill runs the image packages/ankusa_server/Dockerfile's build
      # stage pins (`crash.sh` reads the same `FROM` line). ~100 MB a run from
      # Docker Hub, and the two drill jobs use one entry: both restore, the
      # first to finish saves.
      - name: the drill's base image
        id: base-image
        run: |
          set -euo pipefail
          ref=$(sed -n 's/^FROM \(elixir:[^ ]*\) AS build$/\1/p' packages/ankusa_server/Dockerfile)
          [ -n "$ref" ] || {
            echo "::error::no 'FROM elixir:… AS build' line in packages/ankusa_server/Dockerfile"
            exit 1
          }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: use the containerd image store
        run: scripts/ci/images.sh containerd
      - name: cache the drill's base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/docker-images
          key: images-v1-${{ runner.os }}-${{ runner.arch }}-crash-${{ hashFiles('packages/ankusa_server/Dockerfile') }}
          restore-keys: |
            images-v1-${{ runner.os }}-${{ runner.arch }}-crash-
      - name: load the drill's base image
        run: scripts/ci/images.sh sync "${{ runner.temp }}/docker-images" "${{ steps.base-image.outputs.ref }}"
      - run: mise run test:crash
      - name: save the drill's base image
        if: always()
        run: scripts/ci/images.sh save "${{ runner.temp }}/docker-images" "${{ steps.base-image.outputs.ref }}"
      # The drill runs as root inside its container, so every file it wrote to
      # the .cache/crash mount is root-owned — and the cache action's post step
      # (a tar as the runner user) cannot read them, so the cache was never
      # saved and every run recompiled RocksDB and the rest of the deps from
      # source (~8 min). Hand the tree back before that post step. `always()`:
      # a failed drill still leaves an entry the next run can restore.
      - name: make the compiled-deps cache readable
        if: always()
        run: |
          [ -d .cache/crash ] || exit 0
          sudo chown -R "$(id -u):$(id -g)" .cache/crash

  # The same drill on ext4 over device-mapper (I/O error windows, then a
  # power-loss cut), which is what catches a hook acked without an fsync.
  # It needs a runner whose kernel lets a privileged container use loop and
  # device-mapper devices (GitHub's ubuntu-latest does). Exit 2 means a runner
  # that does not, and the step reports a skip; any other failure fails the job.
  crash-powerloss:
    name: crash drill (power-loss cut, device-mapper)
    needs: changes
    if: needs.changes.outputs.drills == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cache compiled deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/crash
          # The image (Dockerfile) is in the prefix: a change to it must not
          # restore a tree compiled inside another image. A changed lockfile
          # alone reuses the previous tree, and the drill's
          # `mix deps.get --check-locked && mix compile` rebuilds only what
          # changed instead of RocksDB from source (~8 min).
          key: crash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/ankusa_server/Dockerfile') }}-${{ hashFiles('.mise.toml', 'packages/ankusa/mix.lock') }}
          restore-keys: |
            crash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/ankusa_server/Dockerfile') }}-
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Same base image and cache entry as the tmpfs drill above: both
      # restore, the first to finish saves.
      - name: the drill's base image
        id: base-image
        run: |
          set -euo pipefail
          ref=$(sed -n 's/^FROM \(elixir:[^ ]*\) AS build$/\1/p' packages/ankusa_server/Dockerfile)
          [ -n "$ref" ] || {
            echo "::error::no 'FROM elixir:… AS build' line in packages/ankusa_server/Dockerfile"
            exit 1
          }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: use the containerd image store
        run: scripts/ci/images.sh containerd
      - name: cache the drill's base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/docker-images
          key: images-v1-${{ runner.os }}-${{ runner.arch }}-crash-${{ hashFiles('packages/ankusa_server/Dockerfile') }}
          restore-keys: |
            images-v1-${{ runner.os }}-${{ runner.arch }}-crash-
      - name: load the drill's base image
        run: scripts/ci/images.sh sync "${{ runner.temp }}/docker-images" "${{ steps.base-image.outputs.ref }}"
      - name: scripts/drills/flakey.sh
        run: |
          rc=0
          scripts/drills/flakey.sh || rc=$?
          if [ "$rc" = 2 ]; then
            echo "::notice::the runner cannot run the device-mapper drill; skipped"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
      - name: save the drill's base image
        if: always()
        run: scripts/ci/images.sh save "${{ runner.temp }}/docker-images" "${{ steps.base-image.outputs.ref }}"
      # Same root-owned cache as the tmpfs job above; the `if:` keeps this step
      # after a skipped drill too (a runner without device-mapper still warms
      # nothing, and the chown is a no-op when the container never wrote).
      - name: make the compiled-deps cache readable
        if: always()
        run: |
          [ -d .cache/crash ] || exit 0
          sudo chown -R "$(id -u):$(id -g)" .cache/crash

  # CI-5: what the run did, and the one job that fails when the filter itself
  # did not work. `if: always()` so it reports even when every other job was
  # skipped: without it, a `changes` job that broke would leave a run that is
  # green because nothing ran.
  ci-summary:
    name: ci-summary
    needs:
      - changes
      - lint
      - package
      - ankusa-static
      - ankusa-test
      - ankusa-coverage
      - integration
      - conformance
      - examples
      - tools
      - bench-scope
      - bench
      - bench-tenant
      - bench-gateway
      - crash
      - crash-powerloss
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: the per-job result table
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CHANGES: ${{ needs.changes.result }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          set -uo pipefail
          # The jobs API is where a matrix job appears leg by leg (`needs`
          # only aggregates it) and where the real durations are. Read with the
          # run's own token: no third-party action to pin, no extra permission.
          rows=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
            -q '.jobs[]
                | select(.name != "ci-summary")
                | [.name, (.conclusion // "-"),
                   (if .started_at and .completed_at
                    then (((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 * 10 | round / 10 | tostring)
                    else "-" end)]
                | @tsv' 2>/dev/null) || rows=""

          table() {
            echo "| job | result | minutes |"
            echo "| --- | --- | --- |"
            if [ -n "$rows" ]; then
              printf '%s\n' "$rows" | while IFS=$'\t' read -r name result minutes; do
                printf '| %s | %s | %s |\n' "$name" "$result" "$minutes"
              done
            else
              echo "| (the jobs API returned nothing) | - | - |"
            fi
          }

          {
            echo "## CI"
            echo
            if [ -n "$REASON" ]; then
              echo "**The \`changes\` job decided:** $REASON"
              echo
            fi
            table
            echo
            echo "A job reported \`skipped\` because the diff cannot have touched it; the decision, the diff it read and the jobs it chose are in the \`changes\` job's log."
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # The filter is the only thing standing between a diff and its gates,
          # so a `changes` job that did not finish fails the run instead of
          # leaving it green with every gated job skipped. A run cancelled by a
          # newer push is not a filter failure.
          case "$CHANGES" in
            success) ;;
            cancelled)
              echo "::notice::the changes job was cancelled with the run; nothing to judge"
              ;;
            *)
              echo "::error::the changes job did not succeed ($CHANGES), so every gated job was skipped"
              exit 1
              ;;
          esac
