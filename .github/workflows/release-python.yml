name: Release (Python)

# Tag-driven PyPI publish for packages/sdk-python (published as the `ankusa`
# package on PyPI), the same shape as release-npm.yml's npm flow — its own
# tag prefix, `sdk-python-v*` (the directory name), distinct from the Hex
# core package's `ankusa-v*` and the npm SDK's `sdk-typescript-v*`; PyPI's
# `ankusa` project is unrelated to either. Tagged by
# `mise run release:tag sdk-python`.
#
# Publishes via PyPI Trusted Publishing (OIDC): no long-lived token secret
# in this repo. One-time setup on pypi.org: until the `ankusa` project exists
# there is no project settings page to use, so register a *pending* trusted
# publisher under Account -> Publishing (pypi.org/manage/account/publishing/),
# with Project Name `ankusa`, Owner `jamescarr`, Repository `ankusa`, Workflow
# `release-python.yml`, Environment `pypi`. The first successful run creates
# and binds the project. Until that publisher exists this workflow's publish
# step fails with `invalid-publisher` (no matching publisher), which leaves
# the tag pushed and unpublished rather than publishing anything wrong. See
# docs/releasing.md.

on:
  push:
    tags:
      - "sdk-python-v*"

concurrency:
  group: release-python-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          source .mise/lib/pkg.sh
          PKG=$(pkg_from_tag "$GITHUB_REF_NAME")
          [ "$(pkg_kind "$PKG")" = python ] || fail "$GITHUB_REF_NAME is not a Python package tag"
          VERSION="${GITHUB_REF_NAME#"$PKG"-v}"
          PKG_VERSION=$(pkg_version "$PKG")
          [ "$PKG_VERSION" = "$VERSION" ] || fail "tag $VERSION != $(pkg_dir "$PKG")/pyproject.toml $PKG_VERSION"
          pkg_has_heading "$PKG" "$VERSION" || fail "$(pkg_dir "$PKG")/CHANGELOG.md has no '## [$VERSION]' heading"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  ci:
    name: Run full test suite
    needs: resolve
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI + GitHub release
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Job-level permissions replace the workflow's rather than extending
      # them, so `contents: write` has to be repeated here or `gh release
      # create` below gets a 403.
      contents: write
      id-token: write # PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      # Pinned to .mise/conf.d/sdk-python.toml's uv, the one `mise run
      # check:package sdk-python` built and tested with: setup-uv's default
      # floats, which would let the release be built by a toolchain nothing
      # here ever validated.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.16"

      - name: uv build
        working-directory: packages/sdk-python
        run: uv build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-python/dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          source .mise/lib/pkg.sh && pkg_notes sdk-python "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
