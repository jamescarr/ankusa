name: Release

# Tag-driven Hex publish, the Elixir norm: a package's own git tag
# (`<pkg>-vX.Y.Z`) triggers its release, not a push to `main`. See
# docs/deployment.md#releasing for the full flow, including the ordering
# constraint (core publishes before the adapters).
#
# Requires a `HEX_API_KEY` repository secret (hex.pm dashboard → API keys,
# scoped to `api:write`).

on:
  push:
    tags:
      - "ankusa-v*"
      - "ankusa_postgres-v*"
      - "ankusa_rabbitmq-v*"
      - "ankusa_kafka-v*"
      - "ankusa_nats-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve package from tag
    runs-on: ubuntu-latest
    outputs:
      pkg: ${{ steps.resolve.outputs.pkg }}
      dir: ${{ steps.resolve.outputs.dir }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          TAG="$GITHUB_REF_NAME"; PKG="${TAG%-v*}"; VERSION="${TAG##*-v}"
          case "$PKG" in
            ankusa) DIR=. ;;
            ankusa_postgres|ankusa_rabbitmq|ankusa_kafka|ankusa_nats) DIR="$PKG" ;;
            *) echo "::error::unknown package in tag $TAG"; exit 1 ;;
          esac

          MIX_VERSION=$(sed -n 's/^  @version "\(.*\)"$/\1/p' "$DIR/mix.exs")
          [ "$MIX_VERSION" = "$VERSION" ] || { echo "::error::tag $VERSION != mix.exs $MIX_VERSION"; exit 1; }

          grep -q "^## \[$VERSION\]" "$DIR/CHANGELOG.md" || { echo "::error::no CHANGELOG entry for $VERSION"; exit 1; }

          {
            echo "pkg=$PKG"
            echo "dir=$DIR"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  ci:
    name: Run full test suite
    needs: resolve
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to Hex + GitHub release
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    env:
      OTP_VERSION: "29.0"
      ELIXIR_VERSION: "1.20.4"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: mix deps.get
        working-directory: ${{ needs.resolve.outputs.dir }}
        run: mix deps.get

      - name: MIX_ENV=prod mix deps.get
        working-directory: ${{ needs.resolve.outputs.dir }}
        run: MIX_ENV=prod mix deps.get

      - name: Publish package
        working-directory: ${{ needs.resolve.outputs.dir }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: MIX_ENV=prod mix hex.publish package --yes

      - name: Publish docs
        working-directory: ${{ needs.resolve.outputs.dir }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish docs --yes

      - name: Create GitHub release
        working-directory: ${{ needs.resolve.outputs.dir }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
