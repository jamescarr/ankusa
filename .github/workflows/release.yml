name: Release

# Tag-driven Hex publish, the Elixir norm: a package's own git tag
# (`<pkg>-vX.Y.Z`, where <pkg> is its directory under packages/) triggers its
# release, not a push to `main`. The tag is cut by `mise run release:tag`
# after `mise run release:prepare` has bumped the version and dated the
# CHANGELOG in a merged PR; see docs/releasing.md for the full flow, including
# the ordering constraint (core publishes before the adapters, enforced by
# release:preflight). This workflow verifies the tag rather than trusting it.
#
# Requires a `HEX_API_KEY` repository secret (hex.pm dashboard → API keys,
# scoped to `api:write`).

on:
  push:
    # Every Hex package is `ankusa`, `ankusa_<adapter>`, or `sdk-elixir` (the
    # Hex name `ankusa_sdk` does not match its directory), so a new adapter
    # needs no edit here. The server image has its own workflow (docker.yml).
    tags:
      - "ankusa*-v*"
      - "sdk-elixir-v*"
      - "!ankusa_server-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve package from tag
    runs-on: ubuntu-latest
    outputs:
      pkg: ${{ steps.resolve.outputs.pkg }}
      dir: ${{ steps.resolve.outputs.dir }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          source .mise/lib/pkg.sh
          PKG=$(pkg_from_tag "$GITHUB_REF_NAME")
          VERSION="${GITHUB_REF_NAME#"$PKG"-v}"
          [ "$(pkg_kind "$PKG")" = hex ] || fail "$GITHUB_REF_NAME is not a Hex package tag"

          MIX_VERSION=$(pkg_version "$PKG")
          [ "$MIX_VERSION" = "$VERSION" ] || fail "tag $VERSION != $(pkg_dir "$PKG")/mix.exs $MIX_VERSION"
          pkg_has_heading "$PKG" "$VERSION" || fail "no CHANGELOG entry for $VERSION"

          {
            echo "pkg=$PKG"
            echo "dir=$(pkg_dir "$PKG")"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  ci:
    name: Run full test suite
    needs: resolve
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to Hex + GitHub release
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.11
          cache_key: "{{default}}-${{ hashFiles('.mise/conf.d/*.toml') }}" # the default key skips .mise/conf.d/
      - run: mix local.hex --force && mix local.rebar --force

      - name: mix deps.get
        working-directory: ${{ needs.resolve.outputs.dir }}
        run: mix deps.get

      - name: MIX_ENV=prod mix deps.get
        working-directory: ${{ needs.resolve.outputs.dir }}
        run: MIX_ENV=prod mix deps.get

      - name: Publish package
        working-directory: ${{ needs.resolve.outputs.dir }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: MIX_ENV=prod mix hex.publish package --yes

      - name: Publish docs
        working-directory: ${{ needs.resolve.outputs.dir }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish docs --yes

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ needs.resolve.outputs.pkg }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          source .mise/lib/pkg.sh && pkg_notes "$PKG" "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
