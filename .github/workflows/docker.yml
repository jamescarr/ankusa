name: Docker image

# Builds and smoke-tests the jamescarr/ankusa image on every relevant change, and
# publishes it on a server tag. The tag is the release: `ankusa_server-vX.Y.Z`
# is cut by `mise run release:tag ankusa_server`, which runs the same preflight
# checks this workflow's `resolve` job repeats (a tag can be pushed by anyone,
# so the workflow verifies rather than trusts).
#
# Note on the filters below: path filters are not evaluated for tag pushes, so
# `ankusa_server-v*` always builds regardless of which files the tagged commit
# touched — which is what a release needs.

on:
  push:
    branches: [main]
    tags: ["ankusa_server-v*"]
    paths:
      - "packages/ankusa*/**"
      - "packages/async_api_spex/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "packages/ankusa*/**"
      - "packages/async_api_spex/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - ".github/workflows/ci.yml"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  IMAGE: jamescarr/ankusa

jobs:
  resolve:
    name: Resolve version and tags
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tags: ${{ steps.resolve.outputs.tags }}
      push: ${{ steps.resolve.outputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: resolve
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            source .mise/lib/pkg.sh
            PKG=$(pkg_from_tag "$GITHUB_REF_NAME")
            [ "$(pkg_kind "$PKG")" = docker ] || fail "$GITHUB_REF_NAME is not a Docker image tag"
            VERSION="${GITHUB_REF_NAME#"$PKG"-v}"
            MIX_VERSION=$(pkg_version "$PKG")
            [ "$MIX_VERSION" = "$VERSION" ] || fail "tag ${VERSION} != $(pkg_dir "$PKG")/mix.exs ${MIX_VERSION}"
            pkg_has_heading "$PKG" "$VERSION" ||
              fail "$(pkg_dir "$PKG")/CHANGELOG.md has no '## [$VERSION]' heading"

            if [ "${VERSION}" != "${VERSION#*-}" ]; then
              # A prerelease gets only its exact tag: nothing should be able to
              # pull `latest` and get an rc.
              TAGS="$VERSION"
            else
              MAJOR="${VERSION%%.*}"
              MINOR="${VERSION#*.}"; MINOR="${MINOR%%.*}"
              TAGS="$VERSION,$MAJOR.$MINOR,latest"
              [ "$MAJOR" -ge 1 ] && TAGS="$TAGS,$MAJOR"
            fi
            PUSH=true
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION=""
            TAGS="edge,sha-${GITHUB_SHA:0:7}"
            PUSH=true
          else
            VERSION=""
            TAGS=""
            PUSH=false
          fi

          {
            echo "version=$VERSION"
            echo "tags=$TAGS"
            echo "push=$PUSH"
          } >> "$GITHUB_OUTPUT"

          echo "version=${VERSION:-<none>} tags=${TAGS:-<none>} push=$PUSH"

  # The full test suite, on tag runs only: a release must not ship an image
  # built from code that does not pass CI. Branch and PR runs already get CI
  # from the main workflow.
  ci:
    name: Run full test suite
    if: ${{ github.ref_type == 'tag' }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build and smoke (${{ matrix.platform }})
    needs: [resolve, ci]
    # `ci` is skipped on non-tag runs, and a job that needs a skipped job is
    # itself skipped — so the condition is explicit rather than implied.
    if: ${{ always() && needs.resolve.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    env:
      # Fork PRs get no secrets; skip the login there rather than fail it.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds, no QEMU: an emulated arm64 build of a BEAM release
          # plus a C++ NIF takes long enough to time out.
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before buildx: setup-buildx pulls moby/buildkit and the build pulls
      # the base images, all from Docker Hub. Also the push credentials below.
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Build (loaded locally so it can be smoke-tested)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/ankusa_server/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The same script `mise run docker:smoke` runs: demo hook accepted then
      # deduped, metrics, config with no credentials, and exit 78 on a bad
      # config. An image that fails this never reaches Docker Hub.
      - name: Smoke test
        run: packages/ankusa_server/scripts/smoke.sh ${{ env.IMAGE }}:test

      # Push per-architecture digests; the `merge` job below combines them into
      # one multi-arch tag set, which is what makes `docker pull` pick the right
      # platform. Each digest carries an SBOM (SPDX, from the digest-pinned
      # BuildKit Syft scanner) and a max-detail SLSA provenance attestation;
      # `merge` refuses an index that lacks either, and signs it.
      - name: Push by digest
        id: push
        if: ${{ needs.resolve.outputs.push == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/ankusa_server/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          sbom: generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          provenance: mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record digest
        if: ${{ needs.resolve.outputs.push == 'true' }}
        run: |
          set -euo pipefail
          echo "${{ steps.push.outputs.digest }}" > "$RUNNER_TEMP/digest-${{ matrix.arch }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ needs.resolve.outputs.push == 'true' }}
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge digests into tags, sign, verify
    needs: [resolve, build]
    # `ci` is skipped on non-tag runs, and a skipped ancestor fails the implied
    # `success()` even when `build` succeeded — hence the explicit condition.
    if: ${{ always() && needs.build.result == 'success' && needs.resolve.outputs.push == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The keyless cosign signature: GitHub's OIDC token is the signing
      # identity (Fulcio certificate, Rekor entry), so there is no key to leak.
      id-token: write
    steps:
      # The smoke script and its TLS fixtures come from the commit being published.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the tag set
        env:
          TAGS: ${{ needs.resolve.outputs.tags }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/digests"

          args=()
          IFS=',' read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            args+=("-t" "${IMAGE}:${tag}")
          done

          # Each file holds one `sha256:...` digest written by `build`.
          for f in *; do
            args+=("${IMAGE}@$(cat "$f")")
          done

          docker buildx imagetools create "${args[@]}"

      - name: Resolve the index digest
        id: index
        env:
          TAGS: ${{ needs.resolve.outputs.tags }}
        run: |
          set -euo pipefail
          first="${TAGS%%,*}"
          docker buildx imagetools inspect "${IMAGE}:${first}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${first}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no index digest for ${IMAGE}:${first} (got '$digest')"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${first} is ${digest}"

      # An index without an SPDX SBOM and a SLSA provenance attestation for both
      # platforms is not a release: stop before signing it.
      - name: Require an SBOM and provenance for both platforms
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          sbom=$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .SBOM}}')
          echo "$sbom" | jq -e '(keys | sort) == ["linux/amd64", "linux/arm64"] and all(.[]; (.SPDX.packages | length) > 0)' >/dev/null ||
            { echo "::error::${IMAGE}@${DIGEST} lacks an SPDX SBOM for linux/amd64 and linux/arm64"; exit 1; }
          prov=$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Provenance}}')
          echo "$prov" | jq -e '(keys | sort) == ["linux/amd64", "linux/arm64"] and all(.[]; .SLSA.buildDefinition != null and .SLSA.runDetails != null)' >/dev/null ||
            { echo "::error::${IMAGE}@${DIGEST} lacks SLSA provenance for linux/amd64 and linux/arm64"; exit 1; }
          echo "SBOM packages per platform: $(echo "$sbom" | jq -c 'map_values(.SPDX.packages | length)')"
          echo "provenance builder: $(echo "$prov" | jq -c 'map_values(.SLSA.runDetails.builder.id)')"

      # Keyless: the signing certificate names this workflow run (Fulcio) and
      # the signature lands in the public Rekor log. The index digest is signed,
      # so a tag that later moves is no longer the signed image.
      - name: Sign the index with cosign
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # The published artifact, by digest, through the same smoke script that
      # gated the local build: it first runs `cosign verify` against the
      # signature just made (identity: this repo's docker.yml on main or a server
      # tag), then starts the image Docker Hub serves and exercises it.
      - name: Smoke test the signed image (cosign verify)
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: packages/ankusa_server/scripts/smoke.sh "${IMAGE}@${DIGEST}"

  publish-meta:
    name: Docker Hub description + GitHub release
    needs: [resolve, merge]
    if: ${{ github.ref_type == 'tag' && needs.resolve.outputs.push == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The repo description on Docker Hub is the README operators land on when
      # they search for the image.
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        # Cosmetic (the Docker Hub repo page's README), and known to 403 with
        # a token that has push-only scope: must not block the GitHub release
        # below, which carries the actual release notes.
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: packages/ankusa_server/README.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          source .mise/lib/pkg.sh && pkg_notes ankusa_server "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
