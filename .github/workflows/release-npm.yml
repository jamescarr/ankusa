name: Release (npm)

# Tag-driven npm publish for packages/sdk-typescript (published as the `ankusa`
# package), the same shape as release.yml's Hex flow — but its own tag
# prefix, `sdk-typescript-v*` (the directory name), distinct from the Hex core
# package's `ankusa-v*`. The npm package is also named `ankusa`; sharing a tag
# prefix would make the two releases ambiguous. Tagged by
# `mise run release:tag sdk-typescript`.
#
# Authenticates through npm Trusted Publishing (OIDC) when the repository
# variable NPM_AUTH is "oidc" (it is: sdk-typescript-v0.6.0 was the first
# publish through it). The trusted publisher on npmjs.com (repo
# jamescarr/ankusa, workflow release-npm.yml, no environment) must allow
# `npm publish` under Allowed actions: entries created after 2026-09-03 allow
# only `npm stage publish` by default, and this job's direct `npm publish` then
# fails with "403 … OIDC permission denied for this action". A new entry also
# expires unless its first publish lands within 2 days. Unset NPM_AUTH (or any
# other value) falls back to an `NPM_TOKEN` repository secret, a granular token
# with publish rights that bypasses 2FA; npm is restricting those for direct
# publishing, so the fallback is on its way out. See docs/releasing.md.

on:
  push:
    tags:
      - "sdk-typescript-v*"

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # for npm provenance

jobs:
  resolve:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: resolve
        run: |
          source .mise/lib/pkg.sh
          PKG=$(pkg_from_tag "$GITHUB_REF_NAME")
          [ "$(pkg_kind "$PKG")" = npm ] || fail "$GITHUB_REF_NAME is not an npm package tag"
          VERSION="${GITHUB_REF_NAME#"$PKG"-v}"
          PKG_VERSION=$(pkg_version "$PKG")
          [ "$PKG_VERSION" = "$VERSION" ] || fail "tag $VERSION != $(pkg_dir "$PKG")/package.json $PKG_VERSION"
          pkg_has_heading "$PKG" "$VERSION" || fail "$(pkg_dir "$PKG")/CHANGELOG.md has no '## [$VERSION]' heading"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  ci:
    name: Run full test suite
    needs: resolve
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm + GitHub release
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Token mode needs setup-node's registry-url: it writes the .npmrc
      # line that makes NODE_AUTH_TOKEN below actually authenticate.
      - name: Set up Node (token auth)
        if: vars.NPM_AUTH != 'oidc'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # OIDC mode must NOT set registry-url: the placeholder it leaves in
      # .npmrc for an unset NODE_AUTH_TOKEN turns npm's refusal into a
      # misleading "package not found" instead of a clean auth error.
      - name: Set up Node (OIDC auth)
        if: vars.NPM_AUTH == 'oidc'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Trusted publishing needs npm >= 11.5.1; don't rely on whatever
      # setup-node's Node 24 bundles.
      - name: Upgrade npm for trusted publishing
        if: vars.NPM_AUTH == 'oidc'
        run: npm install -g npm@^11.5.1

      - name: npm ci
        working-directory: packages/sdk-typescript
        run: npm ci

      - name: npm run build
        working-directory: packages/sdk-typescript
        run: npm run build

      - name: Publish package
        working-directory: packages/sdk-typescript
        env:
          NODE_AUTH_TOKEN: ${{ vars.NPM_AUTH != 'oidc' && secrets.NPM_TOKEN || '' }}
        run: npm publish --provenance --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          source .mise/lib/pkg.sh && pkg_notes sdk-typescript "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
