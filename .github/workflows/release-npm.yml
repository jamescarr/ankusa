name: Release (npm)

# Tag-driven npm publish for packages/sdk-typescript (published as the `ankusa`
# package), the same shape as release.yml's Hex flow — but its own tag
# prefix, `sdk-typescript-v*` (the directory name), distinct from the Hex core
# package's `ankusa-v*`. The npm package is also named `ankusa`; sharing a tag
# prefix would make the two releases ambiguous. Tagged by
# `mise run release:tag sdk-typescript`.
#
# Requires an `NPM_TOKEN` repository secret: an npmjs.com Automation access
# token (so it isn't blocked by 2FA-on-publish), scoped to publish. See
# docs/releasing.md.

on:
  push:
    tags:
      - "sdk-typescript-v*"

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # for npm provenance

jobs:
  resolve:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          source .mise/lib/pkg.sh
          PKG=$(pkg_from_tag "$GITHUB_REF_NAME")
          [ "$(pkg_kind "$PKG")" = npm ] || fail "$GITHUB_REF_NAME is not an npm package tag"
          VERSION="${GITHUB_REF_NAME#"$PKG"-v}"
          PKG_VERSION=$(pkg_version "$PKG")
          [ "$PKG_VERSION" = "$VERSION" ] || fail "tag $VERSION != $(pkg_dir "$PKG")/package.json $PKG_VERSION"
          pkg_has_heading "$PKG" "$VERSION" || fail "$(pkg_dir "$PKG")/CHANGELOG.md has no '## [$VERSION]' heading"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  ci:
    name: Run full test suite
    needs: resolve
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm + GitHub release
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: npm ci
        working-directory: packages/sdk-typescript
        run: npm ci

      - name: npm run build
        working-directory: packages/sdk-typescript
        run: npm run build

      - name: Publish package
        working-directory: packages/sdk-typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          source .mise/lib/pkg.sh && pkg_notes sdk-typescript "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
